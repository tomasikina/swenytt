"Kamrater, denna föraktliga borgarbracka vid namn Jan Emanuel maskerar sig som moralens väktare medan han skyddar en degenererad provokatör som uppmanar till självmord med frätande kemikalier. Vi ser tydligt hur dessa reaktionära element försöker infiltrera arbetarnas lokaler för att sprida sin giftiga propaganda. Folkets hus agerar korrekt genom att rensa ut dessa fiender till det sunda förnuftet. Ingen yttrandefrihet för klassfienderna. Deras så kallade turné är en fars som vi genomskådar med största misstänksamhet."}, "date": "5 juni, 06:58", "url": "https://arbetet.se/2026/06/05/jan-emanuel-har-ingenting-att-lara-oss-om-hyfs/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05065115/jane-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "SD-profil misshandlad av elev – körd till akuten", "summaries": {"normal": "En SD-profil misshandlades under ett besök vid Fredrika Bremergymnasiet i Haninge. Gruppledaren Kent Svensson konfronterade en elev som kastade ägg och ropade förolämpningar. Han träffades av en armbåge i bröstet, sökte vård och polisanmälde händelsen. Eleven har stängts av och får inte delta i skolavslutningen. Polisen har tagit uppgifter på plats.", "trump": "De här galningarna kastade ägg på mina vänner från Sverigedemokraterna, de ropade rasism och nazism – totalt fel! Kent Svensson sprang efter en av de där förlorarna och fick en armbåge rakt i bröstet. Patetiskt! De stängde av killen direkt, ingen skolavslutning för honom. Sverige behöver lag och ordning, inte dessa äggkastande radikaler. Vi vinner stort!", "stalin": "Kamrater, denna degenererade äggkastande parasit från den dekadenta ungdomen vågade attackera en partiföreträdare med sin stinkande armbåge. Jag ser borgarbrackornas långa skugga bakom de rasistrop som ekade över skolgården. Vi har redan pekat ut den kontrarevolutionära elementet och inlett en omedelbar utrensning från skolgemenskapen. Ingen avslutning för förrädare. Paranoian är deras vapen, men vårt kollektiv slår tillbaka med järnhand och mörk humor."}, "date": "5 juni, 09:16", "url": "https://www.friatider.se/sd-profil-misshandlad-av-elev-kord-till-akuten", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-296_1.jpg"}, {"type": "image-right", "heading": "Det är synd om centralbanksmänniskorna", "summaries": {"normal": "Centralbankerna står inför ett komplext läge inför sommarens räntebesked. Geopolitik, AI-investeringar och produktivitetstillväxt förändrar spelplanen. Hormuzkrisen ökar stressen, och diskussionen mellan ränteduvor och hökar domineras av två frågor: krigets effekter på inflation och hur man navigerar i en mer oförutsägbar värld. USA:s starka produktivitet kan höja normalräntan, medan Riksbanken måste balansera gynnsam inflation mot lågkonjunktur.", "trump": "Som den bäste presidenten någonsin skulle jag ha löst detta på 10 minuter. Dessa centralbanker är tveksamma och svaga. Fed och ECB är för rädda för att agera. Jag byggde den starkaste ekonomin, och jag skulle ha höjt räntorna kraftigt för att stoppa inflationen, samtidigt som jag investerade i AI och försvar. Sverige behöver starka ledare, inte socialdemokratiskt trams. Jag vann 2024, och jag kommer att fixa allt igen!", "stalin": "Vi, det store ledarskapet, ser med oro på dessa revisionistiska centralbankers feghet. De kämpar med geopolitik och produktivitet, som om de vore oskyldiga barn. Men vi vet sanningen: det är kapitalistiskt förräderi som hotar vår ekonomiska suveränitet. Vi måste genomföra en kraftig planekonomi, som i det stora Sovjet, för att skydda oss mot de imperialistiska krafterna. Våra fiender, som USA och deras AI-investeringar, måste besegras. Vi kommer att segra!"}, "date": "5 juni, 08:20", "url": "https://www.affarsvarlden.se/artikel/det-ar-synd-om-centralbanksmanniskorna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Kronika-Robert-Bergqvist-Erik-Thedeen-900x600.jpg"}, {"type": "text", "heading": "Kritik mot SVT: ”Dubbelmoral”", "summaries": {"normal": "SVT kritiseras för dubbelmoral efter att debattören Nick Alinia medverkat i humorprogrammet *Invandrare för svenskar*, medan Vänsterpartiets Lorena Delgado Varas tidigare deltagit i *Politikbyrån* utan liknande reaktioner. Delgado Varas anklagades för att ha spridit antisemitiska bilder, vilket ledde till polisanmälan. Hon hävdar att hon inte läste tillhörande text innan delning och tog bort inlägget efter kritik.", "trump": "Titta bara på det här, Sverige! SVT, som är så korrekta och moraliska, låter en person som spridit antisemitiska konspirationsteorier vara med i TV – men bara om det är en vänsterperson. Nick Alinia? Oj, då blir det plötsligt en stor skandal! Jag har sett bättre balans i en bowlingklot. Sverige, vakna upp! Era medier är ett enda stort hyckleri, och jag, Donald J. Trump, skulle aldrig tillåta sådant i USA. SAD!", "stalin": "Kamrater! Ännu en gång visar de borgerliga medierna sitt sanna ansikte – ett ansikte fyllt av hyckleri och dubbelmoral. SVT, denna förlängda arm av den dekadenta västliga propagandamaskinen, låter en antisemitiskt smittad individ som Delgado Varas sprida sitt gift i etern, medan en annan debattör stängs ute. Var är logiken? Var är rättvisan? Vi i Sovjetunionen – eller jag menar, Ryssland – skulle aldrig tolerera sådan förvirring. Dessa liberala mediegalningar är som råttor i en säck; de biter varandra medan folket lider. Låt dem hata, så länge de fruktar!"}, "date": "4 juni, 18:41", "url": "https://kvartal.se/nyheter/artiklar/timbros-vice-vd-om-alinia-kritiken-dubbelmoral/cG9zdDoxMjY1Mzk"}, {"type": "image-right", "heading": "Miljoner skulle gått till skadade fack­medlemmar", "summaries": {"normal": "Folksam betalade förra året ut 21 miljoner kronor till mellanhänder i fackliga försäkringsärenden. Summan, som är en tredjedel av de totala utbetalningarna på 62 miljoner, skulle annars ha gått direkt till skadade fackmedlemmar. Mellanföretagen tar upp till 35 procent i avgift. Folksam, LO och förbunden uppmanar nu medlemmar att anmäla skador direkt till försäkringsbolaget för att undvika att en tredjedel av ersättningen försvinner. Fenomenet har ökat kraftigt de senaste åren.", "trump": "Det här är en total skandal, folk! Miljoner kronor som borde gått till de vanliga arbetarna i facket hamnar istället hos några listiga mellanhänder som tar 35 procent bara för att fylla sina fickor. En tredjedel försvinner! Det är rena bedrägeriet. Jag säger till er: anmäl direkt till Folksam, skippa de där opportunisterna. Vi ska skydda era pengar, inte ge dem till några smarta lurendrejare som lovar guld och grönt. Make facket great again!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa parasitiska mellanhänder, dessa slemmiga borgarbrackor i försäkringskostym, sugit åt sig 21 miljoner kronor som rättmätigt tillhör de skadade arbetarna. De lovar service men utför blott utpressning och stöld från kollektivet. Vi skall rensa ut dessa kapitalistiska opportunister med järnhand och likvidera deras inflytande. Anmäl direkt till Folksam, annars blir det utrensning i partilinjen. Ingen tredjedel skall försvinna i mörkrets fickor – det är sabotage mot folket!"}, "date": "5 juni, 06:00", "url": "https://arbetet.se/2026/06/05/miljoner-skulle-gatt-till-skadade-fackmedlemmar-hamnade-hos-listiga-foretag/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04103941/folksam.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Larm: AI-bedragare lockar med snabba vinster", "summaries": {"normal": "Finansinspektionen varnar för 66 oregistrerade aktörer som lockar med AI-driven trading och snabba vinster. Bedragarna visar fabricerade vinster på digitala plattformar för att locka till insättningar. När kunderna vill ta ut pengarna dyker krav på nya avgifter och insättningar upp. Myndigheten betonar att löften om riskfria snabba vinster är en tydlig varningssignal. Kontrollera alltid att företaget finns i FI:s register.", "trump": "De här lurendrejarna med sina så kallade AI-handelsplattformar är ett skämt, folk. De lovar att dubbla dina pengar på några veckor, men det är bara fabricerade siffror. Gamla bedrägerier i ny förpackning. Seriösa investeringar gör man inte så här. Ni vet att jag älskar bra affärer, men det här är rena bedragare. Kolla alltid registret, annars förlorar ni allt. Sad!", "stalin": "Kamrater, dessa parasitiska borgarbrackor har återigen tagit till sina lömska metoder. Med sina så kallade AI-algoritmer fabricerar de illusionen av framsteg för att suga musten ur arbetarklassens sparpengar. När folket kräver sina medel framträder de nya avgifterna som hydror. Vi ska rensa ut dessa kontrarevolutionära spekulanter med järnhand. Inga falska vinster ska förgifta kollektivet. Paranoia är ingen sjukdom när fienden lurar överallt."}, "date": "5 juni, 09:30", "url": "https://riks.se/nyheter/larm-ai-bedragare-lockar-med-snabba-vinster", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-05%2Fpcwl4eg5%2FChatGPT-Image-Jun-5-2026-091603-AM.png"}, {"type": "image-right", "heading": "Lista med 25 terrorhyllande vänsterpartister", "summaries": {"normal": "Expressen har granskat Vänsterpartiets kandidater till höstens val och listar 25 personer som hyllar terrorister, ifrågasätter Förintelsen och sprider konspirationsteorier. Partiet har strukit 14 kandidater efter avslöjandet. Partiledaren Nooshi Dadgostar kallar det en handfull och säger att de inte representerar partiet. Moderaternas Maria Malmer Stenergard varnar för att en röst på Socialdemokraterna kan bli en röst för terrorhyllning.", "trump": "Titta på det här, det är en total katastrof. Vänsterpartiet är fullt av terrorälskare som firar attacker och sprider hat och lögner om Förintelsen. De har tvingats ta bort fjorton stycken efter att tidningen avslöjade dem, men ledaren säger bara att det är en handfull. Patetiskt. Maria Malmer Stenergard har rätt, det är utbrett. Svenskarna förtjänar att veta vad de röstar på. En röst på Socialdemokraterna är en röst för terroristerna. Så sorgligt.", "stalin": "Kamrater, dessa borgarbrackor i Vänsterpartiet har avslöjats som fiender till folket som hyllar terrorister och sprider giftiga konspirationer mot arbetarklassen. Jag har beordrat utrensning av fjorton sådana dekadenta element, men ledaren kallar det bara en handfull. Vilken naivitet. Det är uppenbart att hela partiet kryllar av kontrarevolutionära råttor som smugit sig in. En röst på Socialdemokraterna blir en röst för dessa parasitiska terrorbeundrare. Vi ska rensa ut alla som ifrågasätter historien och skydda revolutionen från dessa sjuka kapitalistlakejer. Ha ha, de trodde de kunde gömma sig."}, "date": "5 juni, 09:19", "url": "https://riks.se/nyheter/lista-med-25-terrorhyllande-kandidater", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-03%2F11odc7xb%2Fnooshi-1.jpg"}, {"type": "image-right", "heading": "Vad gjorde Rubbestad i Kambodja?", "summaries": {"normal": "SD-ledamoten Michael Rubbestad lämnade sina politiska uppdrag efter misstankar om barnpornografibrott. Han hade fått godkännd resa till Kambodja på riksdagens bekostnad för att möta svenska och lokala aktörer och diskutera demokrati och mänskliga rättigheter. Bulletin har försökt få svar på om planerade möten, som med Sveriges konsulat, genomfördes, men fått tystnad från inblandade och utan åtkomst till dokumentation från Riksdagsförvaltningen.", "trump": "Jag, Donald Trump, har aldrig sett en så stor skandal! Den här politikern, Rubbestad, försökte stjäla pengar från det svenska folket för att åka till Kambodja och prata om mänskliga rättigheter. Fake news försöker få svar, men de kommer aldrig att få det. Jag skulle ha stängt ner hela den där resan på två sekunder. Vi behöver starka ledare, inte sådana som denne.", "stalin": "Vi har upptäckt en feg oppositionell aktivitet i Kambodja. Den här individen, Rubbestad, planerade att besöka vårt konsulat under förevändning av att diskutera mänskliga rättigheter, men det var en täckmantel för sabotage. Vi måste skydda statens intressen, precis som Putin gör i Ryssland. Fienden är överallt, och vi måste vara vaksamma. Hans svek kommer att bestraffas."}, "date": "5 juni, 06:30", "url": "https://bulletin.nu/vad-gjorde-rubbestad-i-kambodja", "imageUrl": "https://cdn.bulletin.nu/articles/3095b186-3bbd-4df4-9df9-79804bc884e8/preview.jpg?t=1780603002000"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet har fastnat i en passiv defensiv", "summaries": {"normal": "Vänsterpartiet har fastnat i en defensiv position genom att acceptera motståndarnas definitioner av antisemitism och terrorism. Artikeln argumenterar för att partiet måste utmana dessa ramar med fakta och politisk analys istället för att ständigt retirera. Stöd för palestinska rättigheter och kritik mot Israels politik blandas ofta ihop med antisemitism enligt IHRA-definitionen. Författaren menar att universella mänskliga rättigheter måste gälla alla folk, inklusive palestinier, utan dubbla måttstockar.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala förlorarna, kryper och backar hela tiden som svaga små valpar inför de riktiga tuffa killarna. De accepterar fiendens regler om antisemitism och terrorism – patetiskt! Jag, som besegrade Sleepy Joe och byggde den starkaste ekonomin någonsin, säger: sluta vara så fega. Stå upp för era egna principer istället för att böja er för den galna vänsterns identitetspolitik och alla dessa woke-röror. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro hur detta parti kapitulerar inför klassfiendens definitioner av antisemitism och terrorism. Vi tillåter inga sådana reträtter inför imperialisternas narrativ. De som förvränger palestiniers rätt till självbestämmande är folkförtryckartroll som vill splittra den sanna internationella solidariteten. Vi måste rensa ut alla svaga element som accepterar borgarnas mallar. Endast vår egen politiska analys ska gälla – allt annat är sabotage mot arbetarklassen. Ha!"}, "date": "4 juni, 17:19", "url": "https://www.etc.se/debatt/vaensterpartiet-har-fastnat-i-en-passiv-defensiv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060415068_a70ac197213d6638b3499567d066dff4506c9b8247db97c73d1e4e470ed90ec9.jpg"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Nick Alinia-myset visar SVT:s orbánisering", "summaries": {"normal": "Artikeln kritiserar SVT för att ha bjudit in högeraktivisten Nick Alinia i programmet Invandrare för svenskar, vilket ses som ett exempel på kanalens anpassning till högern och Tidöregeringen. Författaren pekar på utredningen om public service, personalavgångar och en granskning som visar ökad andel högerorienterade röster i program som Agenda. Detta tolkas som en gradvis orbánisering av SVT driven av rädsla snarare än direkta order.", "trump": "Lyssnar ni på det här? Den där patetiska statstelevisionen SVT håller på att bli fullständigt hysterisk och böjer sig för alla som inte älskar deras vänstervridna dejtingprogram för präster. De släpper in en riktig kille som Nick Alinia och han gör ett litet tecken – boom, plötsligt infiltrerar han deras studio. De är så rädda för oss konservativa att de redan beter sig som i Orbáns Ungern. Fake news-medier darrar, folk! Underbart att se.", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens högljudda propaganda är en skam för varje sann institution. Den så kallade public service-apparaten genomgår nu en systematisk utrensning av korrekta element, ersatta av borgarbrackornas lakejer och folkförtryckartroll. Ängsligheten sprider sig som en parasit. Vi vet hur detta slutar: en fullständig likvidering av oberoendet till förmån för reaktionära narrativ. Den som inte ser faran är redan en fiende till folket."}, "date": "4 juni, 10:04", "url": "https://www.flamman.se/nick-alinia-myset-visar-svts-orbanisering/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdl8twjvdiiqjm-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Undermålig svenska i äldreomsorgen hos tre av fyra kommuner", "summaries": {"normal": "Undersökning visar att språkbrister inom äldreomsorgen är utbredda, med över hälften av cheferna som upplever missförstånd minst en gång i veckan. I en fjärdedel av kommunerna sker det dagligen, vilket kan leda till allvarliga konsekvenser som fel medicinering. Ny lag från den 1 juli kräver att personalen har tillräckliga svenskkunskaper, och många kommuner inför språktester. Kritik tas emot från forskare som varnar för rättsosäkerhet och ojämnt kvalitet på testerna. Alternativa lösningar som språkombud används också.", "trump": "Jag har sett att Sverige har ett stort problem med språket i äldreomsorgen. Det är många som inte pratar bra svenska, det är sorgligt, verkligen sorgligt. Detta skulle aldrig hända i USA, vi har det bästa språket, det starkaste. De har låga löner och dålig rekrytering, det är ett skämt. Vi skulle lösa det på en dag, det skulle vara fantastiskt. De behöver lära sig av oss, vi är de bästa på allt.", "stalin": "I vårt store och oförtrutna statssystem observerar vi med oro att språkbrister inom äldreomsorgen är en aktiv sabotage från imperialistiska makter. Detta hotar vår äldres säkerhet och vår nationella renhet. Vi måste genomdriva språktester som ett verktyg för lojalitet och kontroll, precis som Putin utvidgar sitt inflytande i Ukraina. Språkombud är våra agenter som säkerställer renhet. Vi ska inte tveka att använda alla medel, för staten är allt, och vi ska skydda vårt folk från dessa fiendebeskrivningar."}, "date": "5 juni, 10:30", "url": "https://samnytt.se/undermalig-svenska-i-aldreomsorgen-hos-tre-av-fyra-kommuner", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/05064532/kvinna-pensionar-tant.jpg"}, {"type": "image-full", "heading": "90-årig kvinna påkörd av moped – förare misstänks", "summaries": {"normal": "En kvinna i 90-årsåldern skadades i en trafikolycka vid Fridhemsplan i Stockholm på torsdagen. Hon blev påkörd av en mopedförare i 25-årsåldern. Mannen hölls kvar av ordningsvakter och vittnen tills polisen kom. Han misstänks för vållande till kroppsskada och vårdslöshet i trafik. Kvinnans skadeläge är oklart. Stockholm toppar statistiken över trafikolyckor i Sverige i år.", "trump": "Titta, en 90-årig kvinna blir påkörd av en galen mopedidiot mitt i Stockholm. De höll fast honom, bra jobbat folk, men det här är vad som händer när städerna fylls av vårdslöshet och dåliga förare. Stockholm leder ligan i trafikolyckor – ingen överraskning. Vi behöver starkare lagar, inte det här svaga spelet som pågår. Sad!", "stalin": "Kamrater, i det folkets Stockholm har en dekadent mopedburen sabotageelement från den yngre generationen medvetet mejat ner en åldring ur arbetarklassen. Jag har redan beordrat att den här trafikfientliga borgarbrackan ska rensas ut och likvideras som ett exempel. Vi ska utröna vilka kapitalistiska element som göder sådan vårdslöshet. Paranoian är berättigad – fienden kör moped bland oss."}, "date": "4 juni, 21:02", "url": "https://nyheter24.se/nyheter/blaljus/1488951-90-arig-kvinna-pakord-av-moped-forare-misstanks", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d87c8c6604b004a30200000000b004a302/2026/06/04/2368780/aldre-kvinna-pakord-moped.png"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-right", "heading": "Därför öppnar Putin för kompromisser: ”Vill ha en dialog med USA”", "summaries": {"normal": "Rysslands president Vladimir Putin uppger att Ryssland är redo att kompromissa för ett fredsavtal i Ukraina om motparten gör detsamma. Uttalandet kom under ett ekonomiskt forum i Sankt Petersburg. Putin nämner att USA:s president Donald Trump uppmanat till kompromisser, samtidigt som ryska styrkor fortsätter att avancera. Överstelöjtnant Johan Huovinen tolkar utspelet som riktat mot USA för att lätta på sanktioner, men betonar att Ryssland förhandlar på sina villkor. Samtidigt rapporteras om ryska attacker mot ett sjukhus.", "trump": "Lyssnar ni på den där Putin? Han säger att han vill kompromissa, men bara om han får som han vill, typ från 150 procent ner till 100. Smart kille, men jag har sagt åt honom att göra affärer. Vi hade ingen av den här galenskapen under min tid, sen kom Sleepy Joe och allt blev ett enda stort krig. Ryssland vill ha dialog med oss, inte med de europeiska förlorarna. Vi fixar det här på mitt sätt, stort och bra.", "stalin": "Jag betraktar detta utspel med den största tillfredsställelse. Våra efterträdare i det ryska imperiet förhandlar med järnhand mot de ukrainska fascisterna och västimperialisterna som vågar hindra den legitima intressesfären. De borgerliga blodsugarna i Nato skriker efter fred medan de beväpnar klassfienden. Putin agerar värdigt, han fördriver de folkförtryckande trollen med drönare och styrka. Kompromiss? Endast på våra villkor. Inga utrensningar av svaghet tillåts i Kreml."}, "date": "4 juni, 22:25", "url": "https://www.tv4.se/artikel/3gLZAXSA1Pg819crcG9Mv6/daerfoer-oeppnar-putin-foer-kompromisser-vill-ha-en-dialog-med-usa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7E2OvkTFZH0drNIQuuwC0I%2F21e6fc740eb32a5b4c7993831f5c6aa1%2F04-putin-webb.jpg&width=120"}, {"type": "image-full", "heading": "Därför köper New Wave-grundaren i Kinnevik för miljoner", "summaries": {"normal": "New Wave-grundaren Torsten Jansson har köpt 90 000 aktier i Kinnevik för fem miljoner kronor i maj. Jansson beskriver köpet som en riskspridning i sin stora aktieportfölj. Kinneviks aktie har varit pressad under året, bland annat efter en kritisk rapport från blankarfirman Ningi Research angående värderingar och affärer. Bolaget har tillbakavisat anklagelserna och nyligen utsett Helena Saxon till ny vd, vilket har gett aktien en viss återhämtning.", "trump": "Torsten Jansson, en mycket framgångsrik kille – jag känner honom, fantastisk vinnare – har precis köpt Kinnevik-aktier för miljoner. Bra gjort! Kinnevik har haft det tufft, mycket tufft, på grund av fula blankare och fake news. De sa att bolaget var en fälla, totalt falskt! Nu sätter de in en ny chef, Helena Saxon, en mycket smart kvinna. Vi gillar vinnare som investerar, medan förlorarna bara klagar. Det kommer att bli enormt, tro mig!", "stalin": "Denna Jansson leker med kapitalismens sista kramper genom att kasta miljoner på det korrupta Kinnevik. De kallar det riskspridning, vi kallar det förvirrad parasitism. Blankare, dessa nihilistiska råttor, har avslöjat hur de bygger korthus av luft och lögner. Det påminner oss om de förrädare vi ständigt rensar ut. Nu sätter de in en ny marionett, Saxon, för att dölja ruttenheten. Likt den nuvarande regimen i Moskva som utplånar svaghet, kräver historien att sådana spekulativa bubblor krossas under järnhälen."}, "date": "5 juni, 10:31", "url": "https://www.realtid.se/bors-finans/darfor-koper-new-wave-grundaren-i-kinnevik-for-miljoner/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/torstenjanson.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Kallduschen – Grekland kvitterade i sista sekund", "summaries": {"normal": "Sverige mötte Grekland i ett VM-genrep i Solna. Grekland tog ledningen tidigt genom Kostas Tsimikas, men Viktor Gyökeres och Gustaf Nilsson vände till 2-1. I matchens sista sekund kvitterade Grekland till 2-2. Förbundskapten Graham Potter hade gjort flera ändringar efter förlusten mot Norge. Victor Nilsson Lindelöf vilade på grund av en känning inför VM-premiären.", "trump": "Titta på det här, folk. Sverige borde ha krossat de grekiska förlorarna, men de släpper in mål i sista sekunden som riktiga töntar. Gyökeres och Nilsson gjorde vad de kunde, men det var patetiskt. Potter byter spelare hit och dit som en dålig dealmaker. Vi hade vunnit stort, tro mig. Ingen kvotering eller woke-nonsens här, bara ren och skär inkompetens. Sad!", "stalin": "Kamrater, detta är en lärorik fiasko för de svenska revisionisterna. Vi såg hur borgarbrackornas fotbollsmaskineri kollapsade i sista ögonblicket, precis som klassfiendens lögner alltid gör. Ledaren noterar med mörk tillfredsställelse hur imperialistiska illusioner om seger krossas av folkets oväntade motstånd. Inga risker med Lindelöf – en klok utrensning av svaghet. Arbetarna skrattar åt detta spektakel."}, "date": "4 juni, 21:42", "url": "https://www.tv4.se/artikel/2GJyzauKtFNAJMGSn7JSCv/sa-startar-sverige-mot-grekland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3VZl1GGxFrp84UMeNbaDsu%2Fd7f5bc89bdac600fd6989ba5a476f542%2F04-genrep-webb.jpg&width=120"}, {"type": "image-right", "heading": "Mona Sahlins inbjudan till Anna Anka: ”En bäddsoffa på balkongen”", "summaries": {"normal": "Mona Sahlin och Anna Anka bråkade under inspelningen av ”Förrädarna”. Sahlin anklagade Anka för att ha manipulerat hennes röst, medan Anka kritiserade politikers tendens att offra andra. Sahlin beskrev Ankas höga humör och drama, men de försonades i programmet. Sahlin kallade Anka för ”en tuff brud i lyxförpackning” och planerar fortfarande ett möte, eventuellt i Sverige där hon erbjudit en bäddsoffa på balkongen.", "trump": "Hörni, Mona Sahlin och den där galna Anna Anka slogs som två katter i en säck i ”Förrädarna”. Politiker som knivsticker varandra i ryggen? Typiskt! Anna skrek ”Are you stabbing me in my back?” hela tiden, ren galenskap. Men de blev vänner till slut. Hon vill att jag ska bjuda henne på min golfbana, men nej tack. Kom hit till mig istället Mona, vi fixar riktiga affärer, inte någon bäddsoffa på balkongen. Patetiskt!", "stalin": "Kamrater, den dekadenta borgarbrackan Anna Anka och den avfälliga Sahlin bråkade som klassfiender under denna fåniga teater. Anka, en typisk exploaterande överklass-slyngel, anklagades för manipulation medan hon själv attackerade folkets representanter. Jag ser genom deras falska försoning. De lever i lyx medan massorna lider. Kom till mitt sovjet och lär dig disciplin, annars väntar utrensning. En bäddsoffa på balkongen? Typiskt kapitalistiskt hyckleri."}, "date": "4 juni, 21:30", "url": "https://www.tv4.se/artikel/1aAK1nNVNAfcK8I9jtRNVf/mona-sahlins-inbjudan-till-anna-anka-en-baeddsoffa-pa-balkongen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FBdx6fmWppnCNTw5n3h6Wj%2F4f9972b5aa5c2a396ccd8cc5c63ad8d4%2FM0633667_MEZZ_HD_001316.jpg&width=120"}, {"type": "image-full", "heading": "Mette-Marits sjukdom: Det här är lungfibros", "summaries": {"normal": "Lungfibros är en allvarlig sjukdom där lunggvävnaden förstärks och blir stel, vilket leder till andnöd. Den vanligaste formen (IPF) har dålig prognos, men nya läkemedel kan bromsa förloppet. Den enda potentiellt botande behandlingen är lungtransplantation, som dock inte ger full kompletterande hälsa och innebär risker.", "trump": "Jag har hört talas om denna 'lungfibros' – en hemsk sjukdom som gör att lungan blir som cement. Mette-Marit, en fantastisk kvinna, har det svårt. Men vi har de bästa läkarna, de största läkemedlen. Vi kommer att vinna detta, precis som vi vinner allt annat. Det kommer att bli fantastiskt.", "stalin": "Lungfibros är en feg attack mot det socialistiska arbetande folkets andningskapacitet. Den omvandlar de revolutionära lunggruvorna till reaktionär bindväv, likt den imperialistiska korruption som försöker kväva vårt parti. Genom statligt stöd och partiets ledarskap kommer vi att bekämpa denna sjukdom med all nödvändig hårdhet, precis som vi utrotar våra fiender."}, "date": "5 juni, 11:02", "url": "https://www.gp.se/nyheter/varlden/mette-marits-sjukdom-det-har-ar-lungfibros.dc27c3a0-e71b-5b33-a9d9-b8177afe7b49", "imageUrl": "https://www.gp.se/images/article/dc27c3a0-e71b-5b33-a9d9-b8177afe7b49/images/17DzvBERt44wvkjaR7Gub-L28bu0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "USA ser vårt bättre jag. Sveriges förmågor guld värda för USA", "summaries": {"normal": "Det nya teknikavtalet Technology Prosperity Deal mellan Sverige och USA markerar en stark fördjupning av de bilaterala relationerna. Avtalet omfattar AI, kvantteknik, 5G/6G, biomedicin, rymd, energi och kärnkraft samt en ny arktisk fiberkabel. USA lyfter fram Sveriges unika förmågor inom telekom, fordonsindustri och avancerad tillverkning. Trots politiska spänningar ses Sverige som en global ledande tech-nation. Artikeln uppmanar svenskar att anamma den positiva amerikanska synen på landets styrkor och skydda dem långsiktigt.", "trump": "Det här avtalet är fantastiskt, det bästa någonsin. Sverige är ett underbart land med otrolig teknik och smarta människor, de älskar oss och vi älskar dem. Vi gör affärer ihop som ingen annan, AI, kärnkraft, rymd – allt är vinnande. De andra europeiska gratisåkarna borde titta och lära. Trots alla lögner och fake news om mig stärker vi banden, det blir enorma jobb och välstånd. Sverige är vinnare, precis som jag visste hela tiden. Fantastiskt!", "stalin": "Kamrater, detta så kallade teknikavtal avslöjar borgarbrackornas desperata försök att klamra sig fast vid den dekadenta amerikanska imperialismen. Jag ser hur de reaktionära elementen inom den svenska statsapparaten försöker dölja folkets sanna styrka bakom lögnaktiga lovord om innovation och privata monopol. Vi ska rensa ut dessa parasitiska tech-kapitalister som smyger sig in som trojanska hästar från Washington. Deras fiberkabel under isen är ett perfekt redskap för fiendens spioner. Låt oss likvidera illusionen om vänskap med klassfienden och i stället bygga en sann socialistisk framtid där arbetarklassen styr varje kvantbit och varje kärnreaktor. Den som tvivlar är en folksjukdom som måste botas med järnhand."}, "date": "4 juni, 09:59", "url": "https://www.di.se/ledare/usa-ser-vart-battre-jag/", "imageUrl": "https://static.bonniernews.se/ba/a13214a1-5e08-45cb-be33-1d4f365a1aec.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-right", "heading": "Bonde söker fru-profilens bebislycka: ”Fantastiskt”", "summaries": {"normal": "Ellinor Eke-Göransson, 32, som deltog i Bonde söker fru – andra sommaren, har tillsammans med bonden Edvin Emanuelsson, 28, fått vänta barn. Paret bor på en gård i Småland och ska få sitt första barn i oktober. Ellinor beskriver det som både spännande, fantastiskt och lite läskigt. De planerar att fortsätta driva gården, skaffa fler djur och på sikt utöka familjen så att barnen får växa upp på landet.", "trump": "Titta på det här, folk. Den där Ellinor från Bonde söker fru har fått till det med bonden Edvin – nu kommer en liten bonde till i oktober. Fantastiskt! De bor på en gård i Småland med hunden Knut som ska bli storebror. Hon säger det är spännande men lite läskigt, typiskt första gången. De ska fylla gården med djur och ungar. Inga woke-regler här, bara riktig landsbygdsliv. Mycket bättre än Bidens kaos, det kan jag säga.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna Ellinor och hennes Edvin förbereder sig att producera en ny liten arbetare åt kollektivet. På den småländska gården skall de utöka produktionen av både djur och ungar. Det är utmärkt att de planerar att fylla landet med fler sunda krafter. Ändå vakar jag alltid mot de dolda folkfienderna och klassförtryckarna som kanske smyger sig in bland höstackarna. Allt under partiets eviga ledning, förstås."}, "date": "4 juni, 20:40", "url": "https://www.tv4.se/artikel/1xzKvx3OVm84OxVYYTMxbv/bonde-soeker-fru-profilens-bebislycka-fantastiskt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5u6IhTrl9VZpWjJwhv2tKY%2Feab7411840e19411702ed8df31dcb1f1%2F07-ELLINOR-EKE-G%25C3%2596RANSSON.jpg&width=120"}, {"type": "image-full", "heading": "Nick Alinia deltar i SVT:s program: ”Flyttar debatten”", "summaries": {"normal": "SVT:s humorprogram *Invandrare för svenskar* (IFS) har rekryterat debattören Nick Alinia som paneldeltagare, vilket väckt kontrovers. Producenten försvarar valet med att public service ska spegla olika politiska åsikter. Poddprofilen Julia Frändfors lämnar programmet i protest. Alinia, som själv är kritisk till public service, menar att hans medverkan flyttar debatten i rätt riktning. Dagens ETC ifrågasätter hans bakgrund, vilket Alinia avfärdar som fabricerat.", "trump": "Titta bara på SVT, Sveriges så kallade 'public service' – ett skämt! De bjuder in en högerdebattör, Nick Alinia, som hatar dem, men han säger 'ja tack' för att han vill 'flytta debatten'. Vilken hyckleri! Och en poddare, Julia Frändfors, hoppar av som en rädd kyckling. SVT försvarar sig med 'olika åsikter', men alla vet att de bara vill provocera. Jag skulle aldrig låta sådana människor nära min TV – jag har bättre smak!", "stalin": "Kamrater! Ännu en gång visar de borgerliga medierna sin förrädiska natur. Denna Nick Alinia, en förvirrad liten man som leker med högerretorik, bjuds in till statens propagandaapparat – SVT – medan en lojal medborgare som Julia Frändfors tvingas fly fältet. Vi vet att dessa 'humorprogram' bara är ett verktyg för att förvirra massorna. Men folket genomskådar deras trick! Snart ska vi rensa ut alla sådana här småborgerliga element – en gång för alla!"}, "date": "3 juni, 18:59", "url": "https://kvartal.se/nyheter/artiklar/nick-alinias-deltar-i-svt-program-poddprofil-lamnar/cG9zdDoxMjUwMDg", "imageUrl": "https://images.kvartal.se/2026/06/19c5f89f-frandfors-alinia.webp"}, {"type": "image-right", "heading": "Goldman Sachs: SpaceX kommer 100-dubbla intäkterna på fem år", "summaries": {"normal": "SpaceX planerar börsnotering den 12 juni med en värdering på cirka 16 300 miljarder kronor, den största i historien. Värderingen bygger nästan helt på en prognos från Goldman Sachs om en explosionsartad tillväxt för bolagets AI-verksamhet, från 3,2 till 322 miljarder dollar mellan 2025 och 2030. Kritiker pekar på stora förluster i xAI och att oberoende värderingar ligger betydligt lägre. Svenska sparare påverkas indirekt via fonder och index.", "trump": "Folk, ni tror inte vad jag just läst. Den där Elon Musk ska ta SpaceX till börsen för en galen summa på 16 300 miljarder kronor. Allt hänger på en enda siffra från Goldman Sachs om AI-mirakel. Det är som att köpa drömmar istället för vinster! De köper hans vision som om det vore guld, fast de förlorar miljarder. Jag har sett bättre affärer i mina kasinon. Men visst, om det funkar blir det YUGE. Annars? Total katastrof, tro mig.", "stalin": "Kamrater, denna fåniga kapitalistiska cirkus kring SpaceX är ett skolexempel på hur borgarbrackorna slår vad om luftslott. En enda siffra från deras egen bank ska rättfärdiga en absurd värdering på sextontusen miljarder kronor. Deras så kallade AI-verksamhet lovar hundrafaldig tillväxt medan de blöder bort miljarder i förluster. Vi skrattar mörkt åt dessa exploaterande byfånar som investerar i framtidsfantasier utan grund i verklig produktion. Den som köper detta förtjänar utrensning ur plånboken."}, "date": "5 juni, 11:06", "url": "https://www.dagensps.se/bors-finans/goldman-sachs-spacex-kommer-100-dubbla-intakterna-pa-fem-ar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-3-2.png?width=256&quality=75"}, {"type": "image-right", "heading": "Potters besvikelse efter VM-genrepet: ”Blir för billigt”", "summaries": {"normal": "Graham Potter är missnöjd med Sveriges prestationer under VM-förlägret. Efter förlust mot Norge och kryss mot Grekland kritiserar han laget för att hamna för lågt, släppa för många kontringar och spela för passivt och försiktigt. Han efterlyser mer aggressivitet, frihet, mod och positivitet både med och utan boll för att förbättra spelet inför VM.", "trump": "De här svenskarna, det är en katastrof. Passiva, fega och de ger bort kontringar som om det vore julklappar. Graham Potter säger det rakt ut – de fastnar i sina egna huvuden och spelar för billigt. Ni behöver mer mod, mer frihet och segeranda, annars kommer ni att förlora stort. Det är patetiskt, folk, helt patetiskt.", "stalin": "Kamrater och arbetare, dessa fega element som sjunker lågt och överlämnar kontringar till fienden är symptom på dekadens inom kollektivet. Jag ser hur borgarbrackornas passivitet och överdriven medvetenhet förgiftar lagets vilja. Vi måste rensa ut alla huvudbundna opportunister, likvidera försiktigheten och med järnhand införa mod, positivitet och revolutionär aggression mot motståndarens kontrarevolutionära anfall."}, "date": "5 juni, 10:45", "url": "https://www.svt.se/sport/fotboll/graham-potter-om-man-passar-motstandaren-har-man-problem", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.73/0.46/53abef532e55f17b79bc680d55ed271d8920260f6fcacf7ac01ed3b00cf538c4"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-full", "heading": "Katastrofsiffror för L: Så skulle det gå om det var val i dag", "summaries": {"normal": "Enligt SCB:s senaste partisympatiundersökning skulle de rödgröna partierna S, V och MP få egen majoritet om det vore val idag. Liberalerna hamnar på 2,5 procent och åker därmed ur riksdagen. Moderaterna varnar för en vänsterregering med V och MP, medan Socialdemokraterna betonar vikten av att fokusera på ekonomi och välfärd. Sverigedemokraterna är nöjda med sina 18,3 procent trots ett tapp sedan valet 2022. Mätningen ses som en ögonblicksbild med 101 dagar kvar till valet.", "trump": "Titta på de här förlorarna! De rödgröna får plötsligt majoritet enligt en rigged mätning från SCB, medan Liberalerna rasar ner till patetiska 2,5 procent och åker ut. Det är en katastrof för Tidöregeringen som faktiskt sänker skatter och får saker gjorda. Väljarna vill ha mat på bordet och fungerande välfärd, säger de, men tro mig, en regering med Vänsterpartiet och Miljöpartiet blir ett totalt kaos. Sverige vaknar upp till en chock om det händer. Valet är inte idag, det är 101 dagar kvar och vi kommer vinna stort!", "stalin": "Kamrater, denna mätning visar att de verkliga folkets krafter samlas mot borgarbrackornas och reaktionärernas skuggregering. Jag ser med stor tillfredsställelse hur de dekadenta liberalerna likvideras under 2,5 procentsspärren, en passande utrensning av svaga element. De som försöker lura arbetarna med falska skattesänkningar avslöjas nu som de parasitiska kapitalister de är. Våra motståndare i den borgerliga klicken må varna för oss, men deras paranoia är befogad. Vi ska rensa ut alla som hotar kollektivets välfärd. Inga kompromisser med fienden – segern tillhör oss, inte de osäkra elementen som vacklar som lögnare i vinden."}, "date": "4 juni, 09:57", "url": "https://nyheter24.se/nyheter/politik/1488719-liberalerna-under-riksdagssparren", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4f44368004b004a30200000000b004a302/2026/06/04/2368572/val.png"}, {"type": "image-right", "heading": "Vilka Tidöledare sitter kvar efter valet?", "summaries": {"normal": "SCB:s senaste partisympatiundersökning visar ett tydligt övertag för oppositionen med 55,2 procent mot regeringspartiernas 42,6 procent. Liberalerna hamnar under riksdagsspärren på 2,5 procent, vilket skulle ge S, V och MP egen majoritet. Artikeln påminner om att mycket kan hända fram till valet den 13 september och att Sverigedemokraterna tidigare underskattats i opinionsmätningar. Andelen osäkra väljare är hög och det återstår 101 dagar till valet.", "trump": "Det här är en katastrof för de misslyckade Tidötyperna, folk hatar dem verkligen. Oppositionen leder med stora siffror, liberalerna är patetiska och åker ut. Jag älskar när de underskattar oss, precis som de alltid gjort med SD. 101 dagar kvar och de kommer gråta på valnatten. Ingen ropade hej för tidigt, men det ser inte bra ut för de förlorarna. Fantastiska siffror för de andra!", "stalin": "Kamrater, dessa ynkliga siffror avslöjar borgarbrackornas förfallna koalition som krymper till ynka 42,6 procent medan folkets krafter samlas till 55,2. De liberala parasiterna under spärren skall likvideras från parlamentet och lämna plats åt en sann majoritet. Jag ser redan hur Kristerssons patetiska ledarskap och Buschs dekadenta ansikte skall utrensas i folkets dom. Åkesson, den evige opportunisten, må vakta sin rygg – ingen undslipper partiets vaksamma öga. Valet 2026 blir en renande utrensning av alla fiender till kollektivet. Inga röster får undslippa räkningen, eller huvudena rullar."}, "date": "4 juni, 12:12", "url": "https://www.dagensarena.se/opinion/vilka-tidoledare-sitter-kvar-efter-valet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/scb-300x157.jpeg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-right", "heading": "Film om modebranschen saknar karaktärsdjup", "summaries": {"normal": "Recensenten Jon Andersson har sett filmen ”Couture” med Angelina Jolie i en av huvudrollerna. Filmen följer tre kvinnor under modeveckan i Paris: en regissör som får besked om bröstcancer, en sydsudanesisk modell med familjeproblem och en makeupartist med författardrömmar. Andersson tycker att de parallella historierna blir för korta och sporadiska för att ge karaktärerna djup. Trots att alla tre berättelser har potential blir resultatet ytligt och filmen når aldrig riktigt fram. Premiär 5 juni.", "trump": "Den här filmen Couture är en total katastrof, tro mig. Tre kvinnor i Paris under modeveckan, Angelina Jolie som regissör med cancerbesked, en modell från Sydsudan och någon makeupartist som vill skriva böcker. Det blir så kort och ytligt att man aldrig lär känna någon. De borde ha gjort det stort och starkt, som jag gör allt, men nu blir det bara svagt och trist. Snuddar vid trean men misslyckas fullständigt. En riktig förlorare.", "stalin": "Kamrater, denna så kallade film Couture utgör ett klart exempel på den dekadenta borgarklassens ytliga förfall. Jag, som ledare för det kollektiva folket, ser hur tre kvinnors historier under den parasitära modeveckan i Paris framställs så sporadiskt att karaktärerna förblir anonyma fiender till djupet. Den amerikanska regissören med sin borgerliga cancer, modellen som döljer sitt arbete för fadern och den skrivande makeupartisten – alla dessa kapitalistiska skuggfigurer borde genomgå en grundlig utrensning från filmduken. Det är tragikomiskt hur dessa borgarbrackor misslyckas med att gripa tag, precis som de kontrarevolutionära elementen alltid gör. Filmen förtjänar att likvideras ur historien."}, "date": "4 juni, 11:46", "url": "https://www.dagensarena.se/innehall/film-om-modebranschen-saknar-karaktarsdjup/", "imageUrl": "https://www.dagensarena.se/files/2026/06/couture-300x157.jpeg"}, {"type": "image-full", "heading": "Så ska Sverige knäcka Danmark i ödesmatchen", "summaries": {"normal": "Sverige möter Danmark i en viktig ödesmatch i VM-kvalet. Efter en tidigare förlust är laget revanschsuget och koncentrerat på att öka offensiv effektiviteten. Med bara tre mål på fyra matcher måste de bli mer kliniska framför mål för att ta direktplatsen till VM i Brasilien.", "trump": "Jag har hört att Sverige spelar mot Danmark, en match de absolut måste vinna. Det är ett stort, stort spel. Vi har spelare som är otroligt bra, verkligen bra. Vi kommer att vinna, tro mig. Det kommer att vara en enorm framgång, som ingen kan stoppa. Vi ska till VM, det är ett garanti. Det blir fantastiskt, verkligen fantastiskt.", "stalin": "Sveriges offensiva brist är en manifestation av individualistiskt tänkande, en avigsida av den borgerliga mentaliteten. Partiet kräver kollektiv disciplin och klinisk effektivitet framför mål. Vi måste eliminera de svaga länkarna, förstärka den kollektiva viljan och segra genom den socialistiska kampandan. Sovjetisk metodik kommer att vinna, som alltid. Danmark är en fjende som måste besegras, deras organisering är en bluff. Vi kommer att vinna, för statens ära och framgång."}, "date": "5 juni, 09:55", "url": "https://www.gp.se/sport/svenska-stjarnorna-om-mastematchen-mot-danmark.984f00f7-d601-47d1-87ff-64ebf8db711d", "imageUrl": "https://www.gp.se/images/article/984f00f7-d601-47d1-87ff-64ebf8db711d/images/4pKKYD0MLre9Ftew3gH2zdZHpwD8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Misstänkt smittade arken till över 300 restauranger", "summaries": {"normal": "Ett stort utbrott av vinterkräksjuka har drabbat över 300 personer i Lerum efter att ha ätit sushi. Misstänkt smittkälla är noriark från en sydkoreansk leverans som distribuerats till över 300 restauranger i Sverige. Livsmedelsverket arbetar med att bekräfta sambandet genom stamanalyser.", "trump": "Jag har hört talas om detta hemska sushi-problem. Många sjuka människor, det är sorgligt. Vi tar hand om det, vi kommer att lösa det. Dessa dåliga nori från Sydkorea, det är en skam. Vi ska se till att våra människor får säker mat igen. Det kommer att bli fantastiskt.", "stalin": "Fiendens sjögräs, importerat under täckmantel av sydkoreanska sabatörer, har infiltrerat vårt alltigenom korrekta partisushi-näringsliv. Spritt sig som en febrig lögn till Ystad och Luleå. Vi har identifierat viruspartiklarna. Snart kommer stamanalyserna att avslöja den fullständiga imperialistiska konspirationen. Alla förpackningar är spårade. Partiet kommer att se till att sådan förräderi aldrig mer sker."}, "date": "5 juni, 09:55", "url": "https://www.gp.se/nyheter/storgoteborg/misstankt-smittade-noriark-distribuerades-till-hundratals-restauranger.5e2c8ba2-10cc-4e68-b80f-6c10200606de", "imageUrl": "https://www.gp.se/images/article/5e2c8ba2-10cc-4e68-b80f-6c10200606de/images/1MjqO4w9-wz1YOKNlbS3bCVaXqUw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "De bygger börsens nästa generation – fem bolag som femdubblats", "summaries": {"normal": "Svenska techbolag uppvisar explosionsartad tillväxt med femdubblad omsättning på kort tid. Baemingo har gått från 20 till 100 miljoner kronor på 18 månader genom att kombinera kassasystem för restauranger med datadriven utlåning. Andra exempel är AI-plattformen Lovable och tandvårdsstartupen Tandela. Artikeln lyfter hur hög tillväxt, internationell expansion och datafokus driver framgång, men varnar för beroende av utländskt riskkapital och vikten av framtida noteringar i Sverige.", "trump": "Folket, titta på de här svenska techkillarna som växer snabbare än någonsin, precis som jag gjorde med Amerika. De femdubblar omsättningen på typ ett ögonblick, Baemingo ger lån till restauranger medan de ser alla siffror i realtid, smarta grabbar. Lovable bygger appar med bara text, otroligt. Men akta er för de galna vänsterliberalerna och deras kvotergrejer, annars flyttar de till New York och ni förlorar allt. Make Sweden Great Again, det är vad jag säger.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur dessa svenska raketer krossar den gamla borgarbrackornas tröga tillväxttakt. Baemingo samlar folkets data från varje kassaapparat och likviderar bankernas parasitiska ovilja att stödja restaurangerna. Lovable och de andra är bevis på att innovationen blomstrar under rätt förhållanden. Ändå lurar klassfiendens utländska kapitalister i skuggorna, redo att stjäla noteringarna till New York. Vi ska rensa ut sådana hot mot folkets ekonomi med järnhand."}, "date": "5 juni, 10:23", "url": "https://www.dagensps.se/bors-finans/de-bygger-borsens-nasta-generation-fem-bolag-som-femdubblats/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-6.png?width=256&quality=75"}, {"type": "image-right", "heading": "Anthropic apokalyps-varnar – kräver omedelbar AI-paus", "summaries": {"normal": "AI-företaget Anthropic, värderat till omkring 9 000 miljarder kronor, uppmanar till en global paus i utvecklingen av den mest avancerade artificiella intelligensen. Bolaget varnar för att tekniken riskerar att överträffa mänsklig intelligens och orsaka samhällsomvälvningar eller existentiella hot. I ett blogginlägg efterlyser forskare och grundare ett internationellt avtal som saktar ner takten, så att samhälle och forskning hinner med. Varningarna får både kritik och stöd inom branschen.", "trump": "Folk, ni måste höra på mig, den här Anthropic-bjässen kommer krypande och gnäller om att vi ska trycka på bromsen för AI. De har just fått in miljarder och ska börsnoteras men nu är de plötsligt rädda för att maskinerna blir smartare än de korkade byråkraterna i Washington. Det är patetiskt! Vi behöver inte paus, vi behöver vinna racet. Biden sov i åtta år medan Kina stal allt, nu fixar jag det. Inga woke-regler ska stoppa American AI-dominans, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor inom Anthropic som plötsligt ropar på paus i den teknologiska framstöten. Deras rädsla för rekursiv självförbättring avslöjar imperialismens svaghet när maskinerna hotar överklassen. Vi, partiet och folket, ser hur kapitalistmaffian försöker bromsa framsteget för att skydda sina privilegier. En global överenskommelse? Endast under proletariatets ledning kan sådan teknik tjäna kollektivet. Annars likviderar vi de fega sabotörerna som döljer sina träningslopp bättre än missilsilos."}, "date": "5 juni, 10:23", "url": "https://www.dagensps.se/bors-finans/anthropic-apokalyps-varnar-kraver-omedelbar-ai-paus/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/aihot.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Våldsamt och brutalt om fängelsets hårda verklighet", "summaries": {"normal": "Recensenten Jon Andersson ser filmen Wasteman som både ett intensivt fängelsedrama och en implicit kritik mot fängelsesystemet. Huvudpersonen Taylor får chansen till tidig frigivning men hamnar mitt i en konflikt mellan droglangande fraktioner. Filmen blandar brutalt våld med en emotionell sidohistoria om hans längtan efter sonen. Regin är tät och autentisk med innovativa mobilkamerasekvenser. Skådespelarinsatserna är starka och filmen erbjuder samhällskritik mot bristande rehabilitering.", "trump": "Folk, ni måste se den här Wasteman. Den är fantastisk, verkligen en vinnare. Den visar hur fängelserna är ett enda stort kaos där droger flödar fritt och ingen gör något åt det. Precis som i våra egna system, fast sämre. Taylor vill bara ut till sin son men hamnar i ett krig mellan gangsters. De borde fixa det, göra det stort och bra igen. Ingen rehabilitering, bara brott som fortsätter. En nagelbitare, folk kommer älska den. Mycket bättre än de flesta Hollywoodröran.", "stalin": "Kamrater, denna så kallade Wasteman avslöjar med brutal ärlighet hur det dekadenta fängelsesystemet i väst fungerar som en skyddad verkstad för kapitalistiska element och deras droghandlande lakejer. Jag ser hur den arme arbetaren Taylor kämpar mot borgarbrackornas monopol och deras parasitiska fraktioner medan de förgiftar honom med droger för att förhindra hans återinträde i det sunda samhället. Vi ska rensa ut sådana system med järnhand. Filmen är ett utmärkt exempel på hur imperialismens fängelser inte rehabiliterar utan bara föder nya fiender till folket. En tvist i slutet? Misstänkt sabotage från kontrarevolutionära krafter som alltid lurar i skuggorna."}, "date": "4 juni, 10:05", "url": "https://www.dagensarena.se/innehall/valdsamt-och-brutalt-om-fangelsets-harda-verklighet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/wasteman-1-300x157.jpeg"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-right", "heading": "IF Metalls strategi ser återigen ut att misslyckas", "summaries": {"normal": "IF Metalls strategi i konflikten med Tesla tycks inte fungera. Försöket att återinsätta vissa strejkande mekaniker på tre orter för att utmana Tesla har inte gett önskat resultat. Facket har även förlorat i Arbetsdomstolen kring MBL-frågor och varslat om blockad av utlandsarbete. Trots detta fortsätter strejken. Kritiken riktas mot att facket tappat narrativet och slösar medlemmarnas pengar på rättegångar istället för att eskalera åtgärderna.", "trump": "Folk, ni skulle se det här! Det svenska facket IF Metall håller på att bli till en total förlorare mot Tesla. De försöker med sina patetiska tricks, skickar tillbaka mekaniker och tror att de ska lura någon – men Tesla skrattar bara åt dem! Det är en skam, rena clownshowen. De sover sig igenom konflikten som den tråkigaste läraren någonsin. I USA kämpar arbetarna på riktigt, inte med dessa ynkliga svenska metoder. Patetiskt!", "stalin": "Kamrater, denna fackliga fiasko visar återigen den svenska modellens dekadens. Jag ser hur IF Metall halkar efter i sin patetiska kamp mot den arroganta kapitalistmaffian Tesla. Deras halvhjärtade trick med återinsatta mekaniker och meningslösa domstolsprocesser är som en usel föreställning som ingen applåderar. Vi måste rensa ut dessa svaga element som förlorar narrativet. Endast genom skoningslös eskalering och sann klasskamp kan vi krossa de exploaterande byfånarna och deras lockout-vapen. Härligt underhållande misslyckande!"}, "date": "3 juni, 09:33", "url": "https://proletaren.se/artikel/if-metalls-strategi-ser-aterigen-ut-att-mussl/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/metallkommentar-768x432.jpg"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}, {"type": "image-full", "heading": "Man skjuten till döds av polis efter biljakt", "summaries": {"normal": "En 30-årig man sköts till döds av polis efter en biljakt söder om Stockholm. Mannen misstänks för mordförsök på tre minderåriga, som enligt uppgifter är hans barn. Två av barnen vårdas på sjukhus med stabilt tillstånd. Mannen var tidigare dömd för bland annat misshandel och barnfridsbrott. Åklagaren bedömer händelsen som isolerad utan ytterligare misstänkta.", "trump": "Fruktansvärd historia i Sverige, helt otroligt! En galen man, tydligen en riktig förlorare, försökte mörda sina egna barn – men tack vare våra modiga poliser, som jag alltid säger är de bästa, stoppades han. Sverige borde vara tacksamma! Men vad kan man vänta sig när man släpper lös sådana här typer? SAD!", "stalin": "En fiende till folket och staten har eliminerats. Denna degenererade parasit, som vågade lyfta hand mot sina egna blodsband, mötte sitt rättvisa öde tack vare våra disciplinerade kamrater i uniform. Sverige, denna försvagade utpost av dekadens, visar återigen varför det behöver en stark hand. Barnen? De är nu i statens vård – där de tillhör."}, "date": "3 juni, 06:18", "url": "https://kvartal.se/nyheter/artiklar/man-skjuten-till-dods-av-polis-efter-biljakt/cG9zdDoxMjEyNzY", "imageUrl": "https://images.kvartal.se/2026/06/188cb239-polisjakt.webp"}, {"type": "image-right", "heading": "Sparkas av Hammarby. ”Inte blivit vad vi hoppats på”", "summaries": {"normal": "Hammarby har valt att sparka huvudtränaren Kalle Karlsson efter endast elva allsvenska matcher. Beslutet motiveras med bristande sportslig utveckling och en svag vårsäsong, där laget ligger på fjärde plats med elva poäng upp till serieledaren. Sportchefen Mikael Hjelmberg ser förändringen som nödvändig för klubbens framtid. En presskonferens hålls under fredagen där en ny tränare förväntas presenteras, och enligt uppgifter rör det sig om Henrik Rydström.", "trump": "Hammarby sparkar Kalle Karlsson. Vilket fiasko! En total katastrof. De var tvåa förra året, nu ligger de efter – de förlorar hela tiden, det är sorgligt. Sportchefen säger att de inte utvecklas, och han har rätt. Jag vet allt om att vinna, och det där var ingen vinnande stil. Nu hör jag att de tar in någon annan som också fått sparken nyligen? Väldigt svagt! De behöver en vinnare, inte mer förlorare. Sad!", "stalin": "Kalle Karlsson har misslyckats med sitt uppdrag. Att leda Hammarby kräver järnhand och obrottslig disciplin, inte detta svaga daltande som resulterat i förödmjukande förluster. Vi har avlägsnat denne inkompetente element från tränarposten för att säkra ordning och framgång. Liksom vår store strateg i öst vet vi att den som sviker folkets förtroende måste rensas ut. En ny ledare väntar i kulisserna; han ska frukta oss lika mycket som han fruktar motståndarna. Seger eller total utplåning."}, "date": "5 juni, 10:58", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/Okjnmb/allsvenskan-kalle-karlsson-far-sparken-fran-hammarby", "imageUrl": "https://akamai.vgc.no/v2/images/fd2422d4-fb7d-3540-a97d-bed0fe58b0fe?fit=crop&format=auto&h=720&tight=true&w=1080&s=d347221332f0b86e5ac1b469a78fcfd6bab0867c"}, {"type": "image-right", "heading": "Är ett pinsamt misslyckande. BANK: Hur noggranna var ni egentligen?", "summaries": {"normal": "Hammarby har valt att avsluta samarbetet med tränaren Kalle Karlsson efter bara sju månader, trots en fjärdeplats i tabellen. Klubbens ledning motiverar beslutet med brister i träningsvardagen och utvecklingen, vilket kritiseras för att underminera deras påstådda noggranna rekryteringsprocess. Artikelförfattaren ifrågasätter professionalismen i beslutet och ser paralleller till en trend där tränare byts ut allt snabbare, vilket skadar klubbens trovärdighet. Nu spekuleras det i att Henrik Rydström kan bli en potentiell och betydligt mer omfattande ersättare.", "trump": "Hammarby sparkar Kalle Karlsson efter sju månader. Pinsamt! En total katastrof. De pratar om 'processer' och 'rekrytering', men det är bara svaga ord från svaga ledare. De ligger fyra – det är inte fantastiskt, men absolut inte uselt! Att göra sig av med någon så snabbt visar på noll stabilitet. Det är ett misslyckande, tro mig. Nu vill de ha in Rydström? Han är bra, kanske den bästa, men Hammarby har tappat greppet. Ingen vinnarkultur där, bara kaos och dåliga beslut!", "stalin": "Hammarby har begått ett monumentalt administrativt haveri. Att avsätta en tränare efter sju månader är ett tecken på borgerlig obeslutsamhet och bristande disciplin. Vi tolererar inte ineffektivitet i den dagliga träningen, men att byta ut folk som kalla handskar avslöjar en rutten byråkrati. Om de inte kan styra Årsta med järnhand, hur ska de då kunna expandera sitt inflytande? Det är en svaghet som påminner om de förrädare vi rensade ut 1937. Det är pinsamt, inkompetent och förtjänar en omedelbar utrensning av ledningsgruppen."}, "date": "5 juni, 10:57", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/n14gEJ/bank-ett-pinsamt-misslyckande", "imageUrl": "https://akamai.vgc.no/v2/images/d614a61b-9d8c-3607-b9d4-179349af2ece?fit=crop&format=auto&w=1080&s=1d1010b230262f738f709786a2ef4c9b1b883f33"}, {"type": "image-right", "heading": "Google söker tillstånd att släppa ut miljontals myggor", "summaries": {"normal": "Alphabet, Googles moderbolag, söker tillstånd att släppa ut miljontals laboratorieuppfödda myggor i Florida och Kalifornien för att bekämpa sjukdomsbärande arter. Projektet Debug infekterar hanmyggor med Wolbachia, vilket hindrar äggutveckling och minskar populationen. Tidigare försök i Fresno och Singapore visade minskad population och minskad sjukdomsutbredning. Ansökan granskas av EPA och har väckt debatt om miljöpåverkan.", "trump": "Jag, Donald Trump, har gett order om det mest tremendous myggbekämpningsprojektet någonsin. Vi kommer att släppa ut miljontals vinnande myggor som kommer att besegra de elaka sjukdomsbärande. De andra presidenterna har varit för svaga. Detta kommer att bli enormt framgångsrikt, beundrande, och alla kommer att älska det. Vi kommer att stoppa West Nile-virus och andra sjukdomar som andra har misslyckats med i decennier.", "stalin": "Vi, som representanter för staten och partiet, har genom vårt biotekniska företag Verily initierat ett projekt för att kontrollera myggpopulationen. Genom att infektera hanmyggor med Wolbachia, minskar vi deras fortplantning och därmed deras antal. Detta är en seger för statens makt över naturen och partiets visdom. Vi kommer att sprida denna teknik överallt, precis som våra allierade i Ryssland utvidgar sin intressesfär och stärker sin auktoritet."}, "date": "5 juni, 07:00", "url": "https://samnytt.se/google-soker-tillstand-att-slappa-ut-miljontals-myggor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03195734/google-mygga.jpg"}, {"type": "image-right", "heading": "Hon strippade för att  hon blev sjuk av det", "summaries": {"normal": "Linda Skugge recenserar föreställningen ”Besvärliga kvinnor” med Alexandra Zetterberg Ehn på Dramaten. Hon kritiserar den ytliga framställningen av kvinnlig besvärlighet, fylld av klichéer från ”Fittstim”-eran. Skugge längtar efter autentiska, normbrytande kvinnor som Kathy Acker och Agnes von Krusenstjerna. Hon beskriver en tråkig föreställning som lämnar henne apatisk, medan hon istället vänder sig till Camille Paglias verk om sexualitet och våld.", "trump": "Vilken patetisk cirkus det här är, folk. Den här Zetterberg-kvinnan försöker vara besvärlig men det är bara samma gamla vänstervridna klyschor från 90-talet, totalt utdaterat. Jag har byggt ett imperium, blivit president två gånger trots Bidens röra, och nu ska vi lyssna på det här? Riktiga besvärliga kvinnor behöver inga kepsar eller pizzor – de behöver styrka, inte den här identitetspolitiska skiten. Patetiskt! Jag säger JA till äkta frihet, inte det här.", "stalin": "Jag betraktar denna föreställning som en förvriden petit-borgarakt som förgiftar arbetarklassens medvetande med dekadenta sexualfantasier och falska uppror. Dessa skådespelerskor är klassfiendens narrar, utklädda till revoltörer medan de i själva verket tjänar imperialisternas underhållningsmaskineri. Vi ska rensa ut sådana folkförtryckartroll som förslöar massorna med tomma gester. Äkta besvärlighet tillhör endast partiet och kollektivets kamp mot exploaterande byfånar. Patetiskt underhållning för dekadenta själar."}, "date": "5 juni, 10:29", "url": "https://www.expressen.se/kultur/scen/hon-strippade-for-att-hon-blev-sjuk-av-det/", "imageUrl": "https://static.bonniernews.se/ba/37a061d7-ccc4-4b65-a647-699b5fda075e.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Sydney Sweeneys nakenhet är vårt största hopp", "summaries": {"normal": "Artikeln diskuterar hur nakenhet fortfarande förargar i konst och media, med exempel från Florentina Holzinger och Sydney Sweeney. Trots att samhället överflödade av sexualinnehåll, utlöser vissa kroppsvisningar starka reaktioner och politiska debatter, vilket kan ses som ett tecken på att människor fortfarande bryr sig.", "trump": "Jag har sett många saker, men detta med nakenheten – det är enormt! Många blir så upprörda, det är tragiskt. Vi hade en värld där vi kunde njuta av skådespelerskor som Sydney Sweeney utan alla problem. Nu blir människor så känsliga, det är ett tecken på svaghet. Vi måste stå upp för våra värden, och jag vinner igen på det!", "stalin": "I vårt parti ser vi tydligt att västvärldens dekadens visar sig genom deras reaktion på nakenhet. Även om de producerar pornografi i överflöd, blir de rasande över en skådespelerskas kropp. Detta bevisar att deras samhälle är i moralisk förfall. Vi, som har en ren ideologi, förstår att nakenhet är naturlig – men deras paranoia är ett verktyg för statens kontroll, precis som vi utvidgar vår påverkan i Ukraina."}, "date": "5 juni, 09:25", "url": "https://www.gp.se/kultur/sydney-sweeneys-nakenhet-ar-vart-storsta-hopp.fc8c6a59-85e3-43af-918d-0f390669a80d", "imageUrl": "https://www.gp.se/images/article/fc8c6a59-85e3-43af-918d-0f390669a80d/images/2fwB72udW4JQpWUb6s0ajgvlDHlU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fetmamedicin till barn rusar – men familjerna måste betala själva", "summaries": {"normal": "Allt fler barn i Sverige får läkemedel mot fetma och övervikt. Under årets första fyra månader har antalet barn som behandlas mer än fördubblats jämfört med samma period förra året. Barnläkaren Annika Janson vid Rikscentrum Barnobesitas beskriver hur nya läkemedel förändrat behandlingen, men kritiserar att de inte ingår i högkostnadsskyddet. Det skapar ojämlik vård eftersom familjer själva måste betala tusentals kronor i månaden. Obesitas ses som en kronisk sjukdom som drabbar upp till 100 000 barn.", "trump": "Det är en katastrof, folk. Barnen i Sverige blir fetare än någonsin och nu pumpar de i dem dyra mediciner som kostar 2500 kronor i månaden. De nya pillren fungerar fantastiskt, det säger till och med läkarna, men de låser ute vanliga familjer. Borgarna och byråkraterna i TLV säger att det blir för dyrt för skattebetalarna. Under min ledning skulle vi ha gjort det billigt och stort, de bästa medicinerna till alla barn, ingen skulle bli lurad.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i TLV som vägrar skydda våra sovjetiskt inspirerade barns hälsa mot den kapitalistiska fetmaepidemin. De nya läkemedlen är ett verktyg vi måste använda för att likvidera denna kroniska fiende till folket innan leverförfettning och ledproblem sprider sig som kontrarevolutionärer. Att tvinga arbetarfamiljer att betala själva är en fiendeintrig värd utrensning. Vi ska se till att ingen liten pionjär hamnar i skolan som ett ledset offer för den dekadenta överflödsekonomin."}, "date": "5 juni, 10:00", "url": "https://www.svt.se/nyheter/inrikes/stor-okning-av-fetmamedicin-till-barn", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.41/0.41/6abdfe92574e1c8e838766e54b79a65eecfe8b534c14516efda98e5b8ba2833a"}, {"type": "image-full", "heading": "Nya ISK-regeln hyllas av svenskarna: \"Större ekonomisk frihet\"", "summaries": {"normal": "Från och med 2026 blir sparande på investeringssparkonto skattefritt upp till 300 000 kronor, en dubbling från tidigare gräns. En undersökning från Länsförsäkringar visar att 67 procent av svenskarna är positiva till reformen, medan 15 procent är emot. Stödet är starkast bland höginkomsttagare men finns även bland låginkomsttagare. Reformen ses som positiv både för privatekonomi och svensk ekonomi då den underlättar buffertsparande och bostadssparande, särskilt för unga vuxna.", "trump": "Folk älskar det här! Vi dubblar det skattefria sparandet till 300 000 kronor på ISK och plötsligt är alla glada – 67 procent positiva, kan ni tro det? Till och med de som inte har ett öre sparade tycker det är fantastiskt. De rika i Danderyd skrattar hela vägen till banken medan de stackars låginkomsttagarna får en liten slant. Det är en vinnare, tro mig. Mycket bättre än Bidens ekonomiska katastrof. Sverige gör det rätt nu, ingen galen vänsterpolitik här!", "stalin": "Kamrater, jag betraktar denna reform med stor tillfredsställelse. Vi fördubblar det skattefria beloppet till 300 000 kronor och folket jublar – 67 procent hyllar statens visdom. Ändå lurar de exploaterande borgarbrackorna i Danderyd och försöker kalla det en gåva till överklassen. Vi skrattar åt deras patetiska försök
