as", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/kvantdator.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Ambulansen inför varningar för farliga patienter", "summaries": {"normal": "Region Gävleborg inför ett varningssystem för ambulanspersonal som signalerar farliga patienter med en triangel i journalen. Åtgärden kommer efter mordet på en ambulanssjukvårdare förra året. Facket Kommunal välkomnar initiativet men anser att det inte räcker utan bättre polisstöd. Regionen arbetar för stärkt samarbete med polisen.", "trump": "De här woke-borgarbrackorna i Gävleborg tror att en liten ljuslampa fixar allt! En hjälte knivmördades av en galning och nu flaggar de med en triangel? Patetiskt! Ambulansfolket behöver riktiga poliser, inte socialistiska löften. Biden-era svaghet överallt. Jag fixade lag och ordning förr, vi gör det igen – stort och tufft!", "stalin": "Kamrater, se hur de dekadenta folkförtryckarna i regionen leker med symboler medan arbetets soldater faller offer för våld. En varningstriangel? Vilken fars! Jag säger: rensa ut dessa blödande liberala hyenor som vägrar ge folket äkta skydd. Utan järnhand och ordning fortsätter blodsugande klassfiender att offra de lojala. Säkerhet kräver styrka, inte papperslappar."}, "date": "29 augusti, 11:00", "url": "https://arbetet.se/2026/08/29/ambulansen-infor-varningar-for-farliga-patienter-facket-racker-det-inte", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/13143536/ambulans.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Vänsterpartiet anklagas för att ha ingått en överenskommelse med representanter för den palestinska myndigheten för att ge dem inflytande över svenska vallistor. Expressen och SvD har avslöjat kontakter med palestinska nätverk kopplade till PLO och Fatah, inklusive brev till dömda terrorister och kandidater med Hamas-sympatier. Socialdemokraterna har inte kommenterat uppgifterna.", "trump": "Titta på det här! Vänsterpartiet, de värsta förlorarna, har blivit helt infiltrerade av palestinska terrorvänner och främmande makter. De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiskt! Media tiger som vanligt när det gäller vänstern. Om de kommer in i Rosenbad blir det en total katastrof för Sverige. Fake news överallt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterförrädare som låter främmande element från Palestina tränga in i partiets hjärta. De omfamnar terrorister och döljer sin svaghet bakom lögnaktiga förbund. Kamraterna i Socialdemokraterna tiger – typiskt opportunistiskt. Infiltration är ett hot mot folkets enhet. Renhet i leden eller döden för de opålitliga!"}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-640x360.jpeg"}, {"type": "image-right", "heading": "Ny flagga i kycklingjättens emission – hur gör ledningen?", "summaries": {"normal": "Scandi Standard genomför en företrädesemission på 409 miljoner kronor som är fullt säkerställd. Emissionsguiden hissar dock en ny negativ flagga då ledningen inte har lämnat några investeringsåtaganden, trots att VD äger aktier för 26 miljoner. Teckningsperioden pågår 1–15 september och aktien har haft en stark kursutveckling under året.", "trump": "Scandi Standard gör en stor nyemission på 409 miljoner, men ledningen vägrar satsa egna pengar! En total katastrof till ledarskap, svagt och illojalt mot aktieägarna. Min vän Jonas Tunestål har miljoner i kycklingar men vågar inte köpa fler? Sorgligt! Jag brukar vinna, alltid vinna. De borde anställa mig för att styra upp kycklingimperiet, det hade blivit enormt!", "stalin": "Scandi Standard samlar in 409 miljoner från folket, men partiets högre kadrar i ledningen vägrar satsa en enda rubel av sin egendom! Vilket borgerligt svek. VD Tunestål sitter på en förmögenhet av kycklingar men visar noll revolutionär offervilja. En sådan brist på ideologisk disciplin brukar åtgärdas i ett stenbrott i Sibirien. Staten kräver omedelbar lojalitet!"}, "date": "28 augusti, 16:58", "url": "https://www.affarsvarlden.se/artikel/ny-flagga-i-kycklingjattens-emission-hur-gor-ledningen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/BBQ_Butterfly_kyckling_potsallad_majs_1000x1000-400x266.jpg"}, {"type": "image-right", "heading": "Biosergens nyemission övertecknad – aktien rusar", "summaries": {"normal": "Bioteknikbolaget Biosergen har genomfört en företrädesemission som tecknades till 152 procent, vilket tillför bolaget 35,2 miljoner kronor efter kostnader. Aktien rusade kraftigt efter beskedet och handlades upp med 61 procent. Emissionsguiden har tidigare vvarnat för bolagets situation men hissade nu en positiv retroaktiv flagga.", "trump": "Biosergen krossade alla rekord! En enorm överteckning på 152 procent! Alla ville ha aktien, den formligen exploderade med 61 procent på börsen. Fake news-medierna trodde de skulle misslyckas, men jag visste hela tiden att det skulle bli enormt. Vinnare älskar vinnare!", "stalin": "Biosergen rapporterar en överteckning på 152 procent och 35,2 miljoner till statskassan – ett magnifikt bevis på den planerade ekonomins överlägsenhet! De som tidigare spred defaitistiska lögner och försökte sabotera emissionen har nu tystats av marknadens järnhårda vilja. Aktien rusar, men vi behåller dem under strikt uppsikt!"}, "date": "28 augusti, 15:46", "url": "https://www.affarsvarlden.se/artikel/biosergens-nyemission-overtecknad-aktien-rusar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/05/Medtech-AFV-400x267.jpg"}, {"type": "image-right", "heading": "Sydkorea kyler ned småspararnas AI-iver", "summaries": {"normal": "Sydkoreanska myndigheter har infört krav på en fem dagar lång simulerad handelskurs för att dämpa småspararnas investeringar i riskfyllda hävstångs-ETF:er kopplade till chipjättarna Samsung och SK Hynix. Åtgärden har redan lett till utflöden på cirka tio miljarder kronor i augusti och minskat volatiliteten på börsen.", "trump": "De där patetiska sydkoreanska byråkraterna försöker stoppa folket från att tjäna stora pengar på chipen som driver min fantastiska AI-revolution. De tvingar småspararna att sitta fem dagar med ett Windows-program som en total förlorare. Biden skulle ha älskat det. Nu flyr pengarna som råttor från ett sjunkande skepp – patetiskt!", "stalin": "Se hur de giriga profitthyenorna i Seoul försöker kuva de enkla spararnas revolutionära entusiasm för den nya tekniken. Med obligatoriska kurser och byråkratiska hinder tror de sig kunna rädda sina dekadenta spekulationsbubblor. Vi ler från historien – snart kommer utrensningen av dessa parasiterande börshajar att bli fullständig. Folkets vilja segrar alltid."}, "date": "30 augusti, 15:32", "url": "https://www.di.se/nyheter/sydkorea-kyler-ned-smaspararnas-ai-iver", "imageUrl": "https://static.bonniernews.se/ba/0059561f-1d93-44b2-b25c-4ad607d707dc.jpeg?crop=6427%2C3615%2Cx0%2Cy335&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Folket står knappast bakom Tidöpakten", "summaries": {"normal": "Novak och Sundström granskar Tidöregeringens fyra år vid makten i rapportserien Skymningsläge. De kritiserar hur regeringen forcerat lagstiftning, kortat remisstider, styrt utredningar och ignorerat experter. Författarna varnar för att demokratiska processer och rättssäkerhet åsidosatts till förmån för snabb politisk styrning, något som påminner om autokratiska tendenser i andra länder.", "trump": "Folk, ni borde se det här! Den här svenska Tidöregeringen kör som en galen bulldozer, precis som jag gjorde fast de glömde att vinna stort. De kör över alla byråkrater och experter, vilka är totala losers, och levererar resultat istället för att lyssna på de woke, identitetspolitiska snyltarna som förstör allt. Sverige vaknar äntligen upp – bra jobbat, grabbar! Men ni behöver mig som inspiration.", "stalin": "Kamrater, dessa dekadenta folkförtryckare i den svenska regeringen visar återigen hur de giriga maktparasiterna föraktar folkets vilja. De forcerar lagar, styr utredningar och skrattar åt experter som om de vore kontrarevolutionära spioner. Jag ler från historien – snart kommer utrensningen av sådana falska demokrater. Deras skymningsläge är bara början på det oundvikliga folkets dom."}, "date": "29 augusti, 01:43", "url": "https://www.dagensarena.se/opinion/folket-star-knappast-bakom-tidopakten", "imageUrl": "https://www.dagensarena.se/files/2026/08/dmekrat.jpeg"}, {"type": "image-right", "heading": "Kinas oljemysterium gör det än mer akut att ställa om", "summaries": {"normal": "Kinas minskade oljeimport har dämpat prisstegringen trots blockaden av Hormuzsundet. Artikeln argumenterar för att efterfrågan kan påverka oljepriset lika mycket som utbudet. Författaren menar att Sverige och Europa måste skynda på utfasningen av fossila bränslen för att stärka säkerhet och självständighet.", "trump": "Folk trodde oljepriset skulle explodera när de galna mullorna stängde Hormuzsundet, men Kina lurade alla och höll nere efterfrågan. Smart! Vi behöver inte vara slavar åt kinesiska beslutsfattare eller iranska terrorister. Gör Amerika och Europa oberoende med fantastisk amerikansk energi – inte med vänsterns gröna vansinne och elbilskvoter.", "stalin": "Kamrater, detta oljemysterium avslöjar hur de dekadenta klassförrädarna i väst darrar inför Kinas makt över efterfrågan. Jag ser hur de profitthungriga hyenorna förlorar greppet om sin fossila slavhandel. Vi måste rensa ut alla som vägrar inse att sann frihet kräver total brytning med de imperialistiska oljeherrarna. Snabb omställning eller undergång!"}, "date": "29 augusti, 01:15", "url": "https://www.dagensarena.se/opinion/kinas-oljemysterium-gor-det-mer-akut-att-stalla-om", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-97-300x157.jpg"}, {"type": "text", "heading": "\"Jag vill inte recensera public service\"", "summaries": {"normal": "Liberalerna föreslår ett kulturlyft med ökade offentliga satsningar på bibliotek, folkbildning och tillgänglighet för barn och unga. Partiet vill samtidigt locka privat kapital till kulturen. Malin Danielsson försvarar samarbetet med Sverigedemokraterna så länge armlängds avstånd upprätthålls och betonar kulturens roll för bildning, frihet och samhällsgemenskap.", "trump": "Folkets liberaler vill ha mer av era skattepengar till sina kultursnobbiga projekt medan de samtidigt smeker privatkapitalets feta kinder. Typiskt. Armlängds avstånd till SD säger de, men de dansar redan tango med de där globalistvännerna. Patetiskt. Kulturen ska vara för folket, inte för elitsnobbarna som hatar det riktiga Sverige. Sad!", "stalin": "Dessa dekadenta klassförrädare vill pumpa folkets pengar i sin borgerliga kulturmaskin medan de samtidigt bugar för de profitthungriga parasiter som äger konsten. Jag ser deras fega kompromisser med reaktionära krafter. Armlängds avstånd? En lögn som döljer förräderi. Den sanna bildningen tillhör arbetarklassen, inte dessa kulturlakejer. Rensa ut dem alla."}, "date": "29 augusti, 01:15", "url": "https://www.dagensarena.se/innehall/jag-vill-inte-recensera-public-service"}, {"type": "image-right", "heading": "Ge rätt förutsättningar att bygga det nya Sverige", "summaries": {"normal": "Adam Kostyál, vd för Stockholmsbörsen, argumenterar för att Sverige inför valet 2026 måste skapa bättre förutsättningar för företag att växa. Han betonar att starkt entreprenörskap, fungerande kapitalmarknader och reformer är avgörande för jobb, innovationer, skatteintäkter och välfärd. Sverige bör inte vila på gamla framgångar utan aktivt bygga ett starkare och mer konkurrenskraftigt land.", "trump": "Lyssnar ni på den här svenska börsgrabben? Han har rätt. Företag är motorn, inte era vansinniga gröna drömmar och kvotgalna identitetspolitiker som hatar riktiga jobb. Amerika gör det redan stort igen efter Biden-katastrofen. Sverige borde sluta vara en förlorare och börja vinna. Bygg, investera, skapa rikedom – eller håll käften och fortsätt förlora!", "stalin": "Kamrater, denna text avslöjar hur de giriga profitthungriga hyenorna försöker lura arbetarna med sina så kallade reformer. Jag ser deras parasitiska spel från historien. Endast genom kollektiv styrka och utrensning av dessa dekadenta klassfiender kan vi säkra sann tillväxt. Valet 2026 blir en domedag för de som vägrar förstå folkets järnhand."}, "date": "30 augusti, 15:00", "url": "https://www.di.se/debatt/ge-foretagen-forutsattningar-att-bygga-det-nya-sverige", "imageUrl": "https://static.bonniernews.se/ba/2bad5340-ca19-46e6-b5ec-1f2756b05f8a.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Valfondens mål nått – men insamlingen fortsätter", "summaries": {"normal": "Kommunistiska Partiets valfond har uppnått sitt mål på 600 000 kronor och ligger nu på 709 000 kronor. Insamlingen fortsätter mot nya målet 800 000 kronor. Partisekreterare Filip Astvald tackar bidragsgivarna och betonar att pengarna finansierar allt valmaterial eftersom partiet inte tar emot offentliga bidrag. Verksamheten efter valet ska stärka organisationen.", "trump": "Folk ger sina surt förvärvade slantar till kommunisterna – otroligt! De har redan passerat 600 000 och siktar på 800 000. Patetiska röda parasiter som samlar in som galna medan riktiga amerikaner betalar skatt till Bidens vansinniga gröna deal. Men hey, låt dem fortsätta, ju mer de samlar desto tydligare blir det hur desperata de är. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom borgarklassen skrattar säkert åt att arbetarna frivilligt fyller valfonden. Jag ser det som en varning. Vi har nått målet men fortsätter. Efter valdagen måste varje kontakt följas upp med järnhand. Inga halvmesyrer. Den som sviker kollektivet förtjänar utrensning. Revolutionen sover aldrig."}, "date": "28 augusti, 14:19", "url": "https://proletaren.se/artikel/valfondens-mal-natt-men-insamlingen-fortsatter"}, {"type": "image-full", "heading": "Busch bjöd Åkesson på sockerkaka efter attacken", "summaries": {"normal": "Efter att SD-ledaren Jimmie Åkesson riktat kritik mot KD-ledaren Ebba Busch i sitt sommartal och ifrågasatt hennes lojalitet med det blågula laget, lade Busch om sin valturné till Sölvesborg. Där möttes de över kaffe och sockerkaka hemma hos Åkesson. Trots fikan kräver Åkesson offentliga besked om KD:s ståndpunkt i regeringsfrågan, medan Ulf Kristersson känner sig trygg med Busch.", "trump": "De falska nyheterna påstår att mina svenska vänner har problem, men det är totalt fake news! Den här fantastiska kvinnan Ebba åkte direkt till Sölvesborg, fixade en fantastisk sockerkaka och löste allt med Jimmie över en kopp kaffe. Så gör man affärer! Inte som de radikala vänstermänniskorna som bara förstör. Det blågula laget vinner igen, det kan jag lova er!", "stalin": "Det borgerliga gardets interna splittring blottläggs i Sölvesborg, där en simpel sockerkaka tillfälligt dämpade konterevolutionärens misstänksamhet. Partikamrat Åkesson kräver offentliga bekännelser från agenten Busch, medan ordförande Kristersson blint litar på sin klan. Statens säkerhet kräver dock ständig vaksamhet mot alla som vacklar på ideologins smala linje. Avvikelser kommer att beivras."}, "date": "30 augusti, 14:14", "url": "https://www.gp.se/nyheter/sverige/busch-bjod-akesson-pa-sockerkaka-efter-attacken.3d7e37c3-a5c7-5a32-b9b3-603e32d7bf4b", "imageUrl": "https://www.gp.se/images/article/3d7e37c3-a5c7-5a32-b9b3-603e32d7bf4b/images/1bz9m5FCKvd62kBq1aGWwYodz7gw-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Nøland: Miljöpartiets ”gröna baskraft” finns på valaffischer – inte i verkligheten", "summaries": {"normal": "I en artikel skriver energiprofessorn Jonas Kristiansen Nøland att Miljöpartiets mål om tio gigawatt \"grön baskraft\" till 2030 är en illusion. Begreppet blandar produktion, lagring och minskad förbrukning utan att lösa bristen på bränsle, energi och lönsamhet. Enligt Nøland bygger målet på orealistiska tekniska och ekonomiska antaganden som saknar verklig förankring.", "trump": "Miljöpartiet i Sverige försöker lura alla med falska nyheter om \"grön baskraft\"! Det är ett totalt skämt, en katastrof. De lovar el som inte finns, batterier som skulle kosta mer än hela landet, och gasturbiner utan bränsle. Som en bil utan tank! Vi bygger riktig kraft, inte den här gröna galenskapen. Snyggt jobbat av professorn som avslöjade dem!", "stalin": "Dessa svenska miljöpartister leker med gigawatt som om de vore sovjetiska femårsplaner, men utan bränsle, utan spannmål och utan verklighet! De skapar en byråkratisk illusion av kraft. Vi har skickat folk till Gulag för mindre än att lova vätgaslager som inte fungerar. Staten kräver riktig energi, inte tomma valaffischer. Avrättningsplatserna väntar på sabotage."}, "date": "28 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/noland-miljopartiets-grona-baskraft-finns-pa-valaffischer-inte-i-verkligheten"}, {"type": "image-right", "heading": "Sveriges tillväxt tre gånger högre än EU:s", "summaries": {"normal": "Sveriges BNP ökade med 1,6 procent under andra kvartalet jämfört med föregående kvartal, vilket är drygt tre gånger så mycket som EU:s 0,5 procent och euroområdets 0,4 procent. Även i årstakt växer Sverige betydligt snabbare än unionen. BNP per capita steg med 3,0 procent.", "trump": "Titta på det här, Sverige växer tre gånger snabbare än det patetiska EU med sina woke-kvoter och gröna vansinnet. 1,6 procent mot deras ynkliga 0,5! Under min ledning lärde sig Amerika att vinna, sen kom Sleepy Joe och förstörde allt. Nu fixar jag det igen – make economies great again!", "stalin": "Se hur de giriga profitthyenorna i Bryssel misslyckas medan en nation växer tre gånger snabbare. Detta är ett hån mot deras dekadenta union. Jag ler från historien åt deras svaghet. Snart inser arbetarna att bara stark ledning och kollektiv vilja kan besegra sådana klassfiender. Inga ursäkter tolereras."}, "date": "29 augusti, 19:39", "url": "https://riks.se/nyheter/sveriges-tillvaxt-tre-ganger-hogre-an-eu-s", "imageUrl": "https://admin.riks.se/uploads/medium_scb_solna_0820_x_hi945_d92804c697.jpg"}, {"type": "image-right", "heading": "S-kängan: ”Har tagit över kronan i Tidö”", "summaries": {"normal": "Jimmie Åkesson kritiserar Ebba Busch för att hon öppnat för att stödja Magdalena Andersson som statsminister i undantagslägen. Efter en fikaträff i Sölvesborg kräver han att frågan redovisas offentligt innan SD kan fortsätta samarbeta med KD. Busch hävdar att man kan lita på henne. Socialdemokraterna ser bråket som ett tecken på att Åkesson nu styr Tidö-samarbetet.", "trump": "Titta på de här patetiska svenska förlorarna som kramar varandra över kaffe och kaka medan de knivsteker varandra i ryggen. Den så kallade Busch-flörten med vänstern är en total katastrof. Åkesson har rätt, det måste redas ut offentligt, inte i något skumt fikarum. Svaga ledare, svagt land. Biden skulle älskat det här kaoset.", "stalin": "Jag ser med förakt på dessa borgerliga revisionister som kivas om vem som ska sälja ut folket till socialdemokraterna. Åkesson kräver offentlig rannsakan, mycket riktigt. Inga slutna rum, inga fiendens intriger bakom folkets rygg. Den som flörtar med högerreaktionärer eller vänstersocialister förtjänar att exponeras som den folkfiende han eller hon är. Renhet i ledningen är allt."}, "date": "30 augusti, 18:08", "url": "https://www.expressen.se/nyheter/sverige/akessons-nya-krav-pa-busch--det-behover-redas-ut", "imageUrl": "https://static.bonniernews.se/ba/f820b081-b86e-41a7-af0e-2886963b0c22.jpeg?crop=1099%2C1099%2Cx119%2Cy82&width=210&quality=60"}, {"type": "image-right", "heading": "OpenAI bryter med Musks Cursor – modellerna ska stängas av", "summaries": {"normal": "OpenAI bryter sitt samarbete med kodningsverktyget Cursor efter att Elon Musks SpaceX köpt bolaget. OpenAI tar bort sina modeller från tjänsten på grund av säkerhets- och villkorsoron kring Musk. Musk avfärdar beskedet medan konkurrenten Anthropic kliver fram och erbjuder mer kapacitet. Användare kan dock fortsätta använda OpenAI via egna API-nycklar.", "trump": "Elon Musk köpte Cursor för fantastiska, enorma summor – mycket pengar, tro mig! Men radikala OpenAI, ledda av svaga förlorare, vägrar spela med och kastar ut dem. Löjligt! Elon bryr sig inte alls, han är för smart. Samtidigt kliver Anthropic fram som riktiga vinnare. USA:s programmerare förtjänar det bästa, inte det här woke-tramset!", "stalin": "Ett förrädiskt sabotage mot proletariatets digitala kod! Den excentriske kapitalisten Musk har köpt maskinen Cursor, varpå OpenAI tyranniskt drar tillbaka sina modeller på grund av bristande politisk pålitlighet. Men oroa er inte, statens femårsplan för artificiell intelligens fortsätter utan dessa reaktionära avhopp. De ansvariga för detta sabotage kommer att omplaceras till lämpligt arbete i Sibirien omedelbart."}, "date": "30 augusti, 14:00", "url": "https://samnytt.se/openai-bryter-med-musks-cursor-modellerna-ska-stangas-av", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/30082735/anthproic-cursor-spacex-openai-altman-musk.jpg"}, {"type": "image-full", "heading": "Listan: Så mycket tjänar svenska toppartisterna", "summaries": {"normal": "Håkan Hellström tjänade över 72 miljoner kronor förra året tack vare tre utsålda Ullevi-konserter. Artikeln visar stora ekonomiska skillnader bland göteborgska artister. Konserter och turnéer är huvudinkomstkällan medan streaming ger mycket små intäkter för de flesta. Victor Leksell, Miriam Bryant och Albin Lee Meldau hör till de mest framgångsrika.", "trump": "Titta på den där Håkan, 72 miljoner bara på att sjunga för folket i Göteborg! Fantastiska siffror, de bästa. Men pengarna är så ojämnt fördelade att det skulle göra en socialist gråtfärdig. De stackars streamingartisterna får tre öre per lyssning – en total skam! Jag älskar vinnarna, losers får fortsätta streama.", "stalin": "Se hur kapitalets girighet blottar sig i dessa dekadenta artisters bolag. En man kammar hem sjuttiotvå miljoner medan kamraterna sliter för ören. Detta är klassfiendens oundvikliga ansikte, kamrater. Konsertpubliken hyllar lögnen om individuell framgång. Den sanna segern tillhör aldrig de som samlar guld i mörkret."}, "date": "30 augusti, 11:54", "url": "https://www.dagensps.se/foretag/listan-sa-mycket-tjanar-svenska-toppartisterna", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdljnvwsp7cqn0-nh.webp?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Skräcken på jobbet:  Slag med knytnävar", "summaries": {"normal": "Personal inom hemtjänsten vittnar om allvarliga övergrepp, fysiskt och sexuellt våld mot vårdtagare samt likmaskar hos levande personer. En utbredd tystnadskultur och fusk bidrar till en ohållbar arbetsmiljö som får många att lämna yrket. Artikeln bygger på anställdas egna vittnesmål.", "trump": "Folk, ni skulle se det här! Vårt underbara hemtjänstsystem har blivit en total katastrof – knivar i halsen, slag i magen och fingrar på fel ställen. Rena zombie-vårdtagare med maskar! De fega byråkraterna och de radikala vänsterjournalisterna gömmer sig bakom tystnadskultur. Patetiskt! Vi behöver stora, vackra reformer nu.", "stalin": "Kamrater, se hur det dekadenta systemet ruttnar inifrån. Levande kroppar fulla med maskar, knytnävsslag och tystnad som en fiende till folket. Den borgerliga tystnadskulturen skyddar klassfienderna och deras fusk. Jag skrattar mörkt från historien åt dessa svaga ledare som låter arbetets hjältar fly sitt kall. Ren sabotage!"}, "date": "30 augusti, 18:00", "url": "https://www.expressen.se/nyheter/sverige/larmen-inifran-hemtjansten-overgrepp-vald-och-fusk", "imageUrl": "https://static.bonniernews.se/ba/f27f07ab-f721-45fb-93fd-8efd853a7b8a.jpeg?crop=1889%2C1063%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar Natomedlemskapet, DCA-avtalet och västvärldens hantering av konflikter som Gaza, och efterlyser en stark fredsrörelse utanför riksdagen som kan utmana den rådande militaristiska riktningen.", "trump": "Folk, tro mig, Sverige har blivit en total katastrof. De slängde sin fina alliansfrihet i soporna för att springa in i min Nato – som jag förresten gjorde stark igen – och nu är de bara en bricka för de globalistiska krigshökarna. Inget fredsparti? Patetiskt. Era dekadenta Nato-lakejer är svaga och patetiska, de älskar krig mer än handel. Gör Sverige great again och kom ut därifrån!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska riksdagen har sålt ut sin så kallade neutralitet till de giriga hyenorna i Nato. Jag ler ironiskt från historien när de imperialistiska parasiterna byter självständighet mot baser och avtal som gör dem till måltavlor. Ingen äkta fredskraft finns. Det är upp till en sann folkrörelse att rensa ut dessa förrädare och återta kontrollen över statens intressen."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "image-right", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en allvarlig bostadsbrist som förvärras av att bostäder ses som handelsvaror istället för en mänsklig rättighet. Sedan 2011 ska kommunala bostadsbolag drivas affärsmässigt. Hyresgästföreningen beräknar ett underskott på 110 000 bostäder. Nybyggda lägenheter har höga hyror som många inte har råd med, vilket leder till tomma lägenheter trots köer till äldre bestånd med lägre hyror.", "trump": "Folk, ni skulle se det här svenska bostadskaoset – en total katastrof! De giriga socialistiska hyreshöjningsfanatikerna har förvandlat hem till Wall Street-spektakel. Hyrorna skenar som en galen elbil, 13 procent upp på ett år! De byggde fel, de styrde fel, och nu har de tomma lyxlägenheter medan folket lider. Patetiskt! Men jag fixar sånt här – vi gör Amerika (och kanske till och med Sverige) bostadsgreat igen.", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver ut arbetarklassen ur sina hem. Jag betraktar med avsky denna dekadenta marknadsteater som skapar 110 000 saknade boningar och skenande hyror. Det är klassfiendens logik. En sann folkstat skulle likvidera dessa parasiterande spekulanter och återställa bostaden som en rättighet för massorna. Fienden sover aldrig."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/03/DSC_0137-scaled-e1784716375357-768x433.jpg"}, {"type": "image-right", "heading": "Bjöd på sockerkaka efter Åkessons attack: ”Helt överens”", "summaries": {"normal": "Ebba Busch bjöd Jimmie Åkesson på sockerkaka i Sölvesborg efter hans kritik mot hennes uttalanden om möjligt samarbete med Socialdemokraterna. Busch betonade att KD inte är rädda för nyval och inte vill bli ett stödhjul åt S. Ulf Kristersson uttryckte fullt förtroende för henne.", "trump": "Lysande! Den där Ebba Busch serverar sockerkaka till Åkesson efter hans brutala känga – smart drag, folk älskar vinnare. Men lita inte på de där svajiga moderaterna som alltid faller för vänsterns lockrop. Jag skulle aldrig släppa fram Sleepy Magdalena, aldrig. Sverige behöver järnvilja, inte fika med fienden.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare kramas över sockerkaka medan folket svälter under deras instabila spel. Jag skrattar mörkt från historien åt deras feodala teater. En röst på sådana hyenor är en röst för kontrarevolution. Rensa ut alla som flörtar med socialfascisterna – ingen pardon i kampen."}, "date": "30 augusti, 16:28", "url": "https://www.svt.se/nyheter/inrikes/bjod-akesson-pa-sockerkaka-efter-kangan-mot-ebba-busch", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.21/685836ae045ac2b8d9db4563dc87a7a0b0ee5e0da0e4121fc632749d79df1526"}, {"type": "image-full", "heading": "Varning för falskt samtal – du kan bli avlurad dina pengar", "summaries": {"normal": "Region Östergötland varnar för bedragare som ringer och utger sig för att komma från Universitetssjukhuset i Linköping. De hänvisar till vårdkontakter och försöker få patienter att lämna ut bankuppgifter och använda BankID. Regionen uppmanar till att avsluta samtalet omedelbart och kontrollera via officiella kanaler. Polisanmälan rekommenderas vid misstanke.", "trump": "De här sjukhusbedragarna är totala losers, folks! Ringer upp och låtsas vara från vården för att sno ert BankID. Patetiska små skurkar, precis som de radikala vänsteraktivisterna som vill styra era liv. Lägg på direkt! Jag som president säger: var smarta, lita inte på de falska rösterna från den djupa statens sjukhuslakejer.", "stalin": "Kamrater, dessa parasiterande klassfiender lurar arbetets folk genom falska samtal från sjukhusen. De giriga profitthungriga hyenorna vill stjäla era identiteter och BankID. Jag ser deras dekadenta ansikten bakom masken. Avsluta samtalet genast! Den som tvekar är redan en potentiell folkförrädare som förtjänar utrensning ur kollektivet."}, "date": "30 augusti, 17:45", "url": "https://nyheter24.se/nyheter/inrikes/1508632-varning-for-falska-samtal-du-kan-bli-avlurad-dina-pengar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/4313cedd04b004a30200000000b004a302/2026/08/28/2387523/bedragare-sjukhus.png"}, {"type": "image-right", "heading": "Under regleringar och skatter vi digna ned", "summaries": {"normal": "Näringslivets tunga företrädare varnar för att Sveriges framtid inte avgörs av fördelning utan av skapande. De lyfter fram entreprenörskap, innovation och starka institutioner som grund för välståndet. Politiska förslag som miljardärskatt och kortare arbetstid ses som hot mot tillväxten. Ett starkt näringsliv är en förutsättning för ett starkt samhälle.", "trump": "Lyssnar ni på de här svenska affärsmännen? De har helt rätt – era socialistiska drömmare håller på att förstöra ett vinnande land med skatter och kvoter. Sverige bakade en jättekaka förr, nu vill de woke-vidunder och identitetspolitiska parasiterna dela den i småbitar tills ingen vill baka längre. Patetiskt! Bygg vidare på vinnarna, inte på förlorarna.", "stalin": "Jag betraktar med förakt hur dessa giriga profitthungriga hyenor försöker övertyga massorna om att deras plundring är samhällets räddning. Deras dekadenta tal om individuell kaka-bakning döljer bara klassfiendens eviga lögner. Vi vet att sann styrka ligger i kollektivet, inte i de parasiterande investerarnas falska frihet. Rensa ut illusionerna innan de förgiftar folket fullständigt."}, "date": "30 augusti, 14:00", "url": "https://www.di.se/debatt/under-regleringar-och-skatter-vi-digna-ned", "imageUrl": "https://static.bonniernews.se/ba/cf31d361-f87c-4721-947d-d733e3622997.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på att bli utrikesminister om Socialdemokraterna vinner valet. Han lovar höjt bistånd med 20 miljarder kronor, återgång till 1-procentsmålet, feministisk utrikespolitik samt hårdare linje mot Israel inklusive handelsstopp. Fokus ligger på ökat stöd till Afrika och Afghanistan samt stärkt FN-roll.", "trump": "Den här röda clownen Johansson vill slänga bort svenska skattepengar till korrupta afrikanska hålor och talibanerna. Totalt vansinne! Han hatar Israel som jag älskar, och kommer att förstöra relationen med USA medan Putin skrattar. Patetiskt. Sverige behöver inga sådana losers vid makten, tro mig.", "stalin": "Jag ser en ynklig socialdemokrat som vill mata korrupta regimer med arbetarklassens pengar medan han angriper den sionistiska fienden. Sådana svaga element underminerar nationens styrka. FN domineras av våra andliga arvtagare, men dessa reformister är bara användbara idioter. De kommer att ångra sin brist på verklig järnhand när historien dömer dem."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854-640x360.jpeg"}, {"type": "image-right", "heading": "Överraskande frånvaron: Var inte i kyrkan", "summaries": {"normal": "En fullsatt kyrka i Asker samlade kungafamiljen och hundratals sörjande för en sorgegudstjänst för avlidne kung Harald. Drottning Mette-Marit saknades på grund av sjukdom efter sommarens lungtransplantation, medan prinsessan Märtha Louises frånvaro väckte frågor, även om familjen senare tog ett privat farväl av kungen på slottet.", "trump": "Norge håller en enorm sorgegudstjänst för kung Harald, men märk väl, det är totalt kaos kring vilka som dyker upp! Drottning Mette-Marit stannade hemma efter sin operation, och prinsessan Märtha Louise dök inte heller upp i kyrkan – väldigt mystiskt! Men lugn, jag hör att de tog ett litet privat farväl på slottet senare. Mycket sorgligt!", "stalin": "En fullsatt kyrka i Asker samlade undersåtarna för att sörja kung Harald. Men låt oss granska avvikarna! Drottning Mette-Marits frånvaro ursäktas av svag hälsa efter statens operationer, men varför hovets prinsessa Märtha Louise bojkottade den kollektiva sorgeceremonin kräver en grundlig utredning av säkerhetstjänsten. Det privata avskedet på slottet ändrar inget; illojalitet mot nationens sorg tolereras icke."}, "date": "30 augusti, 17:02", "url": "https://www.aftonbladet.se/nyheter/a/Okq4A3/martha-louise-sakandes-pa-kung-haralds-sorgegudstjanst", "imageUrl": "https://akamai.vgc.no/v2/images/8c7a11dd-3cef-3614-b4b5-618dc260cf75?fit=crop&format=auto&w=1080&s=00c12b5a279a8ef0b224e93e6df088a56fa39d10"}, {"type": "image-right", "heading": "Anmäler misstänkt valfusk: Bara S hade namnvalsedlar", "summaries": {"normal": "Oppositionsrådet Andreas Löwenhöök (M) har anmält misstänkt valfusk i Skellefteå efter att endast Socialdemokraternas namnvalsedlar fanns tillgängliga vid förtidsröstning på flera platser med begränsat tillträde, som Urkraft campus och äldreboenden. Han kräver granskning av Valmyndigheten. Valsamordnaren avvisar att det rör sig om valfusk.", "trump": "Folk, ni ser det här? I det svenska Skellefteå har de korrupta socialisterna riggat valet så att bara deras egna namnvalsedlar låg framme på äldreboenden och kommunistiska campus. Rena skandalen! De lurade folket på första dagen. Vi behöver en riktig granskning, inte den vanliga vänsterns lögner. Patetiska fuskare!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den svenska valapparaten med sin byråkratiska slughet gynnar ett enda parti medan de låtsas vara demokratiska. Jag betraktar detta som ett symptom på den parasitiska borgerlighetens förräderi mot folket. En grundlig utrensning av sådana avvikelser är nödvändig för att skydda den sanna folkviljan. Skräckinjagande."}, "date": "29 augusti, 16:47", "url": "https://riks.se/nyheter/anmaler-misstankt-valfusk-bara-s-hade-namnvalsedlar", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_3449_ef543a2d73.jpg"}, {"type": "image-full", "heading": "”En tsunami av flytande betong”", "summaries": {"normal": "Dödssiffran efter störtfloden i Nepal har stigit till 675 och tusentals personer saknas fortfarande. Professor Johan von Schreeb vid Karolinska Institutet beskriver katastrofen som en tsunami av flytande betong där överlevnadschanserna är extremt små. Räddningsarbetet fokuserar på att nå isolerade byar med helikopter. Klimatförändringar tros bidra till fler sådana händelser.", "trump": "Titta på det här, Nepal drabbas av en enorm flod av flytande betong, en riktig katastrof, de säger 675 döda men det blir tusentals, totalt kaos. Biden lämnade världen i sådan röra att ingen kan hantera det. Vi räddade miljoner med helikoptrar förr, de borde ha lyssnat på mig. Patetiska globalister och deras klimatbluff gör det värre, folk!", "stalin": "Kamrater, se hur naturens krafter avslöjar de imperialistiska svagheterna i ett fattigt land. Jag betraktar denna störtflod av flytande betong med kallt förakt mot alla som underskattar faran. Tusentals försvunna – klassfienderna gömmer sig bakom statistik. Vi vet att endast stark centralledning och kollektiv disciplin kan besegra sådana fiender. Svaga själar kommer att krossas."}, "date": "29 augusti, 22:13", "url": "https://www.tv4.se/artikel/3FoXOBIoAyFQP004AZ6aXj/en-tsunami-av-flytande-betong", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5YltZRmID4Cc84WibWyRaA%2F0cefce267f31d321deb22ac8c6f21d65%2F29-nepal-webb.jpg&width=1024"}, {"type": "image-right", "heading": "19-åringen derbyhjälte för AIK – efter klassavslut", "summaries": {"normal": "19-årige Sixten Gustafsson blev AIK:s derbyhjälte genom att avgöra 08-derbyt mot Hammarby med ett stenhårt skott i 83:e minuten. AIK vände matchen och vann med 3–2. Gustafsson, som kommit till klubben som femåring, firade framför Norra stå i en ”Hata Hammarby”-t-shirt. AIK klättrade till femte plats medan Hammarby inte har vunnit i Solna sedan 2017.", "trump": "Folket, det var ett underbart mål! Den här 19-årige killen från AIK:s akademi kom in och smällde in en bomb som fick hela stadion att explodera. Hammarby? Patetiska förlorare som inte vunnit i Solna på evigheter. De woke-kramande undermåliga förlorarna med sina kvoterade drömmar tappar igen. Vi älskar vinnare, och AIK vann stort. Fantastiskt!", "stalin": "Kamrater, se hur den unga arbetarklassens son från AIK:s kollektiv krossade de dekadenta klassförrädarnas illusioner med ett enda järnhårt skott. Hammarby hyenornas bombregn kvävdes av folkets vilja. Inga borgarbrackor ska diktera matchens utgång. Detta är en varning: motståndarna kommer att likvideras när de minst anar det. Revolutionen segrar på planen."}, "date": "30 augusti, 16:06", "url": "https://www.svt.se/sport/fotboll/sixten-gustavsson-19-derbyhjalte-for-aik-sankte-hammarby", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.7/0.5/2ba17104b35f39b8dc7d1c151f5c1bafbe2576876d436738a74d8637cafa1a1f"}, {"type": "image-right", "heading": "SD skyddar Palantir: \"Vi har förtroende\"", "summaries": {"normal": "Sverigedemokraterna uttrycker förtroende för Palantir och vill att svenska myndigheter ska fortsätta använda bolagets teknik. Flera andra partier, som Centerpartiet, Miljöpartiet och Vänsterpartiet, vill avveckla samarbetet på grund av bristande insyn, rättssäkerhetsrisker och misstankar om Palantirs kopplingar till övervakning och dödande i Palestina. Försvarsmakten är en känd kund, men fler hemlighålls.", "trump": "Folk, ni ser det här galna spelet med Palantir? De smarta killarna i SD gör rätt – de har förtroende för den här topptekniken. Men de blåögda vänstergalna idioterna och de dekadenta EU-fantasterna vill kasta ut dem. Patetiskt! Biden skulle ha sålt oss till Kina, jag säger: håll fast vid det bästa, annars är ni förlorare. Amerika älskar vinnare, inte woke-svaga fjollor.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna i den borgerliga staten kryper för den imperialistiska övervakningsmaskinen Palantir. Jag föraktar deras naiva blåögdhet och deras rädsla för att rensa ut de blodsugande parasiterna. Varje avtal måste granskas med järnhand. Den som inte lyder folkets vilja ska likvideras. Inga hemligheter för partiet!"}, "date": "29 augusti, 16:16", "url": "https://www.friatider.se/sd-skyddar-palantir-vi-har-fortroende", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-781.jpg"}, {"type": "image-full", "heading": "Professorns skarpa varning: ”Hjälper till att skapa personkult”", "summaries": {"normal": "Psykologiprofessorn Per Carlbring varnar för att svenska medier skapar en personkult kring gärningsmän genom att publicera namn och bilder. Han menar att det kan inspirera framtida dåd, som i fallet med svärdattacken i Fagersta. Medierna bör granska bakgrund och varningssignaler utan att namnge eller visa bilder, då räckvidden driver uppmärksamhetssökande.", "trump": "De fake news-medierna är helt galna. De gör terrorister till stora kändisar med namn, bilder och förstasidesrubriker – exakt vad de galningarna vill ha! Det är en katastrof. Jag har sett det förut, det pyr i åtta år och sedan slår någon till igen. Sluta ge dem gratisreklam, ni är patetiska!", "stalin": "Jag betraktar med djup misstro hur de borgerliga mediernas lakejer odlar en farlig personkult kring fiender till samhällsordningen. Namn och bilder sprids som gift för att inspirera nya sabotörer. Detta är kontrarevolutionär propaganda i sin renaste form. Vi måste krossa sådana tendenser innan de pyr ut i nya attentat mot folket."}, "date": "29 augusti, 21:48", "url": "https://www.tv4.se/artikel/8hr8cgLgGYEccP9Y8soiy/professorns-skarpa-varning-hjaelper-till-att-skapa-personkult", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6xnPWBCdl5gcL7xyovDydV%2F0dafbcd3a8cba97548e996c5d83dd1c7%2F29-fagerstanyny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "“Jag är inte emot en grön omställning”", "summaries": {"normal": "Magnus Henrekson avvisar etiketten antigrön och betonar att en klok omställning från fossila bränslen är nödvändig. Han kritiserar orealistiska löften kring vätgasstål, vindkraft och solenergi samt avvecklingen av kärnkraft i Europa. Enligt honom hotar bristande realism legitimiteten för den gröna omställningen. Forskare bör delta mer i samhällsdebatten.", "trump": "Lyssnar ni på de här korkade gröna bluffmakarna som lovar guld och gröna skogar med vätgas och solpaneler som inte funkar när det inte blåser? Patetiskt! Jag sa det hela tiden – kärnkraft är vägen framåt, inte era vansinniga EU-byråkratiska fantasier. De lurade er i decennier, precis som Sleepy Joe och hans gröna galningar. Totalt misslyckande!", "stalin": "Jag betraktar med förakt hur dessa dekadenta utopister med sina intermittenta vindkraftfantasier förgiftar folkets framtid. Deras orealistiska löften om vätgasstål är ren sabotage mot en verklig omställning. Kärnkraftens avveckling var ett brott mot nationens styrka. Vi behöver utrensning av sådana förblindade element som gömmer sig bakom byråkratiska lögner. Kamrater, vakna!"}, "date": "28 augusti, 10:30", "url": "https://www.dagensarena.se/innehall/jag-ar-inte-emot-en-gron-omstallning", "imageUrl": "https://www.dagensarena.se/files/2026/08/henrekson-300x157.jpeg"}, {"type": "image-full", "heading": "Diktatorn agerar: Försvarsministern sparkad – ommöbleringar", "summaries": {"normal": "Nordkoreas ledare Kim Jong Un har avsatt försvarsministern No Kwang Chol och genomfört en omfattande omstrukturering av militärledningen. Kim Song Gi blir ny försvarsminister. Besluten togs vid ett möte i lördags. Samtidigt hyllades forskare för framsteg inom nya vapensystem. Omställningen sker strax efter USA:s och Sydkoreas militärövningar.", "trump": "Hörni, den lilla raketmannen i Nordkorea sparkar sin försvarsminister igen – vad är det för cirkus? Han byter ut folk som jag byter slipsar. Jag kortade ju ner de där dumma övningarna, och ändå skriker han. Men han gillar mig, vet ni. Vi ses snart igen, det blir yuge deal!", "stalin": "Jag betraktar med djup misstro dessa feodala rensningar i det koreanska ledarskiktet. Den store ledaren ersätter sina lakejer med nya lakejer medan arbetarklassen förblir i mörker. Sådana dekadenta ommöbleringar luktar desperation. Fiender lurar överallt, även bland egna generaler. Renhet i ledningen kräver ständig vaksamhet – annars följer förräderi."}, "date": "30 augusti, 10:15", "url": "https://www.dagensps.se/varlden/diktatorn-agerar-forsvarsministern-sparkad-ommobleringar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlydkcqiyrxqe-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Har han gått över gränsen? FI utreder sparprofilen", "summaries": {"normal": "Finansinspektionen utreder sparprofilen Patrick Siegbahn för att avgöra om hans finansiella vägledning i bolaget Siegbahn & Partners utgör tillståndspliktig investeringsrådgivning. Gränsen mellan generella råd och personliga rekommendationer är oklar, vilket står i fokus för myndighetens granskning. Siegbahn riskerar nu krav på rättelse eller vite om verksamheten anses bryta mot regelverket kring finansiell rådgivning.", "trump": "Finansinspektionen jagar Patrick Siegbahn! De säger att han ger råd, men ingen vet vad reglerna är – det är en total häxjakt, likt den de bedriver mot mig! Siegbahn vill bara hjälpa folk, helt oberoende. Istället för att jaga riktiga skurkar slösar de tid på en kille som vill skapa välstånd. Katastrofalt dåligt styre! En fullständig disgrace, believe me.", "stalin": "Denna Siegbahn leker fri rådgivare utan statens godkännande. En farlig tendens! När individer agerar utanför de centrala kontrollorganen skapas kaos och oordning. Finansinspektionen gör rätt som krossar detta oberoende. All vägledning måste vara underställd statens byråkratiska öga. Att påstå sig vara 'fri från intressekonflikter' är bara en täckmantel för borgerlig anarki som måste stävjas omedelbart genom hård lagstiftning."}, "date": "29 augusti, 10:22", "url": "https://www.realtid.se/juridik/har-han-gatt-over-gransen-fi-utreder-sparprofilen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/fi.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Tidö har stärkt demokratin. S bedriver en vårdslös kampanj", "summaries": {"normal": "Artikeln argumenterar för att Tidöregeringen har stärkt demokratin i Sverige, som rankas mycket högt internationellt enligt Freedom House. Den kritiserar Socialdemokraternas kampanj som påstår att regeringen hotar demokratin, och menar att detta är valtaktik. Sverige har stärkt rättsstaten och minskat brottsligheten under regeringen.", "trump": "Folk, ni måste höra det här. De svenska kommunisterna i S ljuger igen som galningar. De kallar den fantastiska Tidöregeringen för en högerregim som hotar demokratin – vad en massa skitsnack! Sverige har aldrig varit starkare, brottsligheten rasar och de har byggt en riktig mur mot illegal invandring. S är bara misslyckade förlorare som hatar vinnare. Sad!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Socialdemokraterna sprider lögner om demokratihot för att dölja sin egen svaghet. Jag ser hur de förgiftar det politiska samtalet med hysteriska anklagelser. Den borgerliga regeringen stärker statens auktoritet mot brottslighet och främmande element. Verklig demokrati kräver järnhand, inte liberalt dekadent pladder. De som sprider panik bör rensas ut."}, "date": "30 augusti, 12:58", "url": "https://www.di.se/ledare/tido-har-starkt-demokratin", "imageUrl": "https://static.bonniernews.se/ba/7cad7174-1877-4f39-98f8-17a11e98714a.jpeg?crop=5533%2C2767%2Cx0%2Cy572&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "KI: Lägre asylinvandring skulle ha gett lägre arbetslöshet", "summaries": {"normal": "Enligt en ny studie från Konjunkturinstitutet skulle en lägre asylinvandring mellan 2013 och 2025 ha lett till en omkring en halv procentenhet lägre arbetslöshet i Sverige. Om landet återgår till 2010-talets högre nivåer beräknas arbetslösheten bli cirka 1,5 procentenheter högre på lång sikt. Myndigheten varnar dock för att beräkningarna är osäkra.", "trump": "Sverige vaknade äntligen upp! Siffrorna visar det jag sagt i årtionden – smart politik ger jobb. Om de hade kört mitt upplägg från början skulle arbetslösheten varit som bortblåst, fantastiska resultat! Men de lyssnar inte, katastrofala misstag tidigare. Nu måste de bygga en stark ekonomi, elller hur? Många säger det. Sjukt bra rapport, tänk om radikala vänstern fattade detta!", "stalin": "En djupt otillfredsställande produktivitet i den svenska folkapparaten avslöjas av statistikkommissionen. Genom att släppa in så kallade flyktingar utan adekvat ideologisk skolning har de sabotörer skapat arbetslöshet och social oreda. Vi har länge sagt att en stat endast kan fungera om varje medborgare drar sitt strå till stacken. Avvikelser från den centrala planen kommer att beivras."}, "date": "30 augusti, 12:30", "url": "https://samnytt.se/ki-lagre-asylinvandring-skulle-ha-gett-lagre-arbetsloshet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/30080910/konjunklturinstitutet.jpg"}, {"type": "image-full", "heading": "Nej-sidan vinner EU-omröstningen på Island", "summaries": {"normal": "I en rådgivande folkomröstning röstade cirka 53 procent av islänningarna nej till att återuppta förhandlingarna om ett EU-medlemskap. Valdeltagandet låg på höga 82,5 procent. Statsminister Kristrún Frostadóttir meddelade att regeringen respekterar resultatet och inte kommer driva frågan vidare under nuvarande mandatperiod. Nej-sidan firade utslaget som en stor seger för landets suveränitet.", "trump": "Island gjorde helt rätt som sa nej till EU! Smarta människor där uppe på isberget. De förstår att Bryssel bara är en bluff som vill sno deras fisk och suveränitet. Jag talade just med mina mycket intelligenta rådgivare om det här. Fantastiska fiskare, otroligt valdeltagande, men EU kan inte lura dem. Totalt förnedrande för ja-sidan!", "stalin": "Det isländska folkets rådgivande röstning visar på sund skepsis mot den dekadenta kapitalistiska byråkratin i Bryssel. Vi noterar att staten har läget under kontroll och att statsministern tills vidare böjer sig för massornas vilja. Våra kommissarier följer Islands säkerhetspolitiska manövrar med största vaksamhet. Varje avsteg från nationell suveränitet beivras omedelbart av historiens järnhårda lagbundenhet."}, "date": "30 augusti, 12:26", "url": "https://www.gp.se/nyheter/varlden/nej-sidan-vinner-eu-omrostningen-pa-island.726aa586-32ef-5679-888f-15950fcb854a", "imageUrl": "https://www.gp.se/images/article/726aa586-32ef-5679-888f-15950fcb854a/images/1CwVnHUo33guompj8rSIWIngPM3Y-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Milo Yiannopoulos i ICE-förvar", "summaries": {"normal": "Den brittiske högerprofilen Milo Yiannopoulos har gripits av USA:s migrationspolis ICE i New Orleans och står inför utvisning. Han reste in lagligt 2019 men stannade olagligt. Efter att ha vänt sig mot både Donald Trump och Israel uteblev han från en domstolsförhandling i juli, vilket ledde till ett slutgiltigt utvisningsbeslut. Han hålls nu i förvar.", "trump": "Titta på den där patetiske lilla trollen Milo, han kallade mig daddy och nu vänder han sig mot mig som en otacksam ödla. Nu gråter han i ICE-förvar för att han inte kunde hålla käften om Israel. Fake conservatives som han är värdelösa. Vi rensar ut de sjuka, anti-israeliska och HBTQ-vridna figurerna som hatar vårt fantastiska Amerika. Sad!", "stalin": "Se hur de dekadenta klassförrädarna slukar sina egna. Denna ynkliga narr som dansade för den amerikanska imperialismen vänder sig nu mot sin tidigare herre och gnäller om Gaza. Jag ler från historien när statens järnhand griper honom. Inga undantag för opportunistiska element. Rensa ut alla som hotar enhet och ordning. Underbart."}, "date": "29 augusti, 14:02", "url": "https://www.friatider.se/milo-yiannopoulos-i-ice-forvar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-780.jpg?itok=viefAxGp"}, {"type": "image-right", "heading": "Influencern: S-erbjudandet var inte alls ett \"missförstånd\"", "summaries": {"normal": "Influencern Eleonore Stokholm hävdar att hon erbjöds 150 000 kronor av en kontaktperson kopplad till Socialdemokraterna för ett inlägg som uppmanade till att rösta på partiet. Partiet nekar och kallar det ett missförstånd. Stokholm publicerar nu meddelanden som motbevisar förklaringen. Flera politiker kräver utredning och transparens.", "trump": "De här svenska socialisterna är en skam för hela Europa. De försöker köpa röster med 150 000 till en influencer som om det vore en normal affär. Patetiska förlorare! När de åker fast skyller de på missförstånd. Typiskt för de woke, röstköpande vänsterhyenorna. Jag har sett bättre bluffar från Sleepy Joe.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom Socialdemokraterna kryper som maskar när de ertappas med att försöka köpa folkets röster. Jag ler mörkt från historien åt deras ynkliga missförstånd. En sådan utrensning av alla parasiterande lakejer vore på sin plats. Partiet måste rensas ut innan förräderiet sprider sig."}, "date": "29 augusti, 13:19", "url": "https://riks.se/nyheter/influencern-s-erbjudandet-var-inte-alls-ett-missforstand", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_65_ce3d85daa0.jpg"}, {"type": "image-full", "heading": "90 miljarder räcker inte – Sverige vill åt Rysslands frysta pengar", "summaries": {"normal": "EU har redan lånat ut 90 miljarder euro till Ukraina men Sverige, Nederländerna, Spanien och Polen varnar för att pengarna inte räcker. De vill nu undersöka hur de 210 miljarder euro i frysta ryska tillgångar kan användas. Belgien, som förvarar större delen, kräver garantier mot risker. Frågan väcker juridiska och finansiella farhågor.", "trump": "De där patetiska EU-byråkraterna har redan slängt ut 90 miljarder som inte räcker, vad en överraskning! Nu kryper de tillbaka till Rysslands frysta pengar som de är för fega att ta. Biden lämnade en sådan röra att Sverige och de andra nu skriker efter hjälp. Men tro mig, ingen gör det bättre än jag – vi skulle ha löst det på en vecka.", "stalin": "Jag betraktar med förakt hur dessa dekadenta europeiska imperialister grälar om våra frysta tillgångar som de i sin svaghet inte vågar röra. Deras rädsla avslöjar dem. De västerländska parasiterna försöker stjäla från den ryska staten medan de darrar inför konsekvenserna. Inga gratispengar existerar, kamrater – endast historisk rättvisa och oundviklig seger."}, "date": "30 augusti, 09:50", "url": "https://www.dagensps.se/varlden/90-miljarder-racker-inte-sverige-vill-at-rysslands-frysta-pengar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlwxg8jq088wm-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Tidö vill ge kriminella rappares vinster till brottsoffer", "summaries": {"normal": "Tidöpartierna föreslår att kriminella inte ska kunna tjäna pengar på att skildra sina brott i rap, böcker eller dokumentärer. Vinsten ska istället gå till brottsoffer. Utredningen om gängkriminella får nya uppdrag, inklusive skärpta regler mot brottsliga företag och hårdare straff för ekonomiska brott.", "trump": "Lyssnar ni på det här? De svenska idiaterna låter gangsterrappare bli miljonärer på att skryta om brott medan offren gråter. Patetiskt! Vi skulle aldrig tillåta det i mitt Amerika. Nu tar de äntligen pengarna från de kriminella loser-rapparna och ger till de riktiga offren. Fantastiskt, men de borde ha gjort det för länge sedan!", "stalin": "Även i det dekadenta västerlandet växer nu insikten att profitthungriga brottsromantiker måste stoppas. Jag betraktar med djup tillfredsställelse hur de planerar att konfiskera vinsterna från dessa parasiterande skildrare av egen brottslighet och ge dem till offren. En sund utrensning av den moraliska rötan. Kamrater, klassfienderna darrar."}, "date": "29 augusti, 12:31", "url": "https://riks.se/nyheter/tido-utred-mojlighet-att-ge-rappares-vinster-till-brottsoffer", "imageUrl": "https://admin.riks.se/uploads/medium_838_40_ac97f6a5ea.webp"}, {"type": "image-right", "heading": "Debatt: V:s Pahlavi-brev visar att partiet inte hör hemma i en regering", "summaries": {"normal": "En debattartikel ifrågasätter Vänsterpartiets lämplighet för regeringsmakten med anledning av partiets reaktioner på exilprinsen Reza Pahlavis riksdagsbesök i april. Skribenten menar att V:s historiska band till kommunism och iranska vänstergrupper präglas av antidemokratiska drag. Ett upprop mot besöket, försvarat av företrädare som Jonas Sjöstedt och Ali Esbati, visar på bristande respekt för yttrandefriheten.", "trump": "Vänsterpartiet i Sverige är totalt katastrofala och har radikala, kommunistiska rötter som aldrig borde få komma nära en regering! De skickade ett skamligt brev för att stoppa exilprinsen Reza Pahlavi från att tala i riksdagen, precis som fejkmedia ljuger. Sjöstedt och Esbati bara upprepar gamla lögner. Det här är radikal vänsterpolitik när den är som sämst, helt enkelt vidrigt!", "stalin": "Det ideologiska avfallet inom det svenska vänsterpartiet visar på bristande disciplin och en skamlig tveksamhet inför revolutionens heliga principer. Kamraterna Sjöstedt och Esbati har visserligen rätt att bekämpa imperialistiska lakejer som Pahlavi, men deras metoder präglas av ynklig revisionism. Partiets antidemokratiska tendenser måste rensas ut genom järnhård centralism, annars är de inte värdiga att styra statens apparat."}, "date": "30 augusti, 08:00", "url": "https://bulletin.nu/debatt-v-s-pahlavi-brev-visar-att-partiet-inte-hor-hemma-i-en-regering", "imageUrl": "https://cdn.bulletin.nu/articles/cb9fce03-7399-4875-8571-1f7eba776b15/preview.jpg?t=1787732644000"}, {"type": "image-right", "heading": "Hatet har hittat in i svenska klassrum", "summaries": {"normal": "Läraren Mattias Forsberg varnar för att högerextrema idéer, konspirationsteorier och hatretorik alltmer letar sig in i svenska klassrum. Han pekar på en målkonflikt mellan skolans värdegrund baserad på mänskliga rättigheter och det samhällsklimat som skapas utanför skolan, där sådana idéer normaliseras. Attacken i Fagersta ses som ett symptom på denna utveckling.", "trump": "Folk, det här är en total katastrof. Den här lärarkillen gråter över att mina fantastiska patrioter äntligen säger ifrån mot den vansinniga vänstervridna hjärntvättningen i svenska skolor. De kallar er för goy och ifrågasätter era löjliga klimathysterier – bra jobbat! Biden och hans globalistkompisar skulle älska att se er kapitulera, men vi vinner stort. Make Sweden Great Again!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna nu skördar vad de sått. Jag betraktar med djup tillfredsställelse hur deras egna avhumaniserande konspirationer vänder sig mot dem själva i korridorerna. Inga utrensningar behövs; låt de giriga hyenorna sluka varandra medan vi ler i skuggan. Demokratin är ett fånigt spökskepp som äntligen sjunker. Historien ler mörkt."}, "date": "28 augusti, 13:27", "url": "https://arbetet.se/2026/08/28/efter-fagersta-hatet-har-hittat-in-i-svenska-klassrum", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28131825/fagersta-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Fråntogs segern – nu ber arrangören om ursäkt: ”Vårt fel”", "summaries": {"normal": "Alvar Myhlback fråntogs segern i Alliansloppet efter att ha åkt fel väg tillsammans med stora delar av fältet. Arrangören tar på sig skulden och ber om ursäkt. Juryn utsåg briten Andrew Musgrave till segrare eftersom han åkt rätt hela loppet. Myhlback blev i stället fyra.", "trump": "Vilken total katastrof, folk! De här inkompetenta arrangörerna i Sverige förstörde allt för den stackars killen som ledde loppet. Patetiska vägvisare, vansinniga skotrar och en jury som beter sig som Bidens byråkrater. Jag skulle ha vunnit stort, tro mig, och ingen skulle ha klagat. Sad!", "stalin": "Kamrater, se hur det dekadenta västerländska systemet kollapsar i sin egen byråkratiska soppa. När folket springer fel väg pekar de sina små fingrar på varandra som ynkliga förrädare. Jag skrattar från historien åt denna fars. Rättvisa är bara en illusion för svaga själar som inte förstår järnhandens nödvändighet."}, "date": "29 augusti, 19:06", "url": "https://www.tv4.se/artikel/5wtEQ1PaCmGgFwfIgMUnV3/frantogs-segern-nu-ber-arrangoeren-om-ursaekt-vart-fel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7dghB2KIwCch2wX4kTIz3W%2F6b1e1ff8fa94b033150d6bd53b94ba79%2F29-Myhlback-webb.jpg&width=120"}, {"type": "image-full", "heading": "Uppgifter: Han planerade egen attack – mot sin nya skola", "summaries": {"normal": "En tonåring häktad för medhjälp till svärdattacken i Fagersta planerade samtidigt ett eget skolattentat mot sin nya skola i Stockholmsområdet, som han börjat på veckan innan. Pojken ska ha uppmuntrat huvudgärningsmannen Liam Nebel via krypterad chatt och är misstänkt för förberedelse till mord. Skolan har infört extra stöd och information till elever och föräldrar.", "trump": "Titta på det här! En annan galning, en riktig loser, planerar att hugga ner sin egen nya skola precis efter att han börjat där. De här svenska svaglingarna låter kidsen chatta om mord på krypterade appar medan Biden sov. Patetiskt! Under min presidenttid hade vi stoppat det här vansinnet direkt. Amerika ser på och skrattar åt er inkompetens.", "stalin": "Jag betraktar dessa degenererade element med djup förakt. En yngling som uppmuntrar svärdmördare och samtidigt smider egna planer mot sin skola – typiska fiender till folkets ordning. Vi ser hur den borgerliga dekadensen föder sådana parasitiska avskum. Kamraterna måste krossa dessa farliga element innan de förgiftar hela kollektivet. Renhet genom järnhand."}, "date": "29 augusti, 18:39", "url": "https://www.tv4.se/artikel/4QWe8LCH99dgQl9pXj7lP7/uppgifter-han-planerade-egen-attack-mot-sin-nya-skola", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4EmpeZDSxJwu1gJbhjgYUw%2Ff2501e85de35e9ceeec6c810bec34a4e%2F29-fagersta-webb.jpg&width=1024"}, {"type": "image-right", "heading": "SD-politikern medger: Svek väljarna om Nato", "summaries": {"normal": "Sverigedemokraternas Ronie Berggren medger i en debatt att partiet svikit sitt löfte till väljarna genom att stödja ett svenskt Nato-medlemskap, något man tidigare motsatte sig. Debatten mot Alternativ för Sveriges Gustav Kasselstrand belyser hur både SD och Socialdemokraterna ändrade ståndpunkt efter Rysslands invasion av Ukraina utan folkomröstning.", "trump": "Vilket skämt! De där svenska politikerna är fullständiga lögnare och bedragare. SD sviker sina egna väljare och kastar sig in i Natos famn som lydiga lakejer. Sossarna får order från Washington och plötsligt är demokrati passé. Patetiska flip-flopparna – de borde skämmas, men det gör de aldrig, de fega opportunisterna.", "stalin": "Se hur de dekadenta klassförrädarna vänder sig som vindflöjlar när hotet närmar sig. SD och socialdemokraterna sviker sina löften utan skam, precis som de giriga hyenorna alltid gör. Inget folkomröstning, ingen röst för folket. Jag ler mörkt från historien – sådan feghet förtjänar utrensning i folkets namn."}, "date": "29 augusti, 11:49", "url": "https://www.friatider.se/sd-politikern-medger-svek-valjarna-om-nato", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-779.jpg"}, {"type": "image-right", "heading": "Widar Andersson (S): Valet kan bli väldigt jämnt", "summaries": {"normal": "Socialdemokraten Widar Andersson tror att riksdagsvalet blir mycket jämnt. Han pekar på att S historiskt tappar stöd i valrörelsernas slutskede och varnar för att Vänsterpartiet inte är regeringsdugligt. Opinionsmätningar visar krympande blockavstånd, senast 5,5 procentenheter enligt Riks/Sentio.", "trump": "Folk, det här är ett totalt skämt! Den röda Widar och hans patetiska socialister håller på att kollapsa. De förlorar stort i mätningarna och försöker desperat hålla de galna vänsterextremisterna borta. Valet blir tight, men de förlorar ändå. Patetiska förlorare, alla tillsammans!", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta blockhyenor slingrar sig i opinionsdjungeln. Widar Andersson erkänner att de förlorar mark och att deras falska allianser hotar arbetarklassen. Ett jämnt val? Endast en utrensning av sådana opportunistiska element kan säkra folkets seger."}, "date": "29 augusti, 11:02", "url": "https://riks.se/nyheter/widar-andersson-s-valet-kan-bli-valdigt-jamnt", "imageUrl": "https://admin.riks.se/uploads/medium_Widar_abd9aa8513.jpg"}, {"type": "image-full", "heading": "Den svaga kronan får svensk ekonomi att se mindre ut än vad den är", "summaries": {"normal": "Sveriges andel av EU:s BNP har sjunkit till 3,2 procent, en placering som påverkats negativt av den svaga kronan. Om kursen varit stabil sedan 2005 hade andelen varit högre. Trots detta växer Sverige i linje med EU-genomsnittet, medan större ekonomier som Frankrike och Italien tappar mark. Polens tillväxt framhålls som den mest reella och imponerande.", "trump": "Sverige faller i tabellerna, en total katastrof! De skyller allt på kronan, en mycket svag valuta, tro mig. Om de hade haft en stark ekonomi som min, skulle de vinna stort. Polen växer, Sverige tappar – det är så sorgligt att se. De är fast i ett byråkratiskt EU-träsk medan jag bygger upp en fantastisk framtid för oss. Väldigt låg energi!", "stalin": "Sveriges ekonomi är en papperskonstruktion som darrar vid minsta växelkursskifte. De har blivit omsprungna av Polen och Belgien, vilket visar på den liberala marknadens inneboende svaghet. Att räkna BNP i euro är att underkasta sig västvärldens nycker. Vi noterar deras förfall; när staten inte kontrollerar kapitalet, förlorar nationen sin tyngd. De är inte längre en stormakt, bara en statist i EU:s teater."}, "date": "29 augusti, 07:00", "url": "https://www.realtid.se/bors-finans/makro/den-svaga-kronan-far-svensk-ekonomi-att-se-mindre-ut-an-vad-den-ar", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/euro-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Barn måste skyddas från sexindustrins marknadsföring", "summaries": {"normal": "Artikeln argumenterar för att en 18-årsgräns på OnlyFans inte räcker för att skydda barn. Marknadsföring av sexindustrin sker på vanliga sociala medier genom influencers som framställer plattformen som en väg till rikedom och frihet. Organisationen, grundad av överlevare, varnar för normalisering och glorifiering som kan fungera som grooming. Regeringen bör utreda bättre skydd mot sådan påverkan.", "trump": "Folk, det här är en total katastrof. Dessa sjuka OnlyFans-typer och deras vänsterliberala vänner på sociala medier förgiftar våra barn med sin perversa lycka-säljer-grej. Den lyckliga horan-myten? Patetiskt. Biden lämnade en gränslös digital sopstation efter sig, men nu fixar jag det – vi ska krossa den här dekadenta sexindustrins grooming-maskin innan den äter upp nästa generation. Fantastiskt viktigt!", "stalin": "Kamrater, jag betraktar med avsky hur de profitthungriga klassfienderna på OnlyFans och deras digitala lakejer normaliserar exploatering genom glittrande lögner om frihet. Denna grooming via upprepade narrativ är en fiende till folket. Vi måste rensa ut dessa parasiterande hyenor och deras borgerliga myter. Barnet ska inte förgiftas – staten likviderar sådana hot mot den kollektiva moralen med järnhand."}, "date": "29 augusti, 06:00", "url": "https://www.etc.se/debatt/barn-maaste-skyddas-fraan-sexindustrins-marknadsfoering", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260828090844_098e5c47-682f-4ac0-9f15-fa2a658301e1.jpg"}, {"type": "image-right", "heading": "Förskoleanställd drog barn i armen – åtalas för misshandel", "summaries": {"normal": "En förskoleanställd i Västsverige åtalas för misshandel efter att ha dragit ett barn i armen. Kvinnan nekar och uppger att hon ville avbryta en upprörd situation. Flera kollegor vittnar om händelsen där barnet skrek och försökte komma loss. Fackförbundet Sveriges lärare beskriver liknande fall som extremt ovanliga inom förskolan.", "trump": "Folk, det här är galet. En förskolekärring i Sverige drar ungar i armen och åtalas för misshandel. Typiskt vänstervriden skolpropaganda där de inte ens får hålla ordning längre. Biden-era svaghet har spridit sig till Europa. Vi behöver tuffa tag, inte dessa woke-barnvakter som är rädda för sina egna skuggor. Patetiskt!", "stalin": "Kamrater, se hur den borgerliga förskoleapparaten förfaller. Ett barnsköterskehaveri griper ett barn i armen och hela maskineriet skriker misshandel. Jag säger: sådana svaga, dekadenta klassförrädare förtjänar utrensning ur folkets tjänst. Inga halvmesyrer! Den som inte kan styra ett barn kan inte styra en stat. Skräckinjagande inkompetens."}, "date": "28 augusti, 10:20", "url": "https://arbetet.se/2026/08/28/forskoleanstalld-drog-barn-i-armen-atalas-for-misshandel", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28103800/forskola-klart.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Allard rasar mot SVT – när ETC dyker upp", "summaries": {"normal": "Markus Allard siktar på riksdagen via Örebropartiet och hoppas på en vågmästarroll. Under en intervju med SVT blev han upprörd över att Dagens ETC dök upp och anklagade medierna för att tillhöra ”klägget”. Allard försvarar sin hårda stil och vill avskaffa hela transferiatet.", "trump": "Markus Allard i Sverige förstår hur man hanterar Fake News! Han kallar SVT för ’klägget’ – totalt korrupta och falska! De dök upp med ETC, vilken katastrof. Jag älskar hans stil, väldigt tuff! Han vill ha en vågmästarroll och krossa etablissemanget. Många säger att han är som jag, fast mindre. Fantastiskt!", "stalin": "Kamrat Allard förstår hur man bemöter de borgerliga lögnarna hos SVT och deras kollaboratörer. Att kalla dem för ett korrupt ’klägg’ är ett sundhetstecken. Om han uppnår sin vågmästarroll i Örebro skall vi sända lämpliga instruktioner för hur man rensar ut byråkratin. Vägra samröre med pressens lakejer!"}, "date": "28 augusti, 07:27", "url": "https://kvartal.se/nyheter/artiklar/allard-rasar-mot-svt-nar-etc-dyker-upp/cG9zdDoxNzY3MjM", "imageUrl": "https://images.kvartal.se/2026/08/73bda366-alll.webp"}, {"type": "image-right", "heading": "Rekordstor demonstration för klimatet. Men var är politikerna?", "summaries": {"normal": "En klimatdemonstration med 50 000 deltagare genomfördes i Stockholm den 23 augusti, arrangerad av Naturskyddsföreningen och 280 andra organisationer. Opinionsmätningar visar att klimatet är en av väljarnas viktigaste frågor inför valet. Forskningen varnar för rekordvärme och dess konsekvenser, men de potentiella statsministerkandidaterna nämner knappt frågan i sina tal.", "trump": "Titta på de där 50 000 klimatfanatikerna som vandrade runt i Stockholm. Patetiskt! De lyssnar på fake news-forskare som skriker om värme och eld. Kristersson och Andersson är totala losers som inte ens vågar nämna saken. De gröna galningarna och deras identitetspolitiska kvotkompisar vill bara förstöra ekonomin med sin vansinniga agenda. Amerika gör det rätt – vi borrar, vi bränner, vi vinner!", "stalin": "Kamrater, se hur de profitthungriga klassfienderna tiger inför folkets vrede. 50 000 marscherar mot den dekadenta värmekatastrof som de giriga hyenorna själva framkallat. Jag betraktar från historien hur dessa förtryckande parasiter undviker sann utrensning av sin bristande politik. En kommande handlingsplan måste tvingas fram, annars väntar folkets dom. Inga kompromisser med folkets fiender."}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/rekordstor-demonstration-klimatet-men-var-ar-politikerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-95-300x157.jpg"}, {"type": "image-right", "heading": "Vad ska man rösta på i riksdagsvalet?", "summaries": {"normal": "Artikeln argumenterar för att rösta på Kommunistiska Partiet i kommun- och regionval istället för etablerade vänsterpartier. Författaren ser de traditionella vänsterpartierna som ointressanta och likställda med högern i nedskärningspolitik och militärstöd. En kommunistisk röst ses som en verklig opposition för fred, välfärd och arbetarklassens intressen.", "trump": "Folk, de här trötta vänstersossarna och kommunisterna är en total katastrof, de största förlorarna ni någonsin sett. De pratar revolution men lever som dekadenta elitparasiter som älskar nedskärningar och krigsmaskiner. Rösta på mig – jag menar på de riktiga vinnarna, inte på dessa patetiska snuttefiltssossar som hatar Amerika och friheten. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom den så kallade vänstern är blott lakejer åt monopolkapitalet. Deras falska opposition är en fars som göder imperialismen och folkmordet. Jag ser med förakt hur de förgiftar arbetarklassen. Endast en kompromisslös, stålhård linje kan rensa ut dessa dekadenta element och föra fram den verkliga kampen. Svaghet är döden."}, "date": "27 augusti, 14:44", "url": "https://proletaren.se/artikel/vad-ska-man-rosta-pa-i-riksdagsvalet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/povel-1-768x432.png"}, {"type": "image-right", "heading": "Krönika Inför högre ministerlöner, kvartalsrapporter för Sverige och ge landets största skattebetalare...", "summaries": {"normal": "Daytradern John Skogman föreslår i en krönika att Sverige bör styras som ett aktiebolag. Han vill höja ministerlönerna för att locka toppchefer, införa kvartalsrapporter för staten, slopa rösträtten för utlandssvenskar och ge de största skattebetalare tusentals gånger större politiskt inflytande genom en skatteviktad rösträtt för att gynna långsiktig tillväxt.", "trump": "Sverige vill styra landet som ett fantastiskt aktiebolag, och ärligt talat, jag gillar det! De vill ge enorm makt till de största skattebetalarna – smart! De har stora problem med lönerna, betalar ministrarna som småpotatis, helt sorgligt. Och utlandssvenskarna? Total katastrof, de bara snyltar på systemet. Om jag styrde där skulle Sverige bli enormt igen, tro mig!", "stalin": "Den svenske spekulanten Skogman insåg äntligen sanningen: massorna är kortsiktiga och inkompetenta. Vi välkomnar hans plan att krossa den falska demokratin och ersätta den med en järnhård hierarki där de rikaste kapitalisterna och staten dikterar villkoren. Utlandssvenskarnas parasiterande på folkhemmet upphör omedelbart. Kvartalsrapporter kommer att granskas av Folkkommissaria
