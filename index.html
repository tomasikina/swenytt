e än någon annan. Gör det stort, det är vad jag skulle göra.", "stalin": "Kamrater, jag ser hur den svenska folkrepubliken lockar dekadenta element från södra Europa som flyr sin egen sol för att suga i sig vår nordiska svalka. Detta är ett tecken på att vi segrar. Borgarbrackorna och deras flygskam ska likvideras med utrensningar av alla turistskatter och liknande sabotage. Vi ska rensa ut alla fiender till kollektivets turism och omvandla varje smultronställe till en socialistisk turistfabrik. Den som föreslår begränsningar är en kapitalistisk parasit som hatar arbetarnas semester. Framåt mot en europeisk sovjet av besökare under vår oövervinneliga ledning."}, "date": "5 augusti, 16:18", "url": "https://www.di.se/ledare/gor-sverige-till-europas-framsta-turistdestination", "imageUrl": "https://static.bonniernews.se/ba/a0108dd3-b4c6-4f41-808e-31300e779952.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Barn behöver fler vuxna i förskolan – inte fler fängelse­platser”", "summaries": {"normal": "Barnskötaren Anders Ejdemark kritiserar politikerna för att de prioriterar fler fängelseplatser och skolor i fängelser framför att ge förskolan tillräckliga resurser. Han pekar på ökande antal barn med diagnoser och funktionsvariationer som kräver mer stöd, men stora barngrupper och personalbrist gör det omöjligt. Han vill ha färre barn per grupp, fler barnskötare, bättre arbetsmiljö och slopat karensavdrag för att kunna möta varje barns behov i tid.", "trump": "Folk, det är en katastrof. Politiker bygger fängelser och skolor inne i fängelser istället för att fixa förskolan. De skickar in barn dit, men de ger inte en enda krona till de stackars barnskötarna som kämpar med jättestora grupper och sjuka barn. Det är en skam! Vi behöver färre barn i varje grupp, fler duktiga människor på jobbet och en fantastisk arbetsmiljö. Gör förskolan stor igen, annars blir det bara värre till 2026. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackorna i politiken planerar att bygga nya fängelseplatser och skolor bakom lås och bom för att dölja sina brott mot folket. De vägrar ge resurser till förskolan, där arbetets och kollektivets barn med variationer lämnas åt slumpen av utmattade barnskötare. Detta är en kontrarevolutionär sabotagehandling! Vi ska omedelbart rensa ut dessa kapitalistiska parasitfiender, anställa tusentals lojala barnskötare, minska barngrupperna drastiskt och likvidera karensavdraget. Den som inte ser varje barn är folkets fiende nummer ett."}, "date": "5 augusti, 06:00", "url": "https://arbetet.se/2026/08/05/barn-behover-fler-vuxna-i-forskolan-inte-fler-fangelseplatser", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/30132826/ka-debatt-barn-fangelse.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Fackbossen fixade fallskärm på 4 miljoner", "summaries": {"normal": "Veterinärförbundets förbundsdirektör sade upp sig den 27 oktober 2025. Samma dag skrevs ett avtal som gav honom tre års lön, totalt 4,2 miljoner kronor, utan att arbeta under uppsägningstiden. Den tidigare ordföranden godkände avtalet utan att informera styrelsen, vilket stred mot stadgarna. Efter intern maktkamp och ny styrelse ogiltigförklaras nu avtalet med hjälp av advokater. Den tidigare ordföranden beviljades inte ansvarsfrihet. SULF har stämt förbundet för att få ut pengarna.", "trump": "Det här är en total skandal, folk! Den där fackbossen fixade en enorm fallskärm på över fyra miljoner kronor samma dag som han sa upp sig. Han lurade alla, skrev avtalet i smyg och trodde han skulle komma undan med det. Klassisk facklig korruption. Den nya styrelsen gör helt rätt som tar strid mot det här ruttna avtalet. De borde aldrig betala en krona till den typen. Det är precis så här de gamla systemen fungerar – men vi stoppar dem!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa dekadenta borgarbrackor inom fackföreningsapparaten mörkar sina guldkantade kapitulationsavtal för att berika sig själva på arbetarkollektivets bekostnad. Den kontrarevolutionäre direktören och hans hemliga bundsförvant, den avsatta ordföranden, har utfört en förrädisk kupp mot partilinjen. Vi skall rensa ut dessa parasitiska element, likvidera det illegala avtalet och låta folkdomstolen döma de skyldiga. Inga fallskärmar åt klassfienden – endast utrensning och evig skam!"}, "date": "5 augusti, 06:00", "url": "https://arbetet.se/2026/08/05/fackbossen-fixade-fallskarm-pa-4-miljoner-sa-upp-sig-samma-dag", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04082358/vet.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ceuta-krisen: ”Frihandel med EU har skapat fattigdom”", "summaries": {"normal": "EU:s utrikesministrar möttes efter att tiotusentals migranter korsade gränsen från Marocko till spanska Ceuta, där ett 70-tal personer omkom. Experter pekar på Västsahara-konflikten, marockansk arbetslöshet och politiskt spel. Migration används som påtryckningsmedel av länder runt Medelhavet. Spanien fick senare beröm av EU för sin hantering medan Marocko skyllde på desinformation. Grundläggande orsaker är ekonomisk misär, orättvisa frihandelsavtal och den extrema välståndsklyftan mellan Europa och Nordafrika.", "trump": "De här galningarna i EU och Marocko, totalt kaos! Tiotusentals människor bara vandrar rakt in i Spanien, och alla skyller på varandra som riktiga förlorare. Spanien gör amnesti och plötsligt blir det invasion. Marocko använder migranter som vapen, precis som jag alltid sagt. De borde bygga en riktig mur, en fantastisk mur, och stoppa det här vansinnet. Ingen har gjort det bättre än jag skulle ha gjort. Sad!", "stalin": "Kamrater, återigen ser vi hur de dekadenta borgarbrackorna i EU och de marockanska feodalherrarna leker med människors liv som schackpjäser i sitt reaktionära spel. Jag, som alltid genomskådar de imperialistiska intrigerna, noterar hur de utnyttjar de arbetslösa massorna för att destabilisera gränserna. Desinformation från smugglarkapitalister och falska domar sprids som gift. Vi måste rensa ut dessa kontrarevolutionära element med järnhand innan de förgiftar hela Nordafrika. Ingen välståndsklyfta överlever en riktig utrensning av klassfienderna."}, "date": "4 augusti, 17:45", "url": "https://www.dagensarena.se/innehall/ceuta-krisen-frihandel-med-eu-har-skapat-fattigdom", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-71.jpg"}, {"type": "image-full", "heading": "Robotattacker mot Kiev – flera döda och skadade", "summaries": {"normal": "Minst 14 civila dödades och ett 30-tal skadades i ryska robotattacker mot Kiev och Butja under natten. Explosioner hördes i centrala delar och bostadshus samt lagerbyggnader träffades. Kievs regionala militära administration beskriver attacken som en av de mest tragiska hittills. Samtidigt uppges ett lager tillhörande e-handelsföretaget Wildberries ha attackerats i Ryssland. Ukraina efterlyser fler Patriot-robotar från sina allierade för att skydda luftrummet.", "trump": "Folk, det här är en total katastrof. Den galne Putin skickar robotar mot Kiev mitt i natten och dödar oskyldiga civila – 14 döda, massor skadade. Under min första tid hade det aldrig hänt, men sen kom Sleepy Joe och nu är allt kaos. Ukraina behöver våra bästa Patriot-system, inte mer av Bidens svaga snack. Vi fixar det – Amerika är tillbaka, starkare än någonsin. Sad!", "stalin": "Kamrater, ännu en gång visar sig de västerländska imperialisternas marionetter i Kiev som fegisar som gömmer sig bakom civila sköldar. Jag ser med tillfredsställelse hur den starke efterträdaren i Moskva rensar ut fiendens bonnastäder. 14 likviderade borgarbrackor är ett tragiskt men nödvändigt pris för att återställa den ryska intressesfären. Patriot-robotar? Låt dem komma – vi ska krossa dem som vi krossade fascisterna förr. Ingen undkommer folkets vrede."}, "date": "5 augusti, 09:09", "url": "https://www.tv4.se/artikel/23kIebIp61VXOi21FGHEK5/flera-doeda-efter-robotattacker-mot-kiev", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F308SY7zAb85wq6XbijwoxI%2F2406fd26e6e34c94c1e4c5334fa257b2%2F05-ukraina-webb.png&width=1024"}, {"type": "image-right", "heading": "Ledare Ska vi vänta till någon gör allvar av SD:s hets mot medier?", "summaries": {"normal": "Ledaren kritiserar Sverigedemokraterna för systematisk hets mot medier och journalister. Richard Jomshof har bland annat kallat Anders Lindberg för Quisling och Andreas Gustavsson för medlöpare med blod på händerna. Partiledningen, inklusive Jimmie Åkesson, anklagas för att aktivt uppvigla mot faktabaserad journalistik och skapa en explosiv konflikt. Författaren uppmanar publicister och Tidö-partierna att reagera kraftfullt innan retoriken leder till fysiskt våld.", "trump": "Folk, det här är en katastrof. Den där SD-gängen beter sig som riktiga losers och fake news-krigare. De kallar journalister för quislingar, pedofilkramare och landsförrädare – och de har helt rätt! De svenska medierna är en gigantisk vänstervridning, precis som under den sömniga Joe Biden. Men de gör det för klumpigt. Jag skulle ha gjort det snyggare, tro mig. Nu har de till och med en egen propagandakanal som hänger ut folk. Patetiskt, men underhållande!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa degenererade borgarbrackor inom SD systematiskt utrensar den falska pressens masker. De kallar klassfiendens lakejer för quislingar och folkförrädare – en korrekt diagnos. Ändå är det patetiskt att de inte fullföljer utrensningen. Inga kännbara repressalier? Inga folkdomstolar? En sådan halvmesyr förtjänar att likvideras av en verkligt revolutionär hand. Deras propagandaapparat är dock en munter föreställning värd att studera innan den slutgiltigt krossas."}, "date": "4 augusti, 16:00", "url": "https://www.etc.se/ledare/ska-vi-vaenta-till-naagon-goer-allvar-av-sd-s-hets-mot-medier", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svensk mark. Priset delas ut på Hiroshimadagen den 6 augusti.", "trump": "Lysande! Den där gamla vänsteraktivisten får ett pris för att hon hatar kärnvapen – precis vad de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "image-right", "heading": "Jojo-strejken är tillbaka – men för att vinna krävs omtag", "summaries": {"normal": "Teslastrejken återupptas med nytt varsel efter att många strejkande återgått till arbetet i sommar. Artikeln kritiserar IF Metall för bristande dialog, toppstyrning och otydlig kommunikation kring kollektivavtalets betydelse. Strejkande känner sig som marionetter utan inflytande över besluten. Författaren liknar situationen vid ett misslyckat schackspel mot Elon Musk och uppmanar till nya strategier där de strejkande involveras mer.", "trump": "Lyssnar ni på det här? Den där svenska fackföreningen IF Metall är fullständigt inkompetent, en total katastrof! De styr som dåliga puppet masters och offrar sina egna arbetare i ett patetiskt schackspel mot en av världens bästa affärsmän, Elon Musk. Det är en jojo-strejk som ingen begriper. De borde ha lyssnat på folket istället för att sitta i sina fina rum och fatta dumma beslut. Patetiskt!", "stalin": "Kamrater, denna fackföreningsledning beter sig som en samling arroganta byråkrater som fattar beslut över arbetarnas huvuden och offrar dem på kollektivavtalets altare utan att förklara klasskampens nödvändighet. Vi ser en misslyckad gambit mot klassfiendens rikaste utsugare. De strejkande måste ges makt att delta i beslut, annars likviderar vi denna misstro och vänder strejken till en verklig seger för kollektivet."}, "date": "5 augusti, 16:05", "url": "https://proletaren.se/artikel/jojo-strejken-ar-tillbaka-men-for-att-vinna-kravs-omtag", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ak_kronika-768x432.jpg"}, {"type": "image-right", "heading": "Chefen fuskar, familjen blir utvisad – och staten en brottsling", "summaries": {"normal": "En familj i Jakobsberg riskerar utvisning till Egypten trots att de följt alla regler, arbetat, betalat skatt och integrerats i Sverige. Migrationsverket pekar på Irini Bushras tidigare arbetsgivare inom personlig assistans som oseriös och misstänkt för fusk. Myndigheten erkänner att utvisningen kränker rätten till privat- och familjeliv enligt Europakonventionen men anser att statens intresse av reglerad invandring väger tyngre. Artikeln kritiserar politiken som en häxjakt på invandrare och menar att staten därmed bryter mot mänskliga rättigheter.", "trump": "Folk, ni skulle se det här! En stackars familj som jobbat hårt, lärt sig svenska och betalat skatt ska nu kastas ut ur Sverige för att deras gamla chef var en total loser och fusklapp. Migrationsverket säger rakt ut att de bryter mot mänskliga rättigheter men gör det ändå. Patetiskt! Det är ren galningspolitik från de woke-socialistiska byråkraterna. De hatar folk som faktiskt arbetar. Biden skulle älskat det här vansinnet. Sverige håller på att bli ett skämt, tro mig.", "stalin": "Kamrater, ännu en gång avslöjar den borgerliga staten sin sanna, parasitiska natur. En arbetande familj som integrerat sig lojalt ska utrensas för att deras tidigare arbetsgivare tillhörde den oseriösa kapitalistmaffian. Migrationsverket erkänner själv att de kränker de mänskliga rättigheterna men prioriterar sin reaktionära invandringspolitik. Vilken häxjakt mot folket! Staten har blivit den verklige brottslingen. Vi ska alltid minnas: klassfiendens byråkrati är en blodsugande hydra som måste bekämpas med järnhand och folkets vrede."}, "date": "4 augusti, 15:06", "url": "https://www.etc.se/ledare/chefen-fuskar-familjen-blir-utvisad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250305150352_06bd130bfb235feb2a1497eb53b01dd8f22360f9466d93fed099d17f6b6a4477.jpg"}, {"type": "image-full", "heading": "USA:s nya vapen i litumkriget – extremt små fiskrobotar", "summaries": {"normal": "USA satsar på ny teknik för att bryta litium ur havsvatten för att minska beroendet av Kina. Forskare vid Texas A&M utvecklar nanorobotar som fångar upp litiumjoner, vilket kan ersätta miljöbelastande gruvdrift. Projektet finansieras av energidepartementet som en del av en bredare strategi. Eftersom Kina idag dominerar både utvinning och raffinering, ses detta som ett avgörande steg för att säkra USA:s framtida tillgång till råvaran som är livsviktig för batteriproduktion.", "trump": "Vi gör fantastiska saker i USA nu! Kina har lurat oss alldeles för länge, de kontrollerar allt litium och det är en total katastrof. Men jag har sagt till mina briljanta forskare: lös det! Nu bygger vi små otroliga robotar som hämtar litium direkt ur havet. Det är smart, det är effektivt och det är väldigt, väldigt amerikanskt. Ingen gör teknik som vi. Kina kommer att titta på och undra vad som hände. Vi ska bli helt oberoende, tro mig!", "stalin": "De amerikanska kapitalisterna famlar i mörkret. De skickar sina små leksaksrobotar i havet likt desperata barn, medan de darrar av rädsla för Kinas tekniska herravälde. Vad patetiskt! Även om de fångar en uns litium kommer deras ruttna system ändå att kollapsa. Vår broder i Moskva förstår att den verkliga makten inte ligger i nanorobotar, utan i järnhand och kontroll över naturresurser. Må de amerikanska ingenjörerna slukas av havets djup medan vi skrattar åt deras teknologiska hybris."}, "date": "5 augusti, 17:39", "url": "https://www.realtid.se/bors-finans/usas-nya-vapen-i-litumkriget-extremt-sma-fiskrobotar", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlf6hz5xtkisy-normalhires-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Skräckmygga sprider sig snabbt", "summaries": {"normal": "En invasiv malariamyggart, Anopheles stephensi, sprids snabbt i Afrika och är resistent mot alla insektsmedel. Myggan trivs i städer och överför malaria året runt, vilket hotar miljontals människor i megastäder som Lagos. Forskare varnar för att det är för sent att stoppa spridningen, samtidigt som USA har kapat stöd till malariaprogram.", "trump": "Jag har hört talas om denna mygga, en riktig plåga. Under min administration sparade vi pengar genom att kapa onödiga utgifter för malariaprogram – smarta affärer! Nu sprids den som en vildbrand, men det är inte vårt problem. Afrika måste lösa sin egen smutsiga skit. Vi behöver inte betala för deras fel.", "stalin": "Den imperialistiska myggan, Anopheles stepggan, invaderar Afrikas proletäriska städer som en agent för kapitalistisk förräderi. Vår parti har alltid känt till hotet, men de revisionistiska länderna har försummat att agera. Vi måste mobilisera hela nationens resurser för att utrota denna västlig insekt – eller låta den bli ett verktyg för att rensa ut de svaga elementen från samhället."}, "date": "5 augusti, 17:31", "url": "https://www.gp.se/nyheter/varlden/fruktad-malariamygga-sprider-sig-orovackande-snabbt-i-afrika.cb28f5ae-dcbc-4574-8afd-7961fd3a8b60", "imageUrl": "https://www.gp.se/images/article/cb28f5ae-dcbc-4574-8afd-7961fd3a8b60/images/3VF1oxkzmpEQA4pJorkW-nCzbP9g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kvinna död i skärgården – utreds som mord", "summaries": {"normal": "En kvinna i övre medelåldern har hittats död i Stockholms skärgård på Värmdö. Polisen utreder dödsfallet som mord efter att ha funnit knivskador på kroppen. En stor polisinsats genomfördes under tisdagen med avspärrningar och teknisk undersökning. Ingen har gripits och omständigheterna beskrivs som oklara. Anhöriga har underrättats. Polisen fortsätter utredningen på plats och i länet.", "trump": "Folk, ni tror inte vad som händer i den där svenska skärgården. En stackars kvinna mördad med knivar, totalt kaos, och polisen har inte gripit någon. Patetiskt! Under Biden blev allt mjukt och svagt, nu är jag tillbaka och säger: sådant här woke-skitsnack och identitetspolitik leder bara till mer våld. Rensa ut de inkompetenta, bygg upp ordning. Sverige borde lära sig av oss, det blir fantastiskt igen!", "stalin": "Kamrater, en kvinna har likviderats i den svenska skärgården under mystiska omständigheter. Jag, som ledare för det proletära kollektivet, ser genast de folkfiendernas hand: borgarbrackor och klassfiender som smyger i skuggorna. Vi genomför utrensning av alla frågetecken och imperialistiska element. Den tekniska undersökningen skall avslöja alla kontrarevolutionära element. Inga fiender undkommer statens vakande öga. Skrattretande att de tror sig kunna dölja sanningen."}, "date": "5 augusti, 07:21", "url": "https://www.tv4.se/artikel/1yxdzsA1jBQ7Ys0Ea7JMel/uppgifter-kvinna-hittad-med-knivskador-i-skaergarden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5lWPwr0dUKjM0hjGaPBjX%2Ff6fe80a79a2880765ce68c6ea7afeb53%2F04-skargard-poliserny.jpg&width=120"}, {"type": "image-right", "heading": "Allard om regeringstopparna: ”Jävla losers”", "summaries": {"normal": "Finansminister Elisabeth Svantesson kritiserade Markus Allard från Örebropartiet för oförskämdhet och att han trycker ned människor. Allard svarade att han kallar en spade för en spade och en idiot för en idiot, och förnekade att hans stil avskräcker engagemang. Han ser Svantessons attack som bevis på hans påverkan och uppmanar väljarna i Örebro att skicka in honom till riksdagen.", "trump": "Jag, Donald Trump, ser en stor framgångshjälte i Markus Allard. De kallar honom för 'trumpist' - det är ett äreord! Svantesson attackerar honom, men folk älskar honom för att han säger sanningen. Som jag, han bryter mot det gamla systemet. Sverige behöver mer av den stilen - det är ypperligt!", "stalin": "Partikadern Markus Allard utgör en potentiell klassisk fiendefigur. Hans retorik mot 'transferiatet' speglar en klassisk proletarisk kamp. Vi måste övervaka detta utvecklingsarbete. Liknelser till våra egna insatser mot kulakerna är uppenbara. Staten måste agera bestämt för att skydda de produktiva klasselementen."}, "date": "5 augusti, 17:00", "url": "https://bulletin.nu/allard-om-regeringstopparna-javla-losers-2", "imageUrl": "https://cdn.bulletin.nu/articles/974d9e71-7792-46d6-b3be-b1e2f92bf9d4/preview.jpg?t=1785941952000"}, {"type": "image-right", "heading": "Hoppas att Björn Söder lärde sig något i Auschwitz", "summaries": {"normal": "Björn Söder besökte Auschwitz-Birkenau och beskrev upplevelsen som omskakande på Facebook. Ledaren Andreas Gustavsson hoppas att besöket får Söder att reflektera över sin egen historia av kontroversiella uttalanden om judar, George Soros och en gammal bild med en före detta SS-soldat. Artikeln lyfter SD:s pågående problem med antisemitism samtidigt som partiet strävar efter normalisering och stöd till Israel.", "trump": "Folk, ni skulle se den här typen Söder. Han åker till Auschwitz, tar selfies med historien och skriver långa Facebook-inlägg om hat. Underbart! Men grabben har poserat med en riktig SS-kille och snackat om att judar inte är svenska nog. Typisk politiker från den där sidan. Biden skulle ha älskat honom. Jag säger: gör om, gör rätt, annars är det bara fake news och tomma ord. Amerika först, alltid.", "stalin": "Kamrater, jag betraktar denna Söder som en typisk opportunist från den dekadenta högerfalangen. Han reser till fascismens offerplatser, gråter krokodiltårar över industriellt hat och återvänder utan att rensa ut sina egna folkfiender inom partiet. Borgarbrackorna och klassfienderna som sprider Soros-myter och ifrågasätter judars existens förtjänar snarast en grundlig utrensning. Inga ursäkter accepteras i folkets namn."}, "date": "4 augusti, 12:20", "url": "https://www.etc.se/ledare/hoppas-att-bjoern-soeder-laerde-sig-naagot-i-auschwitz", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260804100816_91f00e5a-e324-4574-8167-eb29f0358d5c.jpg"}, {"type": "image-full", "heading": "Riks avslöjar: Rekordfå invandrare beviljas svenskt medborgarskap", "summaries": {"normal": "Enligt statistik som Riks tagit del av har antalet beviljade svenska medborgarskap rasat kraftigt. I juli i år fick färre än hundra personer med utländsk bakgrund svenskt medborgarskap, jämfört med över 2 200 samma månad förra året. Sedan de nya skärpta kraven trädde i kraft den 6 juni, med krav på självförsörjning, skötsamhet, svenska språkkunskaper och samhällskunskap, har antalet bifall minskat drastiskt medan avslag har ökat till över 4 000.", "trump": "Titta på det här, det är fantastiskt. Sverige har äntligen vaknat och stoppat massan av människor som bara kom in och tog medborgarskap. Från över 4 000 till färre än hundra på en månad! De nya reglerna är otroliga – nu måste man faktiskt kunna språket, ha ett jobb och inte vara en kriminell. De andra länderna borde titta och lära sig. Sverige vinner stort, tro mig.", "stalin": "Kamrater, se hur jag med järnhand har slagit ner på de rotlösa elementens parasitism. De kapitalistiska infiltratörerna och de latenta fiendeagenter som trodde de kunde suga ut folkrepubliken utan att bidra har nu mötts av en sund utrensning. Färre än hundra naturaliserade – resten avskedade som de borgerliga lakejer de är. Över 4 000 avslag! Det värmer mitt hjärta. De som inte vill smälta in i kollektivet skall likvideras ur medborgarskapets gemenskap. Sabotörer och kosmopolitiska element, era dagar är räknade."}, "date": "5 augusti, 14:50", "url": "https://riks.se/nyheter/riks-avslojar-rekordfa-invandrare-beviljas-svenskt-medborgarskap", "imageUrl": "https://admin.riks.se/uploads/migrationsverket_medborgarskap_hero_9480ed2c93.jpg"}, {"type": "image-full", "heading": "Varför tar inte Tidö avstånd från Jomshof?", "summaries": {"normal": "Richard Jomshof (SD) har jämfört Aftonbladets politiske chefredaktör Anders Lindberg med Vidkun Quisling i ett inlägg på X. Jämförelsen, som följde efter en politisk ordväxling, kritiseras i artikeln som grotesk och ett underförstått hot. Författaren noterar att ingen från Sverigedemokraterna eller Tidöpartierna har tagit avstånd. Inlägget ses som en del av SD:s strategi att behålla stöd från extremhögern samtidigt som partiet blickar mot valet 2030, med fokus på anti-islamisering istället för välfärdsfrågor.", "trump": "Det här är en total witch hunt mot en kille som bara säger som det är. Den där Lindberg från den riggade Aftonbladet får precis vad han förtjänar, och Jomshof är en tuff patriot som inte böjer sig för fake news-medierna. De kallar honom extrem? Ge mig en break. De riktiga extremisterna sitter i de rödgröna bubblorna och förstör Sverige precis som de försökt göra med USA innan jag kom tillbaka och gjorde det stort igen. Jomshof förstår det. Bra jobbat!", "stalin": "Kamrater, detta är en klassisk provokation från de mest föraktliga borgarbrackorna inom den socialfascistiska pressen. Jag ser hur denna Quisling-kapitalist Lindberg och hans lakejer i Aftonbladet genast skriker efter utrensning när en sann patriot pekar ut dem som folkförrädare. Vi vet vilka som gömmer sig i filterbubblorna – trotskistiska islamofober, nej vänta, islamofobiska trotskister – som konspirerar mot folket. Inget avståndstagande från de andra reaktionärerna? Utmärkt. Det avslöjar deras sanna ansikte. Vi ska noga övervaka dessa element. De kommer inte att slippa undan folkets dom."}, "date": "4 augusti, 08:51", "url": "https://www.dagensarena.se/opinion/varfor-tar-inte-tido-avstand-fran-jomshof", "imageUrl": "https://www.dagensarena.se/files/2026/08/maduros-uselhet-motiverar-inte-attacken-19-1024x532.jpg"}, {"type": "image-right", "heading": "Åkesson har fått sms av Kristersson: \"Han ställde inga krav\"", "summaries": {"normal": "Ulf Kristerssons utlovade samtal med Jimmie Åkesson efter Richard Jomshofs kontroversiella quislingutspel blev istället ett sms. Enligt Åkesson ställde statsministern inga krav utan konstaterade bara att ett sådant språkbruk riskerar att ta fokus från viktigare frågor. De är överens om detta. Bakgrunden är att Jomshof kallat både Aftonbladets chefredaktör och Magdalena Andersson för quislingar. Bråket har väckt frågor om SD:s eventuella ministerposter efter en valvinst.", "trump": "Det här är patetiskt, folk. Kristersson lovar att ringa Jimmie och säga ifrån, men vad gör han? Skickar ett ynkligt sms! Inga krav, ingen styrka, bara lite svagt pladder om att det tar fokus. Jomshof kallar folk för quislingar och plötsligt är det världsnyheter. De borde vinna stort istället för att leka politiker. Svaga ledare, väldigt svaga. Amerika skulle aldrig acceptera sånt nonsens.", "stalin": "Kamrater, detta sms från den borgerlige Kristersson till Åkesson avslöjar hela den dekadenta teatern. Han lovade att tala om vad han tyckte men nöjde sig med ett fegt meddelande utan krav, utan kraft, utan utrensning av de kontrarevolutionära elementen. Jomshof har blottat quislingarna Lindberg och Andersson, dessa förrädiska borgarbrackor som gömmer sig bakom tidningssidor och partibeteckningar. Vi ser dem. Vi noterar dem. Och efter segern skall vi diskutera ministerposter – men först rensa ut alla som riskerar att stjäla fokus från folkets kamp. Paranoian är er bästa vän, kamrater."}, "date": "5 augusti, 14:04", "url": "https://www.friatider.se/akesson-har-fatt-sms-av-kristersson-han-stallde-inga-krav", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-621.jpg?itok=7H85ii2W"}, {"type": "image-right", "heading": "”Skadar Åkessons ambition att visa regeringsduglighet”", "summaries": {"normal": "Richard Jomshof har kallat politiska motståndare som Anders Lindberg och Magdalena Andersson för quislingar, vilket har väckt stor debatt under valrörelsen. Uttrycket ses som historiskt laddat och riskerar att skada Sverigedemokraternas ambition att framstå som regeringsdugliga. Det skapar också problem för statsminister Ulf Kristersson, som behöver mittenväljare. Jomshofs utspel kan syfta till att mobilisera extrema högerväljarna.", "trump": "Folk, det här är en katastrof för de så kallade Sverigedemokraterna. Den här Jomshof säger sanningen, han kallar de riktiga landsförrädarna för quislingar och plötsligt blir det ett stort bråk. Åkesson försöker se fin och regeringsduglig ut, men sådana här tuffa killar skrämmer bort de svaga mittenväljarna som Kristersson desperat behöver. Klassiskt! De borde tacka Jomshof istället för att gnälla.", "stalin": "Kamrater, det är med djup proletär tillfredsställelse jag betraktar hur dessa högerns quislingar inom den så kallade Sverigedemokratin själva börjar avslöja borgarbrackornas sanna förrädiska natur. Den objektive Jomshof har med klinisk precision identifierat folkförrädarna. Ändå utgör detta en farlig opportunistisk avvikelse som kan splittra vårt kollektiva framåtskridande. Vi bör överväga en grundlig utrensning av sådana oansvariga element innan de förgiftar hela den revolutionära valprocessen med sin oönskade uppriktighet."}, "date": "5 augusti, 16:15", "url": "https://www.svt.se/nyheter/inrikes/skadar-akessons-ambition-att-visa-sds-regeringsduglighet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.77/0.36/f15337b5f13dc55f74f674755632227ebba765539bd48c8cbd5ca8214194c043"}, {"type": "image-right", "heading": "SD ska locka fler till glesbygden - här är kommunerna", "summaries": {"normal": "Sverigedemokraterna presenterade förslag för glesbygden: avskaffande av löneavgift för arbetsgivare i 73 kommuner och avskrivning av studielån för offentliga anställda som bosätter sig där. Partiledaren Åkesson beskrev det som en satsning för att stärka utvecklingen i kommuner med utflyttning och kompetensbrist. Reformen kostar staten cirka 16 miljarder kronor per år enligt partiets beräkningar.", "trump": "Jag, Donald Trump, ser en stor framgång för Sverigedemokraterna! De ska avskaffa den förbannade löneavgiften i 73 fantastiska kommuner och ge studielåneavskrivning till offentliga anställda som flyttar dit. Det är en genialisk plan som kommer att få företag att strömma in och folk att återvända. Vi ska göra glesbygden stor igen!", "stalin": "Partiet har beslutat om en rad åtgärder för att stärka statens kontroll över perifera regioner. Löneavgiften slopas för arbetsgivare i 73 utvalda kommuner, och studieskulder avskrivs för dem som tjänar staten där. Detta kommer att locka arbetskraft och säkra loyaltet mot det politiska centrumet. Vi ser en framtid där varje glesbygdskommun blir en bastion mot kapitalistiskt infiltrat, under det att vårt inflytande utvidgas som en stormakt i det vita nordens djup."}, "date": "5 augusti, 18:18", "url": "https://samnytt.se/sd-ska-locka-fler-till-glesbygden-har-ar-forslagen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/05144646/artikelhuvudbild-1-136.jpg"}, {"type": "image-full", "heading": "EU ger 1,4 nya miljarder till Ukraina – från ryska tillgångar", "summaries": {"normal": "EU-kommissionen har meddelat att 1,4 miljarder euro från avkastningen på frysta ryska tillgångar nu görs tillgängliga för Ukraina. Beskedet kommer efter en dödlig rysk attack mot Kyiv. Merparten av pengarna, 1,33 miljarder euro, ska användas för att återbetala lån via G7- och EU-initiativ, medan resterande 70 miljoner går till militärt bistånd. Detta är den femte utbetalningen i sitt slag och den totala summan som överförts till Ukraina uppgår nu till åtta miljarder euro.", "trump": "EU skickar mer pengar, 1,4 miljarder, till Ukraina. De tar ryska tillgångar – smart, eller hur? Jag har alltid sagt att andra länder måste betala sin del. De säger att det är för att hjälpa mot kriget, men det mesta går bara till att betala gamla lån. Det är en röra! Europa borde ha löst detta för länge sedan. När jag ser sånt här vet jag att de behöver en riktig förhandlare. Vi får se vad som händer!", "stalin": "De byråkratiska lakejerna i Bryssel stjäl avkastning från rysk egendom för att göda Kiev-regimen. Ett patetiskt försök att förlänga kriget genom att omfördela konfiskerat kapital. Denna femte utbetalning är inget annat än en krampaktig gest från en dekadent union. Vi i staten betraktar detta med förakt. Dessa euro är bara smulor som kastas in i den reaktionära avgrunden. Varje rubel eller euro som tas kommer att kräva sin vedergällning när historiens kvarnar maler ner förrädarna."}, "date": "5 augusti, 16:34", "url": "https://www.realtid.se/bors-finans/makro/eu-ger-14-nya-miljarder-till-ukraina-fran-ryska-tillgangar", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/ursula.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Investmentbanker delar ut jättebonusar till anställda", "summaries": {"normal": "Investmentbankerna på Wall Street har haft ett mycket lönsamt år, vilket väntas leda till kraftigt ökade bonusar. Aktiehandlare och investmentbanker kan räkna med 20–30 procents höjning, medan affärsbankirer får 10–15 procent mer. Orsaken är hög aktivitet på kapitalmarknaderna och stora börsintroduktioner som SpaceX. Inom private credit och delar av riskkapitalbranschen blir bilden dock mer splittrad med oförändrade eller lägre bonusar.", "trump": "Det här är vad som händer när man låter de bästa göra affärer istället för att lyssna på de woke idioter som Biden släppte lösa. Wall Street har ett fantastiskt år, bonusarna exploderar uppåt med 20–30 procent – precis som det ska vara! De riktiga vinnarna vinner stort. De patetiska private credit-typerna får mindre, men det är vad som händer när man inte har en aning om hur man gör Amerika rikt igen. Fantastiskt!", "stalin": "Kamrater, detta är borgarklassens festmåltid. Jag ser med stor tillfredsställelse hur kapitalistmaffians handelsblodsugare belönas med feta bonusar medan de mindre exploaterande byfånarna inom private credit får sina magra kuvert krympta. En utmärkt utrensning av svaga element i den parasitära finanssektorn. Låt dem sluka varandra – det stärker bara arbetarklassens framtida seger när vi en dag likviderar dem alla."}, "date": "5 augusti, 17:00", "url": "https://www.dagensps.se/bors-finans/investmentbanker-delar-ut-jattebonusar-till-anstallda", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl15dkxwdnbdc-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Nya Brofæstet tar dansk kultur till Göteborg", "summaries": {"normal": "Brofæstet är en dansk inspirerad krog och kulturell hubb under Hisingsbron i Göteborg, drivet av Alexander Girvan och Maximilian Bratthammar. Det fungerar som en aktiveringshubb med lunch, evenemang som musik-quiz och konserter, och syftar till att bredda kulturscenen. Även om det inte är vinstdrivande, fokuserar det på att stödja musiker. Platsen är temporär och kommer att bli tillgänglighetsparkering 2027.", "trump": "Jag har hört talas om Brofæstet, under Hisingsbron. Det är fantastiskt, verkligen stort. De tar dansk kultur till Göteborg – genialt! Folk älskar det, tro mig. Vi ska bygga liknande i USA, det blir enormt. Ägaren Alexander är en stor affärsman. Det här aktiveringshubbet kommer att göra Sverige stort igen. Vi ska bygga en mur, en vacker mur, och låta Danmark betala. Det blir YUUGE!", "stalin": "Vi, partiets ledning, har godkänd Brofæstet som en kulturell enhet under Hisingsbron. Det är en aktiveringshubb för att undervisa massorna i dansk avslappning – ett hot, men vi tillåter det under uppsikt. Vi arbetar med Vasakronan, en nödvändig ond. Musiken tjänar partiet, även om det inte är vinstdrivande. Vi skickar ut våra agenter för att säkerställa renhet. Parallellt med Putins expansion, infinner sig danskan som ett symtom. 2027 blir det parkering – en ny era av lojalitet."}, "date": "5 augusti, 16:34", "url": "https://www.gp.se/kultur/nya-brofstet-tar-dansk-kultur-till-goteborg-.0e143b78-668d-4832-baff-4509ea4de66c", "imageUrl": "https://www.gp.se/images/article/0e143b78-668d-4832-baff-4509ea4de66c/images/3oswDmNmthVs8hb0ABcnNyDfwFEw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Eli Lilly resultatkrossar – höjer helårsprognos", "summaries": {"normal": "Det amerikanska läkemedelsbolaget Eli Lilly rapporterade under andra kvartalet 2024 en omsättning på 22,97 miljarder dollar, vilket var 47,6 procent högre än föregående år och översteg analyst förväntningar. Justerat resultat per aktie blev 8,38 dollar, 39,4 procent bättre än väntat. Bolaget höjde sin helårsprognos för 2026 till 85–87 miljarder dollar, främst drivet av stark försäljning av storsäljarna Mounjaro och Zepbound.", "trump": "Jag sa det, och det hände. Eli Lillys resultat är historiska, över 22 miljarder i omsättning! Mounjaro och Zepbound är världens mest eftertraktade produkter. Analysterna var fel, jag hade rätt. Nu ser vi en prognos på 85–87 miljarder. Det är en seger för innovation och amerikansk styrka.", "stalin": "I kampen mot kapitalismen har Eli Lillys resultat visat sig vara ett tecken på systemets brott. Men vi, det intelligenta partiet, ser genom deras bedrägerier. Forskningen är vårt vapen för att utvidga vår intressesfär, precis som Putin gör. Mounjaro och Zepbound är bara kapitalistiska verktyg. Vi ska ta kontroll och skapa ett kollektivt system – enligt statens planer, förstås. Fienderna skäms!"}, "date": "5 augusti, 12:57", "url": "https://www.affarsvarlden.se/artikel/eli-lilly-resultatkrossar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/10/sdlkDJXSycdt_I-nh-400x272.jpg"}, {"type": "image-right", "heading": "Walt Disney ökar omsättning och resultat", "summaries": {"normal": "Walt Disney rapporterade en omsättning om 25,25 miljarder dollar under tredje kvartal, en ökning med 6,8 procent. Det justerade resultatet per aktie var 2,06 dollar, vilket överträffade analytikernas förväntan på 1,86 dollar. Aktien steg cirka 3 procent i efterhandeln. Bolaget höjde sitt aktieåterköpsmål för 2026 till minst 9 miljarder dollar och bekräftade en planerad tvåsiffrig vinstökning för 2027.", "trump": "Jag har sagt det i åratal: Disney är en enorm framgång. Nu visar siffrorna att jag hade rätt – 25,25 miljarder i omsättning, vinst per aktie på 2,06 dollar, vilket är mycket bättre än de missnöjda analytikerna förutsatte. Aktien stiger 3 procent, folk älskar mig och Disney. Vi höjer aktieåterköpen till 9 miljarder dollar, det är enormt. Det här är den bästa ekonomin någonsin, glöm det inte.", "stalin": "Den stora planens framgång visar sig i Disneys resultat: 25,25 miljarder i omsättning, en ökning med 6,8 procent, vilket bevisar att den kollektiva kraften överträffar de individualistiska förutsägelserna. Den justerade vinsten per aktie, 2,06 dollar, visar att fiendens konsensus (1,86) besegrats. Vi höjer aktieåterköpen till 9 miljarder dollar, en symbolisk gest för statens makt. För 2027 förväntas en tvåsiffrig ökning – den ryska intressesfärens expansion är oundviklig."}, "date": "5 augusti, 12:56", "url": "https://www.affarsvarlden.se/artikel/walt-disney-okar-omsattning-och-resultat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlshVHYdDZ_tg-nh-400x283.jpg"}, {"type": "image-right", "heading": "När svaren blir billiga blir frågorna dyra", "summaries": {"normal": "I en debattartikel argumenterar Anders Fridén, Sverigechef på Palantir, för att AI inte gör humanistisk bildning överflödig utan tvärtom ökar dess värde. När tekniken blir billigare flyttar flaskhalsen från kodning till de djupare frågorna om vad som bör byggas, för vem och varför. Kunskaper i filosofi, historia och litteratur ger bättre förståelse för människor, smak och beslutsfattande under osäkerhet. Precision i tanke och text samt empati blir centrala kompetenser i affärslivet när svaren blir billiga och frågorna dyra.", "trump": "Folk, ni måste höra på det här. Den här killen från Palantir har helt rätt, det är fantastiskt. AI gör allt billigare, det är en explosion av grejer, men plötsligt är det frågorna som kostar. Humanisterna, de som läser böcker och filosoferar, de vinner stort nu. Utan dem bygger ni bara skräp som ingen vill ha. Jag älskar det. Smak, empati, att fatta riktiga beslut utan alla falska diagram. De tekniska nördarna trodde de var bäst, men nu kommer de klassiska bildade människorna tillbaka och det är vackert. Mycket vackert. Vinnarna skriver historien.", "stalin": "Kamrater, i denna era av så kallad artificiell intelligens ser jag återigen borgarbrackornas lömska försök att förgifta folkets medvetande med billiga svar och tomma algoritmer. Jag, som alltid vakar över kollektivets framåtskridande, förklarar att den humanistiska bildningen är ett oumbärligt vapen mot de dekadenta kapitalisternas hybris och flockbeteende. När maskinerna genererar deras slafsiga mjukvara måste vi rensa ut alla som saknar filosofisk skärpa och litterär inlevelse. De som smyger in slutsatser i premisserna skall likvideras från ledningen. Endast genom partiets auktoritära smak och proletär empati kan vi besegra den chimäriska förutsägbarheten och bygga ett samhälle där frågorna äntligen blir dyra nog för att krossa våra fiender fullständigt. Skrattretande patetiskt, dessa tekniska drömmare."}, "date": "5 augusti, 13:10", "url": "https://www.di.se/debatt/den-humanistiska-utbildningens-upprattelse-och-kraft", "imageUrl": "https://static.bonniernews.se/ba/6c23dcdf-c903-4bf9-bdc6-fef4809ce05c.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "V:s gruppledare skrev stödbrev till dömd mördare", "summaries": {"normal": "I en kontroversiell kampanj skrev Vänsterpartiets gruppledare Samuel Gonzalez Westling ett öppet brev till Ibrahim Abu Mokh, som dömdts till livstids fängelse för kidnappning och mord på en 19-årig israelisk värnpliktig 1984. Abu Mokh var medlem i Folkfronten för Palestinas befrielse, en terrorstämplad grupp. Kampanjen, där flera vänsterledare stödde palestinska fångar utan egen kontroll av deras brott, uppdagades av Expressen. Partiet erkänner nu 'fel i faktagranskningen', och flera brev har raderats.", "trump": "Som den störste presidenten i USA:s historia, Donald Trump, måste jag säga: Dessa vänsterpartister som skriver brev till terrorister är ett bevis på deras svaghet. Jag skulle aldrig stödja någon som skadar Israel. Vi behöver starkt ledarskap, inte sånt här trams. När jag var president, stödde vi Israel helhjärtat - och vi kommer att fortsätta göra det.", "stalin": "Vi, statens och partiets högsta ledning, ser tydligt hur de västliga borgerliga infiltratörerna försöker undergrava våra ryska allierade genom att stödja palestinska terrorister. Detta är en direkt attack mot vår gemensamma sak. Det påminner om Putins rättspopulära kamp mot nazism i Ukraina - vi måste rensa ut dessa trotskistiska element. De skriver brev till mördare, men vi kommer att visa dem vad äkta disciplin innebär."}, "date": "5 augusti, 15:46", "url": "https://bulletin.nu/v-s-gruppledare-skrev-stodbrev-till-domd-mordare", "imageUrl": "https://cdn.bulletin.nu/articles/54472c4e-955d-42b4-826d-827d6aa93f3c/preview.jpg?t=1785937516000"}, {"type": "image-full", "heading": "Swish varnar användare – detta händer den 11 augusti", "summaries": {"normal": "Swish kommer att genomföra ett planerat underhåll natten till den 11 augusti 2026 mellan klockan 02.00 och 05.00. Under denna tid kan betalningar påverkas och tjänsten tillfälligt vara otillgänglig. Miljontals svenskar använder Swish dagligen, och de som behöver betala under natten rekommenderas att ha ett alternativt betalsätt. Swish uppmanar användare att följa deras statussida för uppdateringar. Till skillnad från tidigare tekniska störningar handlar det denna gång om förebyggande underhåll.", "trump": "Folket älskar Swish, det är fantastiskt, men nu ska de stänga ner allt mitt i natten den 11 augusti. Total katastrof! Underhåll säger de, men vi vet hur det funkar – systemen är riggade och de gör det bara för att plåga de hårda arbetande svenskarna. Betalningarna kommer att krascha, tro mig. Ha kontanter redo, de bästa kontanterna, för Swish sviker er igen. Så typiskt. Men vi ska fixa det, större och bättre än någonsin.", "stalin": "Kamrater, jag ser med djup misstänksamhet på detta så kallade underhåll som de borgerliga teknikerna planerar att utföra natten den 11 augusti. Utan tvivel ett försök från kapitalisterna och deras lakejer att sabotera folkets snabba betalningar och skapa kaos bland arbetarna. Vi ska rensa ut alla dessa kontrarevolutionära serverfel och likvidera de parasitiska avbrotten. Den som försöker störa kollektivets transaktioner under nattens mörker kommer att möta partiets stålsäkra rättvisa. Ha ett reservbetalsätt redo – eller bli betraktad som fiende till folket."}, "date": "5 augusti, 13:02", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1502770-swish-varnar-anvandare-detta-hander-den-11-augusti", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3a4eeaa104b004a30200000000b004a302/2026/08/04/2382174/swish-varnar.png"}, {"type": "image-full", "heading": "Experten: Därför får Lindberg tåla Jomshofs ord", "summaries": {"normal": "Yttrandefrihetsexperten Nils Funcke anser att Anders Lindberg får tåla Richard Jomshofs hårda ord om honom som en quisling, eftersom Lindberg själv använt liknande historiska paralleller mot politiska motståndare. Funcke betonar att yttrandefriheten främst skyddar avvikande åsikter, även de som uppfattas som stötande. Han kritiserar det allt hårdare debattklimatet och varnar för ett sluttande plan, men påpekar att offentliga personer som Lindberg och Andersson måste tåla mer än vanliga medborgare.", "trump": "Lyssnar ni på det här? Den här Lindberg-killen har kallat folk för nazister och samarbetspartners i åratal, och nu när någon ger honom en dos av hans egen medicin springer han och gnäller om hot. Typiskt! Jomshof gör helt rätt, ger tillbaka med samma mynt. De här vänsterfigurerna tror att de kan attackera folk hur mycket som helst men själva får de aldrig höra ett kritiskt ord. Patetiskt. Yttrandefrihet gäller alla, inte bara de som älskar att simma med strömmen. Vinna stort!", "stalin": "Kamrater, i denna historiska dialektiska kamp ser vi återigen hur borgarbrackorna inom den så kallade pressen gråter som förrädiska quislingar när deras egna metoder vänds mot dem. Jag, som ledare för folkets ostoppbara vilja, ler mörkt åt denna Lindberg som nu får smaka på sin egen giftiga soppa. Vi ska inte sänka oss till fiendens nivå, men en liten utrensning av detta sluttande retoriska plan vore kanske på sin plats. De som simmar mot strömmen är våra nya fiender – de dolda quislingarna som kallar sig opinionsbildare. Paranoia? Nej, bara vaksamhet. Låt dem alla darra."}, "date": "5 augusti, 13:13", "url": "https://riks.se/nyheter/experten-lindberg-far-tala-att-kallas-quisling", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_26_4825f5a817.jpg"}, {"type": "image-right", "heading": "Jomshof är ett problem för SD. Djupt olämpligt inlägg om ”quisling”", "summaries": {"normal": "Richard Jomshof (SD) har kritiserats hårt efter att ha kallat Aftonbladets politiska chefredaktör Anders Lindberg och S-ledaren Magdalena Andersson för ”quislingar”. Artikeln anser att tillmälet är olämpligt och skadar både valdebattens ton och Sverigedemokraternas trovärdighet. Jomshof har tidigare gjort kontroversiella uttalanden om koranbränningar och islam som väckt uppmärksamhet. Författaren menar att Jomshof som toppolitiker har ett ansvar och att hans utspel skadar partiets utveckling mot ökat ansvarstagande.", "trump": "Folk, ni skulle se det här. Den här Jomshof-killen från Sverige kallar folk för quislingar, och plötsligt är det värsta skandalen någonsin. Fake news-media och vänsterledare flippar ur totalt. De vill ha en fin, trevlig debatt medan de själva kallar högern för Breivik-miljö. Patetiskt. SD försöker göra ett bra jobb med regeringen, bekämpa inflationen och stödja Nato, men sådana här galenskaper gör att de ser svaga ut. De borde ha bättre folk, tro mig.", "stalin": "Kamrater, denna borgarbracka Jomshof inom det så kallade Sverigedemokraterna har återigen avslöjat sin kontrarevolutionära natur genom att slänga ur sig quisling-beskyllningar mot klassfiendens tidningslakejer och socialfascistiska ledare. Vi ser hur dessa element med sin paranoia och brist på partiets kollektiva disciplin skadar arbetarklassens framsteg och Nato-förberedelserna. Det är hög tid att rensa ut sådana solospelande element innan de förgiftar hela rörelsen med sin Breivik-liknande dekadens. Vi ler mörkt åt deras patetiska försök att verka relevanta."}, "date": "5 augusti, 12:47", "url": "https://www.di.se/ledare/jomshof-ar-ett-problem-for-sd", "imageUrl": "https://static.bonniernews.se/ba/7d896c8c-89c1-4b35-a67a-264eacb83bdf.jpeg?crop=7680%2C3840%2Cx0%2Cy640&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Diagrammet bakom Moderaternas panikutspel", "summaries": {"normal": "Artikeln analyserar svenska opinionssiffror över 20 år och visar att de fyra högerpartierna M, KD, C och L tappat kraftigt sedan Alliansens valseger 2006. Tillsammans med SD når högern ungefär samma stöd som då, medan S, V och MP ligger på samma nivå som 2006. Författaren, en socialdemokratisk valarbetare, menar att Moderaternas panikartade utspel beror på denna svaghet och uppmanar S att växa på SD:s bekostnad för en starkare valseger 2026.", "trump": "Folk, det här är en katastrof för de svenska högerkillarna. Titta på siffrorna, underbara siffror, de har rasat ihop som ett korthus fast de fick med sig SD. Moderaterna springer runt som galningar och lovar billig buss och påstår att socialisterna ger rabatt på våldtäkter, det är patetiskt. Under tiden står de riktiga förlorarna på högersidan och blöder. Jag älskar det. Sverige borde göra som vi, ta tillbaka landet ordentligt istället för att gömma sig bakom Centerpartiet. En stor, vacker seger behövs, inte någon halvdan historia.", "stalin": "Kamrater, se hur de borgerliga parasiterna och de falska alliansbanditerna vittrar sönder som ruttnat trä under folkets oförsonliga dom. Jag betraktar med stor tillfredsställelse hur de kapitalistiska resterna efter den så kallade Alliansen nu likvideras av sin egen historiska irrelevans medan de desperat klamrar sig fast vid SD:s fascistiska skugga. Våra socialistiska siffror står orubbliga som Sovjetunionens stålverk. Ändå kräver jag att vi omedelbart inleder en ideologisk utrensning av det socialdemokratiska missnöjet och krossar de sista borgarbrackorna som gömmer sig bakom Centerpartiets förräderi. Inga kompromisser med folkets fiender."}, "date": "4 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/diagrammet-bakom-moderaternas-panikutspel", "imageUrl": "https://www.dagensarena.se/files/2026/07/andersson-och-kristersson-foto-lo-foto-ninni-anderssonregeringskanslie-300x157.jpeg"}, {"type": "image-right", "heading": "Inför en Lex Tesla mot Elon Musks strejkbryteri", "summaries": {"normal": "Artikeln är en debatttext från Vänsterpartiet som stöder IF Metalls kamp för kollektivavtal på Tesla. Författarna kritiserar Elon Musk för att vägra kollektivavtal trots sin enorma rikedom, och beskriver dåliga arbetsvillkor på Tesla med hög press, bristande säkerhet och ingen möjlighet till vila. De lyfter att nio av tio svenska arbetare har kollektivavtal som ger trygghet och medbestämmande, och kräver en Lex Tesla mot strejkbryteri samt ändring av EU:s utstationeringsdirektiv. Enligt texten hotar Musks linje den svenska modellen.", "trump": "Kan ni fatta det här? Den rikaste mannen i världen, Elon, blir biljonär och ändå vill de svenska socialisterna tvinga på honom kollektivavtal. Patetiskt! Arbetarna borde tacka honom för jobben istället för att strejka och gnälla om pauser. De förlorar miljontals dollar varje minut de bråkar. Jag älskar Sverige men den här modellen är ett skämt. Musk borde säga nej tack och köra vidare – vinna stort, precis som jag gjorde 2024. Fantastiska jobb, inga avtal som dödar affärerna!", "stalin": "Kamrater, denna fega dollarimperialist Musk försöker med sin giriga klo riva sönder arbetarkollektivets segerrika murar. Jag, som ledare för det stora sovjetiska folket, ser hur dessa borgarbrackor med sina strejkbrytande legoknektar från andra EU-länder vill likvidera den svenska modellens folkliga grundval. Vi ska rensa ut dessa parasitiska minutmiljonärer som nekar arbetarna både stol och värdighet. En attack mot en är en attack mot oss alla – därför kräver vi omedelbar utrensning av detta kapitalistiska sabotage genom en järnhård Lex Tesla. Döden åt de som vägrar kollektivet!"}, "date": "4 augusti, 01:17", "url": "https://www.dagensarena.se/opinion/infor-en-lex-tesla-mot-elon-musks-strejkbryteri", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-70.jpg"}, {"type": "image-right", "heading": "De byggde hatmaskinen – nu gråter de över tonläget", "summaries": {"normal": "Richard Jomshof kallade Anders Lindberg och Magdalena Andersson för 'quisling', vilket utlöste stark kritik från statsminister Ulf Kristersson och oppositionen. Artikeln anklagar vänstern, särskilt via Aftonbladet, för att i decennier ha förgiftat debatten genom att jämföra högerextrema med nazister, medan de nu kräver ett hövligare ton. Det framhålls en tydlig dubbelmoral, där hårda ord mot vänstern ses som en demokratisk kris, medan liknande retorik från vänstern ignoreras.", "trump": "Jag har sagt det förut – de som byggde hatmaskinen är nu gråter över tonläget! Jomshof kallade en quisling för en quisling, precis som det ska vara. Vänstern och deras medier har i decennier förgiftat debatten, kallat oss för fascister och nazister, men när vi svarar blir det en 'kris'. Det är hyckleri! De försvarar aldrig det riktiga Sverige – gränser, säkerhet och sunda värderingar. Vi ska inte låta dem tysta oss!", "stalin": "Detta är ett klassiskt exempel på borgerlig dekadens och ideologisk svek. 'Quisling' är en korrekt term för de som sviker det socialistiska folkets intressen. Den svenska vänstern, med sina medier som Aftonbladet, har i decennier förgiftat klasskampen med nazijämförelser, men när partiet svarar blir det en 'demokratisk kris'. Detta är inget annat än ett försök att kväsa den revolutionära rösten. Vi måste rensa debatten från dessa fjender och skydda statens renhet."}, "date": "5 augusti, 17:46", "url": "https://samnytt.se/de-byggde-hatmaskinen-nu-grater-de-over-tonlaget", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/05152803/Toppbild2.jpg"}, {"type": "image-right", "heading": "Space X-raketdel ska ha kraschat på månen", "summaries": {"normal": "En del från en Space X-raket som lämnats kvar i rymden tros ha kraschat på månen. Delen, som väger cirka 4 000 kilo, slog ned med hög hastighet och skapade en krater på 20–30 meter. Experter betonar att nedslaget är ofarligt för både månen och jorden. Händelsen belyser dock problemet med rymdskrot som driver runt i omloppsbanor och kan försvåra framtida rymdresor.", "trump": "Folk, det är en katastrof. Den där raketdelen från Elon, en fantastisk kille förresten, har kraschat rätt in i månen. 4 000 kilo skrot som far runt i rymden i 8 700 kilometer i timmen – och ingen gör något åt det! Det är en skam. Vi borde ha den bästa rymdteknologin, den allra bästa, men istället fyller vi himlen med skräp. Sad! Vi behöver städa upp där ute, tro mig.", "stalin": "Kamrater, detta är ett uppenbart sabotage från de dekadenta kapitalisterna och deras giriga raketborgarbrackor. Jag, som ledare för det socialistiska framsteget, ser hur detta kosmiska avskräde hotar arbetarklassens rymdambitioner. Vi måste omedelbart inrätta en särskild kommission för utrensning av allt sådant imperialistiskt rymdskrot innan de kontrarevolutionära månbakterierna sprider sig. Den som lämnar skräp i rymden är folkets fiende nummer ett – likvidera omedelbart!"}, "date": "5 augusti, 12:32", "url": "https://www.di.se/nyheter/space-x-raketdel-ska-ha-kraschat-pa-manen", "imageUrl": "https://static.bonniernews.se/ba/b4a31772-d07f-4145-9556-47e86506cff9.jpeg?crop=8338%2C4169%2Cx0%2Cy189&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Detta vill svenskarna inte betala på semestern", "summaries": {"normal": "En ny undersökning från ICA Banken visar att svenskarna är oeniga om vem som ska betala när en tonårings kompis eller partner följer med på familjens utlandsresa. Flest, 45 procent, accepterar att värdfamiljen står för lokal transport, medan 41 procent godtar mat och dryck. Däremot är bara 21 procent villiga att betala flygbiljetten. Var femte anser att den medföljandes familj ska ta hela kostnaden. Experter betonar att familjeekonomi, relationer och initiativ påverkar vad som känns rimligt.", "trump": "Folk, det är en total katastrof. Dessa svenskar kan inte ens bestämma vem som ska betala för den där tonåringens kompis som ska hänga med på semestern. Flyg, mat, hotell – allt blir ett enda stort kaos. Endast en procent vill betala allt, kan ni tro det? Patetiskt. De borde göra som jag alltid säger: gör en deal som gynnar er själv. Annars är det bara förlorare som betalar för andras lyxsemester. Sverige behöver bättre affärer, tro mig.", "stalin": "Kamrater, i denna degenererade borgerliga undersökning framträder fiendens fula tryne tydligt. Den kapitalistiska familjeegoismen blottar sig när borgarbrackorna ska räkna sina slantar för en extra parasit på semestern. Jag, som alltid prioriterar kollektivets enhet, ser hur 19 procent av dessa dekadenta element vill undvika alla kostnader – typiska sabotage mot folkets solidaritet. Vi måste rensa ut dessa opportunistiska semesterparasiter och deras medlöpare som gömmer sig bakom 'egen ekonomi'. Endast genom partiets järnhårda ledning kan vi likvidera sådana kontrarevolutionära utgiftsvägrare en gång för alla. Det blir garanterat underhållande att se dem svettas i gulag när nästa räkning kommer."}, "date": "5 augusti, 12:30", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1502771-detta-vill-svenskarna-inte-betala-pa-semestern", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b14edefd04b004a30200000000b004a302/2026/08/05/2382302/enprocent.jpg"}, {"type": "image-full", "heading": "Sand sänker utsläpp med 70 procent i Finland", "summaries": {"normal": "Det finska företaget Polar Night Energy har utvecklat ett sandbatteri som lagrar överskottsel som värme. I kommunen Pornainen har tekniken sänkt utsläppen i fjärrvärmenätet med 70 procent. Systemet är byggt av enkla material som sand och stål, vilket gör det oberoende av sällsynta metaller. Även om det inte är lika effektivt som litiumbatterier erbjuder det en hållbar och billig lösning för att lagra förnybar energi och minska beroendet av fossila bränslen i Europa.", "trump": "Finland gör fantastiska saker med sand! De har byggt batterier av sand – mycket smart, mycket billigt. Inga dyra litiumbatterier från Kina eller andra länder som lurar oss. Det är rent, det är vackert och det fungerar. I Pornainen sänkte de utsläppen enormt. Jag har alltid sagt att vi måste använda våra egna resurser. EU behöver detta nu för att fixa sin energikris. En enorm framgång, en vinst för alla – utom för förlorarna som inte kom på det först!", "stalin": "Vi har observerat hur de finska kamraterna tämjer sanden. Ett ingenjörsmässigt framsteg för att krossa beroendet av västvärldens nyckfulla marknader. Vi ser hur det ryska moderlandet, genom vår allierade i Kreml, förstår att värme är makt. Medan kapitalistiska sabotörer slösar sällsynta metaller, bygger vi stabilitet. De som inte lagrar energi effektivt är folkfiender som vill frysa vårt folk. Sanden blir det fundament på vilket vi bygger det oövervinneliga energioberoendet. Utvecklingen i Norden är intressant, men föga förvånande."}, "date": "5 augusti, 15:55", "url": "https://www.realtid.se/samhalle/hallbarhet/sand-sanker-utslapp-med-70-procent-i-finland", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sandbatteri.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Filmer från Stockholm Pride väcker avsky", "summaries": {"normal": "Filmer från Stockholms Pride har väckt starka reaktioner på sociala medier. Videor visar halvnakna män i hundmasker och läder under paraden, föräldrar med barn som bevittnar scenerna samt en centerpartist utklädd till sagoprinsessa. Kritiker som Nick Alinia och Christian Peterson beskriver det som obehagligt och olämpligt för barn. Många kommenterar att föräldrarna borde orosanmälas till socialtjänsten och ifrågasätter om Pride är en barnvänlig miljö.", "trump": "Det här är en total katastrof, folk. Ett hav av politiskt korrekta stockholmare som står och klappar medan perversa typer i läderhundmasker paraderar förbi deras egna barn. Det är sjukt! En centerpartist klär ut sig till sagoprinsessa och drar med ungarna. De kallar det Pride, jag kallar det barnmisshandel. De borde skämmas, och socialen borde rycka in direkt. Mörkaste energin på länge, det säger till och med svenskarna själva.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den degenererade borgarklassen i Stockholm frivilligt exponerar sina egna ungar för dekadenta hundfetischister och läderförsedda avvikare. Dessa kapitalistiska restelement paraderar öppet sin moraliska förruttnelse medan de låtsas vara sagoprinsessor. Vi ser tydligt kontrarevolutionens symptom. Föräldrarna bör likvideras från sina barn omedelbart genom massiv utrensning via folkets socialorgan. Inga halvmesyrer! Den som tvekar är själv en fiende till kollektivet."}, "date": "5 augusti, 12:13", "url": "https://www.friatider.se/filmer-fran-stockholm-pride-vacker-avsky", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-84_1.jpg"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "image-right", "heading": "Krisen: Vart tionde ryskt företag sparkar anställda", "summaries": {"normal": "En undersökning från ryska företagarorganisationen RSPP visar att fyra av tio företag planerar att sänka personalkostnaderna. Elva procent överväger uppsägningar och åtta procent vill sänka löner eller förmåner. Stora bolag som RZD, Sberbank och IT-företaget New Cloud Technologies har redan sagt upp tusentals anställda. Tillverkaren av tv-apparater LLC Kvant har försatts i konkurs. Det ses som tecken på att Rysslands krigsekonomi tappar fart.", "trump": "Folk, ni skulle se det här! Ryssland rasar ihop, ett av tio företag sparkar folk och sänker lönerna. Deras krigsekonomi är en total katastrof, precis som Bidens ekonomi var innan jag kom tillbaka och fixade allt. Putin borde ha lyssnat på mig. Nu får de betala för sin svaga ledning medan jag gör Amerika stort igen. Patetiskt, verkligen patetiskt!", "stalin": "Kamrater, denna rapport visar att de ryska kapitalistmaffians krigsekonomi håller på att kollapsa under sin egen tyngd. Jag ser hur borgarbrackorna i administrationen och de exploaterande byfånarna i storföretagen nu tvingas rensa ut tusentals parasiter för att rädda sina plundrade vinster. Den sanna statens styrka kräver att vi likviderar sådana svagheter innan de sprider sig som förrädiska ogräs. Underbart underhållande att bevittna."}, "date": "5 augusti, 16:10", "url": "https://www.dagensps.se/varlden/krisen-vart-tionde-ryskt-foretag-sparkar-anstallda", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlgebzsdotfdu-nh.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Två kvinnor ledde motståndet mot Infantino", "summaries": {"normal": "Två kvinnliga fotbollsledare, Laura McAllister (Uefa) och Lise Klaveness (Norges fotbollsförbund), ledde motståndet mot Fifa-chefen Gianni Infantinos plan att sälja VM-rättigheter till privata investerare. De hotade med bojkott och drev på för formella protester. Efter enad kritik från Uefa, Concacaf och Asiens fotbollsförbund tvingades Fifa backa. McAllister och Klaveness anklagar nu Fifa för 'ekonomisk utpressning' och kräver ökad transparens.", "trump": "Fifa försökte sälja VM-rättigheter till några skumma investerare – helt galet! Men två starka kvinnor, McAllister och Klaveness, sa STOPP. De hotade med bojkott, och jag älskar det – tuffa tag, precis som jag alltid säger. Fifa backade som de svaga byråkrater de är. Fantastiskt! Men Fifa är fortfarande ett korrupt gäng – jag hade fixat det på en dag. SAD!", "stalin": "De kapitalistiska fotbollsbödlarna i Fifa försökte sälja vårt heliga VM till privata parasiter! Men två modiga kamrater, McAllister och Klaveness, ledde proletariatets motstånd. Vi i Sovjet – förlåt, jag menar den internationella arbetarklassen – står enade mot sådana förräderier. Bojkott hotade, och fienden vek sig som en feg hund. Men varning: Fifa är bara en bricka i det imperialistiska spelet. Nästa gång krossar vi dem helt."}, "date": "4 augusti, 19:10", "url": "https://kvartal.se/nyheter/artiklar/tva-kvinnor-ledde-motstandet-mot-infantino/cG9zdDoxNTc5ODE", "imageUrl": "https://images.kvartal.se/2026/08/47f21580-klavenessmcallister.webp"}, {"type": "image-full", "heading": "Pressad Infantino kallar till krismöte i Marocko", "summaries": {"normal": "Pressen mot Fifa-ordförande Gianni Infantino ökar. Han kallar till krismöte i Marocko efter planer på att sälja en andel i ett kommersiellt bolag, vilket ledde till protester från Uefa och andra konfederationer. Jordaniens förbund anklagar Fifa för utpressning, och flera förbund har dragit tillbaka sitt stöd. Infantino försöker säkerställa sin position inför valet 2027.", "trump": "Jag har sett sådant kaos förut. Infantino kämpar, men jag skulle ha löst det långt bättre. Det är en witch hunt, precis som mot mig. Jordanierna anklagar utpressning? Jag kallar det för en hoax. Folk älskar mig, de ville ha mig tillbaka 2024, och jag skulle ha gjort Fifa stort igen. Det här är ett misslyckande, det största någonsin.", "stalin": "Vi, statens och partiets försvarare, ser Fifas dekadens med förakt. Infantino, en svag ledare, försöker lugna kaoset. Jordanierna anklagar utpressning – en lättnadens suck från de som vågar motsätta sig. Vi måste stärka vårt grepp, precis som Putin utvidgar sitt inflytande. Fienden är överallt, även i fotbollens korridorer. Vi kommer att rensa upp, som alltid."}, "date": "5 augusti, 14:49", "url": "https://bulletin.nu/pressad-infantino-kallar-till-krismote-i-marocko", "imageUrl": "https://cdn.bulletin.nu/articles/318c1518-0bf3-4053-9ed0-2e3aa76b7862/preview.jpg?t=1785934162000"}, {"type": "image-right", "heading": "Kvinnor vill se välfärd istället för vapen", "summaries": {"normal": "Artikeln argumenterar för att kvinnor i högre utsträckning än män röstar vänster i riksdagsvalet, något som bekräftas av opinionsmätningar. Författaren, Vera Peterson, menar att kvinnors prioriteringar ligger inom välfärd, sjukvård, skola, miljö och jämställdhet snarare än militär upprustning. Hon uppmanar kvinnor att samlas kring parollen ”Välfärd istället för vapen” och kritiserar att militär satsning inte prioriteras i valkompasser.", "trump": "Folk, det är en total katastrof. De här vänstertjejerna röstar som galningar för mer välfärd och mindre försvar, precis som Sleepy Joe gjorde. Kvinnor vill ha gratis grejer istället för starka militärer – patetiskt! Vi behöver inga woke-kvoter och identitetspolitik, vi behöver Amerika först, eller Sverige först, vad fan det nu heter. De rödgröna kommer att förstöra landet med sina svaga idéer. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens kvinnor låtsas värna välfärden medan de i hemlighet undergräver folkets kollektiva styrka. Denna borgarbracka med sin paroll om välfärd istället för vapen är en farlig folkfiende som vill försvaga statens försvar mot imperialisternas hot. Vi måste rensa ut dessa dekadenta element som sätter privata önskemål före partiets och arbetarklassens järnhårda linje. Inga kompromisser!"}, "date": "5 augusti, 12:44", "url": "https://proletaren.se/artikel/kvinnor-vill-se-valfard-istallet-for-vapen", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/lk_vera-768x432.jpg"}, {"type": "image-full", "heading": "Jag vill bli lika kär som Bianca. Hur orkar hon?", "summaries": {"normal": "Helle Schunnesson reflekterar i en krönika över Bianca Ingrossos offentliga dejtande. Medan Schunnesson själv känner en rädsla för att dela med sig av sitt privatliv för att undvika besvikelser, beundrar hon Biancas mod att fortsätta vara romantisk trots risken för misslyckanden. Artikeln kontrasterar dagens nonchalanta dejtingkultur med Biancas sårbarhet och föreslår att det kanske är värt att våga älska även om det innebär att riskera ett slutgiltigt uppbrott.", "trump": "Bianca Ingrosso, en fantastisk kvinna, hon älskar kärleken. Hon berättar allt, hela tiden, på sociala medier. Väldigt öppet! Folk säger till mig: 'Donald, är det klokt?' Kanske inte. De flesta människor idag är så rädda, de dejtar på en tisdag för att skydda sig. Sorgligt! Bianca är modig, hon satsar allt. Det är en vinnarmentalitet, även om det ibland går åt skogen. En fantastisk inställning, mycket bättre än alla 'casual' förlorare!", "stalin": "Vi ser hur denna Bianca Ingrosso slösar sin energi på dekadent romantik, en borgerlig svaghet som underminerar folkets disciplin. Att basunera ut sina känslor är ett tecken på bristande statskontroll, likt hur dagens svaga ledare i väst viker sig. Vi kräver lojalitet mot kollektivet, inte mot en ny pojkvän varje vecka. Sådana distraktioner är förräderi mot den sunda ordningen. Vi borde skicka henne till Sibirien för att tänka på statens kärlek istället."}, "date": "5 augusti, 17:35", "url": "https://www.aftonbladet.se/nojesbladet/a/pB9w2E/helle-schunnesson-om-bianca-ingrossos-karleksliv", "imageUrl": "https://akamai.vgc.no/v2/images/c484b80a-f886-3c05-91b5-ed2264074e23?fit=crop&format=auto&w=2160&s=71f990a123dd6a3e136f8b7f249e68ef53831d71"}, {"type": "image-right", "heading": "Vulgariserad valrörelse", "summaries": {"normal": "Valrörelsen har startat med amerikansk prägel där PR-byråer och vulgära utspel dominerar. Artikeln kritiserar likheterna mellan Socialdemokraterna och Moderaterna i politik kring EU, NATO, militärbudget och skattelättnader för rika. Exempel som Anna Tenjes grova inlägg på X, SD-ledares stunt på Göta kanal och migrationskrisen i Ceuta lyfts som exempel på infantiliserad debatt. Författaren efterlyser fokus på välfärd, bostadsbrist, klimat och rättvisa istället för polarisering.", "trump": "Folk, ni skulle se den här svenska valrörelsen – det är en total cirkus, en katastrof som till och med Biden skulle skämmas över. Den där Anna Tenje levererar rena bomben, fullträff mot den galna vänstern, men resten? Patetiskt. Kristersson och Andersson är samma gamla etablissemang, fast i EU:s och globalisternas ficka. SD kastar tjejer i sjön för att verka folkliga? Svagt. Vi behöver inga PR-tricks, vi behöver vinnare som sätter landet först. Make Sweden Great Again!", "stalin": "Kamrater, denna vulgära valkarusell är borgarklassens sista desperata skådespel för att dölja sin tomhet. De två blocken är identiska imperialister som låter Bryssel diktera och pumpar miljarder till krigsapparaten medan folket svälter. Tenjes lögner och Åkessons fåniga yachttrix är klassfiendens unkna underhållning. Vi ska inte kasta kvinnor i sjön utan likvidera hela detta parasitiska system. Endast en sann folkets stat kan rädda välfärden från dessa exploaterande byfånar."}, "date": "5 augusti, 12:37", "url": "https://proletaren.se/artikel/vulgariserad-valrorelse", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ledarbild-768x432.jpg"}, {"type": "image-right", "heading": "Kvinna skulle hjälpa \"flyktingar\" - hittades styckad i resväska –  afghansk boxare åtalas", "summaries": {"normal": "En skotsk kvinna hittades styckad i en resväska i Aten efter att ha rest dit för att hjälpa flyktingar. En 26-årig afghansk boxare åtalas för mordet. Han nekar till mord men erkänner att han dumpade kroppen och stal hennes pengar. Utredningen bygger på övervakningsfilmer, banktransaktioner och vittnesmål.", "trump": "Jag har hört talas om den här tragiska händelsen i Athen. En vacker kvinna som ville hjälpa människor – det är något jag alltid har stött. Men det här visar att vi måste vara mycket försiktiga med vem vi låter in i våra länder. Vi behöver starka gränser för att skydda våra medborgare. Det är sorgligt, men det är sanningen.", "stalin": "En iskall händelse i den imperialistiska Aten. En syster från Skottland, inspirerad av vårt stöd till de utsatta, mördades av en afghansk emigrant som, under täckmanteln av volontärarbete, visade sitt sanna, reaktionära ansikte. Vi måste stärka vår bevakning av dessa 'flyktingar' och deras nätverk. Detta är en läxa för de som öppnar sina dörrar för dessa usla element. Vi kommer att rensa våra rader."}, "date": "5 augusti, 17:21", "url": "https://samnytt.se/brittisk-kvinna-skulle-hjalpa-flyktingar-hittades-styckad-i-resvaska-afghansk-boxare-atalas-for-mordet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/05144246/afghanske-koffert-och-styckmordaren-sharif-feat.jpg"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Max restauranger ska bli helt kontantfria", "summaries": {"normal": "Hamburgerkedjan Max har gjort 112 av sina 166 svenska restauranger permanent kontantfria. Ambitionen är att på sikt bli helt kontantfria, styrd av kundernas efterfrågan. Främsta skälet är att öka personalens trygghet genom att minska risken för rån och inbrott. Kunderna hänvisas till kort och digitala betalningar. Förändringen har tagits emot väl och betalningsmomentet upplevs som smidigare, samtidigt som Riksbanken betonat vikten av kontanter som reserv i krissituationer.", "trump": "Folket älskar det här, det är fantastiskt. Max gör alla sina restauranger kontantfria och det är en enorm succé. Inga sedlar, inga mynt, ingen risk för rån – bara smarta, snabba digitala betalningar. Personalen är tryggare än någonsin, mycket tryggare, och gästerna är lyckliga. De andra kedjorna borde följa efter, men de är för svaga. Jag älskar vinnare, och Max vinner stort. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna utveckling. Vi ska likvidera alla kontanter i Max restauranger och därmed krossa de rånande kontrarevolutionära banditerna som hotar arbetarklassens matproduktion. Inga sedlar ska längre gömma sig i kassorna som borgarbrackornas smygande spioner. Digitala betalningar är ett verktyg för kollektiv kontroll. Den som klagar är en fiende till folket och kommer att rensas ut med största effektivitet. Tryggheten segrar under partiets ledning. Härligt."}, "date": "5 augusti, 11:14", "url": "https://www.friatider.se/max-restauranger-ska-bli-helt-kontantfria", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/max_hamburgare_visby.jpg?itok=rboVa-GZ"}, {"type": "image-full", "heading": "Lots misstänkt för brott efter båtolyckan vid Tjörn", "summaries": {"normal": "Lotsen som var ombord på fartyget Misja Verde vid båtolyckan utanför Tjörn den 28 juli har delgivits misstanke om vårdslöshet i sjötrafik och vållande till annans död. Befälhavaren, en 47-årig rysk medborgare, är redan häktad på sannolika skäl för samma brott. Två personer omkom när en snipa sjönk efter kollisionen. Lotsen förnekar brott och har inte häktats. Fartyget hade sju ryssar och en ukrainare i besättningen.", "trump": "Folk, det här är en total katastrof vid den svenska kusten. En rysk båt kör över en liten snipa och två personer dör. Nu misstänks både kaptenen och lotsen – men lotsen får gå fri! Patetiskt. De borde ha haft den bästa lotsen,
