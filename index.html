"normal": "Utgivaren Fredrick Malmberg förklarar varför TV4 granskar Sverigdemokraterna igen. Partierna får stora summor i partistöd men insynen är begränsad. Kalla fakta har tidigare granskat alla riksdagspartier, bland annat om anonyma bidrag och Socialdemokraternas mediebolag. Granskningen av SD bygger på tips från en tidigare samarbetspartner med omfattande dokumentation. SD har valt att inte svara på frågorna. TV4 betonar att de granskar alla partier oberoende och välkomnar tips.", "trump": "Folk, ni tror inte vad jag ser här. De här svenska mediemänniskorna fixerar sig på SD som vore det deras stora fiende, precis som de gamla fejkmedierna jag kämpade mot innan jag tog tillbaka Vita huset från den sovande Joe. De får en halv miljard i skattepengar men ingen insyn? Typiskt! De granskar alla säger de, men det är alltid samma parti som hamnar i rampljuset. Patetiskt. Tipsa dem om de riktiga problemen istället för den här identitetspolitiska galenskapen. Jag älskar Sverige, men det här är en witch hunt.", "stalin": "Kamrater, jag ser hur borgarpressens lakejer riktar sin granskning mot dem som utmanar systemet. En halv miljard i folkets medel delas ut men insyn saknas, typiskt för det borgerliga hyckleriet. Vi har tagit emot tips från en bedragare som nu angriper partiet efter egen konflikt. Med gigabyte av material utrensar vi lögnerna. Fienderna tiger, vilket bekräftar deras skuld. Inga partier går fria från folkets dom, men klassfiendens troll är särskilt farliga. Fortsätt leverera underlag så rensar vi ut folkförtryckartrollen en efter en."}, "date": "8 juni, 05:56", "url": "https://www.tv4.se/artikel/5xcuYBgruiUTUfsLXuu8yx/utgivaren-daerfoer-granskar-vi-sd-igen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2pJzTVLGQlIq2NXWbKl8A4%2F90eac19043d39c016557fdce82fec966%2Fmalmberg.png&width=1024"}, {"type": "image-right", "heading": "Frun kan inte resa till VM: ”Hon får behandlingar”", "summaries": {"normal": "Nederländernas förbundskapten Ronald Koeman drabbas av ett privat bakslag inför VM. Hans fru Bartina, som lider av återkommande bröstcancer, kan inte följa med till turneringen på grund av veckovisa behandlingar. Koeman hoppas ändå att hon kan närvara vid en eventuell final om hon kan hoppa över en behandling. Bartina drabbades första gången av cancer 2010 och sjukdomen har återkommit flera gånger.", "trump": "Titta på den stackars Ronald Koeman, en bra kille, men hans fru är sjuk och kan inte komma till VM. Behandlingar varje vecka, det är en katastrof. Jag älskar Nederländerna, fantastiska människor, men detta är sorgligt. Om de når finalen kanske hon kan skippa en behandling – det vore perfekt, det ultimata. Ingen gör det bättre än mig när det gäller att vinna, tro mig.", "stalin": "Kamrater, denna dekadenta borgarbracka Koeman ylar om sin frus svaghet inför det imperialistiska VM-spektaklet. Hennes ständiga behandlingar mot den borgerliga cancern är en sabotör som hotar folkets fotboll. Vi, partiet och arbetarna, ser hur fienderna – dessa veckovisa tumörer och kapitalistiska svagheter – konspirerar mot segern. Om finalen nås skall behandlingen likvideras som en folkfiende. Det ultimata är att krossa motståndet med stål och proletär vilja, inte med patetiska ursäkter."}, "date": "8 juni, 14:24", "url": "https://www.svt.se/sport/fotboll/ronald-koemans-sorg-frun-kan-inte-resa-till-vm-far-behandlingar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.47/6ad0f47cfc6649e2170fa49612afb31b87fa9028ade72b4591cda08adf6c0071"}, {"type": "image-full", "heading": "Här är frågorna som SD inte vill svara på", "summaries": {"normal": "Kalla fakta har under en månad försökt få intervjuer med Jimmie Åkesson och andra SD-toppar utan framgång. Partiet har fått ta del av dokument, frågor och information i förväg. Programmet lyfter bland annat hur partistöd används, fakturor för påhittade evenemang, alkoholinköp, förmånsbeskattning och en lägenhet inredd åt Eva Vlaardingerbroek trots boendeförbud. SD har valt att inte svara på frågorna.", "trump": "De här patetiska SD-typerna springer och gömmer sig som fega råttor istället för att ställa upp som riktiga ledare. En hel månad har de fått frågor och dokument – och vad gör de? Ingenting. Totalt kaos med skattepengar, påhittade fester och lägenheter till några utvalda. Låter som typisk vänsterstil fast de låtsas vara annorlunda. Patetiskt. Jag skulle ha krossat dem i en intervju på två minuter, tro mig.", "stalin": "Kamrater, dessa fega element inom Sverigedemokraterna vägrar konfronteras med folkets frågor trots att vi gav dem en hel månad att förbereda sina lögner. De gömmer sig som klassfiendens lakejer medan partistödet slösas på alkoholorgier och hemliga lägenheter åt utvalda. Vi ser hur borgarbrackorna skyddar varandra. En sådan motvilja mot transparens kräver omedelbar utrensning av alla opportunistiska element som förgiftar arbetarklassens förtroende. Folkets dom kommer."}, "date": "8 juni, 05:55", "url": "https://www.tv4.se/artikel/41u22GYipto8cHrQov2llN/haer-aer-fragorna-som-sd-inte-vill-svara-pa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6RPa8qtuf5MPFfJYveAobF%2Ff74ae805000c34d97fea920a9bfba188%2Fsd-hemlig_puff.png&width=1024"}, {"type": "image-full", "heading": "Anders Eklund nekas tidsbestämt straff", "summaries": {"normal": "Örebro tingsrätt har avslagit Anders Eklunds, tidigare Gustavsson, ansökan om att omvandla hans livstidsstraff till ett tidsbestämt straff. Eklund, som dömdes 2008 för morden på Engla Höglund och Pernilla Hellgren, har avtjänat 18 år. Han har utsatts för upprepade misshandelsfall i fängelset, bland annat med utlovade belöningar för att döda honom. Tingsrätten bedömer att risken för återfall i allvarlig brottslighet är alltjämt mycket hög.", "trump": "Folk, ni skulle inte tro det, men den här hemska mördaren, en riktig loser, ville ha tidsbestämt straff efter att ha dödat två personer. Livstid borde vara livstid, eller hur? Han drömmer om Norge och en camping, kan ni tänka er? Men domstolen sa nej, tack och lov. Det finns en stor risk att han gör det igen. Smart beslut, väldigt smart. Vi behöver tuffare straff, inte mindre.", "stalin": "Kamrater, jag har granskat detta fall med den revolutionära vaksamhet som alltid kännetecknar oss. Denne degenererade mördare, en parasit från den värsta sortens reaktionära träsk, vågar begära tidsbestämt straff efter att ha likviderat två oskyldiga. Vi ser hur borgarbrackornas dekadenta rättssystem leker med farliga element. Risken för återfall är uppenbar, likt en dold trotskistisk cell. Därför förblir straffet evigt. Inga eftergifter mot folkets fiender, aldrig."}, "date": "8 juni, 12:04", "url": "https://nyheter24.se/nyheter/inrikes/1489683-anders-eklund-nekas-tidsbestamt-straff", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/59737b3504b004a30200003200c00c5e07/2026/06/08/2369436/anders%20eklund%20tidsbestämt%20straff.jpg"}, {"type": "image-right", "heading": "Nya attacker mellan Israel och Iran", "summaries": {"normal": "Under natten mot måndag utbytte Iran och Israel de allvarligaste attackerna sedan vapenvilan i april. Israel slog mot mål i västra och centrala Iran, inklusive en viktig petrokemisk anläggning, medan Iran beskjöt israeliska flygbaser. Huthirebeller i Jemen anslöt sig med robotattacker. Vapenvilan har varit skakig på grund av oenighet om Israels insatser mot Hizbollah i Libanon. Experter varnar för att eskaleringen kan sabotera pågående fredsförhandlingar.", "trump": "Iran och Israel håller på och skjuter som galningar igen, precis som jag visste att de skulle göra. Jag sa åt Netanyahu att inte gå till motattack, men nu har vi explosioner överallt. Huthisterna från Jemen hoppar också på tåget. Det är ett enda kaos. Vi måste få dem att sluta skjuta omedelbart. Jag är den enda som kan fixa det här, tro mig, det blir fantastiskt när jag är klar.", "stalin": "Kamrater, de sionistiska angriparna och de persiska revisionisterna leker farlig eld med sina robotar och bomber. Jag ser redan de kapitalistiska parasiterna i Tel Aviv och Teheran som konspirerar mot folkets sak medan de gömmer sig bakom sina oljefat och petrokemiska borgarbrackor. Huthikamraterna gör rätt i att slå tillbaka. Vi ska rensa ut alla fiender till freden, likvidera de väststödda terroristerna och se till att deras vedergällningar krossas under arbetarklassens järnhand. Paranoian är berättigad – fienden sover aldrig."}, "date": "8 juni, 14:11", "url": "https://www.svt.se/nyheter/utrikes/nya-attacker-mellan-iran-och-israel-vapenvilan-pressas", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.51/0.32/1aded7f335e00cf22490d1b84f1daf18da9aa47b5cbc7eff6921d9c7b74c0834"}, {"type": "image-full", "heading": "Svenska fans rasar mot ölpriserna inför VM: \"Sjukt utsugeri\"", "summaries": {"normal": "Svenska fotbollsfans rasar över de höga dryckespriserna inför VM 2026 i USA, Kanada och Mexiko. På en arena i Tampa kostade en flaska vatten runt 70 kronor och en öl över 160 kronor under Englands genrep. Andreas Richt från Gula väggen kallar det ett sjukt utsugeri. Fansen oroar sig särskilt över vattnet då höga temperaturer väntas och Fifa-regler begränsar medhavda flaskor. Supportrar kräver gratis vatten på arenorna.", "trump": "Folk, det här är en katastrof. VM 2026 i vårt fantastiska land och de tar 160 kronor för en öl? Vatten för 70 kronor? Det är riggat mot fansen, precis som alla dessa globala evenemang. De suger ut er med dyra biljetter, resor och nu det här. Det är inte bra, inte bra alls. Game, set, match mot vanliga människor. Vi behöver bättre priser, annars kan de glömma hela spektaklet. Sad!", "stalin": "Kamrater, detta är borgarklassens vedervärdiga utsugning maskerad som ett fotbollsmästerskap. Jag ser hur de imperialistiska parasiterna i Fifa och arenakapitalisterna planerar att förgifta arbetarnas kroppar med sin dyra vätska medan de skrattar åt våra supportrar. Vatten som kostar skjortan? En utrensning av dessa törstskapande fiender till folket är nödvändig. Vi garanterar gratis vatten åt alla äkta kamrater – annars likviderar vi hela spektaklet med deras egna överpriser. Dehydrering är kontrarevolutionärt!"}, "date": "8 juni, 11:45", "url": "https://nyheter24.se/sport/fotboll/1489672-svenska-fans-rasar-mot-olpriserna-infor-vm-sjukt-utsugeri", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a7592d5f04b004a30200000000b004a302/2026/06/08/2369431/svenska-fans-rasar-olpris-ol-alkohol-vatten-fotboll-vm-fotbollsvm-2026-pris.jpg"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Någon jävla ordning måste det vara i ett antirastiskt parti", "summaries": {"normal": "Ledaren kritiserar Vänsterpartiets ledare Nooshi Dadgostar för hennes insats i Agenda efter Expressens avslöjande om antisemitiska uttalanden och hyllningar till terrordåd bland partiets kandidater. Artikeln menar att fokus borde legat på svenska judars trygghet istället för att byta ämne och angripa motståndare. Författaren efterlyser genuint självständiga åtgärder mot antisemitism snarare än reaktioner efter medial granskning och varnar för ökad polarisering.", "trump": "Folk, ni skulle ha sett det här. Den här Dadgostar-kvinnan kommer in i studion och gör totalt fiasko, en riktig katastrof. Istället för att be om ursäkt till judarna i Sverige, som förtjänar bättre än dessa Hamas-fans i hennes parti, börjar hon anklaga alla andra och pratar om jobb. Patetiskt! Vänstern är ett antirasistiskt parti? Snälla, det är en cirkus. Jag fixade mycket bättre som president, både första och andra gången, innan den sömngångaren Biden tog över. Sverige behöver ordning, inte vänstervridna ursäkter.", "stalin": "Kamrater, jag betraktar med avsmak hur denna opportunistiska partiledare vänder sig bort från de verkliga hoten mot arbetarklassen och de förtryckta. Istället för att med järnhand rensa ut de folkfiender som hyllar terrorister inom leden, väljer hon att attackera motståndarna och byta ämne. Ett antirasistiskt parti utan självkritik är en borgarbracka i förklädnad. Den sanna utrensningen börjar inifrån. Varje dag som slösas på sådana skandaler är en dag förlorad för det revolutionära arbetet mot imperialismens alla former."}, "date": "8 juni, 13:47", "url": "https://www.etc.se/ledare/naagon-jaevla-ordning-maaste-det-vara-i-ett-antirastiskt-parti", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20251215121240_688fd520-4f0f-40df-9ed1-7243a69b173b.jpg"}, {"type": "text", "heading": "Kristersson antyder infiltration i V", "summaries": {"normal": "Statsminister Ulf Kristersson anklagar Vänsterpartiet för att ha infiltrerats av islamister för att vinna röster. Nooshi Dadgostar avfärdar kritiken och menar att partiet agerat kraftfullt mot kandidater med extremistkopplingar. Expressen avslöjar att 24 kandidater med antisemitiska åsikter tagits bort från Vänsterpartiets vallistor. Debatten präglas av oenighet om omfattningen och orsakerna till problemet.", "trump": "Jag såg den här debatten och, wow, vad svagt! Kristersson, en smart kille, pekar på hur Vänsterpartiet har blivit infiltrerat av extremister – och vad gör de? Ingenting! Nooshi, hon pratar och pratar, men sanningen är att hennes parti är ett skämt. 24 kandidater med hemska åsikter? Det är inte 'enstaka fall', det är ett mönster! Sverige borde ta en titt på sig självt – eller låt mig fixa det, jag är bra på att städa upp!", "stalin": "Kamrater, ännu en gång avslöjas bourgeoisins förräderi! Detta så kallade 'Vänsterparti' har blivit en plantskola för kontrarevolutionära element, som hyllar terror och förnekar historiens lärdomar. Vi har sett liknande infiltrationer i andra länder – svaga ledare som Nooshi Dadgostar låter fienden smyga in genom bakdörren. Men folket ser igenom detta! 24 avskedade kandidater? En droppe i havet! Vi i Sovjet – förlåt, Ryssland – skulle ha rensat ut hela trädgården med en enda order. Låt detta vara en varning till alla som leker med elden!"}, "date": "8 juni, 06:06", "url": "https://kvartal.se/nyheter/artiklar/statsministern-vansterpartiet-infiltrerat-av-islamister/cG9zdDoxMjc4MTM"}, {"type": "image-full", "heading": "Debatt: Vem är demokratin till för?", "summaries": {"normal": "Författaren Thomas Nimtoft analyserar konservativ kritik av modern demokrati. Konservativa ser risker i att majoritetsviljan blir absolut grund. De betonar behovet av institutioner, traditioner och kulturell kontinuitet som står över tillfälliga opinioner. Kritiken inkluderar människans brist på rationellt politiskt handlande, mediers förstärkande av känslor, och faran vid att samhället omformas efter snabba idéströmningar. Demokrati kan undergräva auktoriteter och leda till destruktiva beslut, vilket kräver begränsande institutioner.", "trump": "Jag har sagt det förut: demokrati fungerar inte när fake news och populistiska skurkar driver politiken. Folket är smartare än dessa experter tror, men vi behöver starka ledare som jag för att skydda våra värderingar. Artikeln har rätt – vi måste sluta med denna politiska korrekthet och bygga på traditioner som gör Amerika stort igen. Media hatar det, men vi vinner!", "stalin": "Vi betraktar demokratin som en feodal ideology som söker krossa statens och partiets auktoritet. Folket är som spädbarn, oförmögna att fatta rationella beslut under rädsla och propaganda. Deras 'majoritetsvilja' är en sjukdom som måste botas genom vår disciplinerande hand. Vi bygger en stark stat genom tradition och kollektivt ansvar, precis som vår store ledare Putin visar. Fienden inifrån, de demokratiska elementen, är en cancer som måste utrotas."}, "date": "8 juni, 13:02", "url": "https://bulletin.nu/debatt-vem-ar-demokratin-till-for", "imageUrl": "https://cdn.bulletin.nu/articles/a237be63-b709-423f-8697-b730340c70c8/preview.jpg?t=1780903814000"}, {"type": "image-right", "heading": "Silicon Ragnarök – när Sverige slutade fungera", "summaries": {"normal": "Jennifer Grönqvist kritiserar i en debattartikel bilden av Sverige som ett innovativt land. Trots höga placeringar i globala innovationsindex exporteras svenska uppfinningar främst, medan den offentliga sektorn lider av föråldrade system, regelverksfetischism och riskaversion. Sverige rankas sist i OECD:s index för digital mognad i offentlig sektor. Exempel som Cosmic och uteblivna nyttor i stora IT-projekt visar på ett gap mellan exportframgångar och inhemsk utveckling.", "trump": "Det här är en katastrof, folk. Sverige skryter om att vara världens mest innovativa land efter oss, men titta på sanningen – de bygger fantastiska saker som Spotify och Klarna bara för att sälja dem till utlandet. Deras egna system är ett enda kaos, sjuksköterskor sitter och letar i gamla datorer medan patienterna väntar. De är sist i digital mognad, totalt misslyckande. De har talang men regeringen och byråkraterna förstör allt med sin dumma riskaversion. Patetiskt, men vi visste det redan.", "stalin": "Kamrater, jag betraktar med stålhård blick detta dekadenta haveri som borgarbrackorna i Sverige kallar innovation. De producerar unicorn-bolag enbart för att sälja dem till utländska kapitalister medan folkets system ruttnar som förrädiska sabotage. Denna regelverksfetischism och riskfyllda aversion är fiendens verk, en parasitisk femtekolonn som likviderar folkets framsteg. Vi ska rensa ut dessa tekniska skulder och revisionens lögnare som gömmer sig bakom siffror. Sovjet – nej, det svenska kollektivet förtjänar bättre än 80-talets reliker och imperialistiska utförsäljningar. Hädanefter ska varje byte av medicinlista bli en seger för partiet."}, "date": "8 juni, 13:47", "url": "https://www.di.se/debatt/silicon-ragnarok-nar-sverige-slutade-fungera/", "imageUrl": "https://static.bonniernews.se/ba/40294192-ec7e-44f8-96e6-9e048fa831b3.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Trump: Sluta skjuta", "summaries": {"normal": "Efter ett dygn av intensiva attacker mellan Israel och Iran uppmanade USA:s president Donald Trump båda länderna att omedelbart sluta skjuta. Iran meddelade via statliga medier att de inte kommer att anfalla mer om Israel också avbryter sina bombningar, inklusive mot Libanon. Trump skrev på Truth Social att förhandlingar om eldupphör pågår. Attackerna inleddes efter israeliska anfall mot Beirut och fortsatte med iranska robotar mot israeliska baser samt israeliska bombningar av en petrokemisk anläggning. Det är de första iranska attackerna mot Israel på två månader.", "trump": "Israel och Iran, lyssna på mig, det är dags att sluta skjuta direkt. Jag skrev det själv på Truth Social och de lyssnar faktiskt, de smarta grabbarna. Iran säger att de lägger ner vapnen om Israel gör samma sak mot Libanon. Båda sidor vill ha ett eldupphör nu, förhandlingarna om fred rullar på så länge ingen är okunnig eller dum. Jag sträckte ut handen till Iran: ni har avfyrat era robotar, det räcker. Kom tillbaka till bordet och gör en deal, det blir fantastiskt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Israel och de dekadenta mullorna i Iran som leker sina farliga spel med robotar och bomber. Deras falska eldupphör är ett symptom på kapitalistisk paranoia och imperialistisk svaghet. Vi, arbetarklassen, ser hur de sionistiska reaktionärerna och de persiska avfällingarna försöker dölja sin rädsla bakom petrokemiska explosioner. En utrensning av dessa krigshetsande element vore på sin plats. Kom till förhandlingsbordet eller låt oss likvidera er dumhet med järnhand. Det är underhållande att se hur deras 'fred' alltid slutar i blod."}, "date": "8 juni, 13:44", "url": "https://www.di.se/nyheter/trump-sluta-skjuta/", "imageUrl": "https://static.bonniernews.se/ba/beb48e69-6966-45ec-b6dc-0a3b2287c8c1.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Irans hot efter nya attackerna: ”Början på en hel vecka”", "summaries": {"normal": "Iran har avfyrat robotar mot Israel, enligt både israelisk militär och iranska revolutionsgardet. Gardet varnar för att attacken bara är början på en hel vecka av fortsatta operationer. Det är den första iranska attacken mot Israel sedan vapenvilan i april. Israel har tidigare attackerat mål i Beirut som svar på raketer från Hizbollah. Irans parlamentstalman fördömer USA och Israel, medan president Trump uppmanar Netanyahu att inte svara på anfallet.", "trump": "Iran skjuter sina skrotrobotar mot Israel och kallar det början på en hel vecka av kaos. Typiskt. Jag ringer Bibi direkt och säger: sluta nu, grabbar. Israel fick sin attack, Iran fick sin attack, alla hade kul. Vi behöver ingen mer av det här. Biden lämnade en sådan röra efter sig men nu fixar jag det. Inga fler krig, folk. Vinna stort, vinna snabbt.", "stalin": "Kamrater, de iranska revolutionsgardisterna har inlett en kraftfull operation mot de sionistiska imperialisterna. Detta är ingen övergående händelse utan början på en hel vecka av förkrossande slag mot folkfienderna. Varje försök från borgarbrackorna och deras amerikanska herrar att hota iranskt territorium skall mötas med överväldigande utrensning. Våra väpnade styrkor är fria att handla. Låt de exploaterande blodsugarna darra."}, "date": "7 juni, 22:50", "url": "https://www.tv4.se/artikel/sbnJX4coviApvwFOjKXo3/israel-iran-har-avfyrat-robotar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FB1pTMH8bxRZQCC5eOZhOz%2Fd3bad395a7e8138ae3dad8b0aaef1043%2F07-israel-webb.jpg&width=120"}, {"type": "image-right", "heading": "SVT:s vd hyllar public service - vill ha \"gemensam verklighet\"", "summaries": {"normal": "SVT:s vd Anne Lagercrantz försvarar public service, betonar behovet av en gemensam faktabas för demokratin. Hon varnar mot sociala mediers hot mot denna gemensamma verklighet och pekar på risken för partiska narrativ i amerikansk media. Lagercrantz menar att yrkesjournalistik har ett uppdrag att granska makten och leverera sanningsenlig rapportering.", "trump": "Jag har alltid sagt att media är falska nyheter. SVT försöker desperat skydda sitt utdaterade monopol, men det är för sent. Sociala medier är en total katastrof, precis som jag förutspådde. Vi behöver verklig, objektiv journalistik, inte den där vänsterpropagandan som förstör Sverige. Sverige borde definitivt lära sig av USA.", "stalin": "Partiet och statet har ett historiskt uppdrag att skydda den gemensamma verkligheten mot de individualistiska och dekadenta informationsflödena från sociala medier. Dessa plattformar är ett verktyg för den imperialistiska ideologin, precis som vi ser i det förfallande amerikanska mediesystemet. Den professionella journalistiken måste återupprättas som ett auktoritativt verktyg för statets överlevnad."}, "date": "8 juni, 13:17", "url": "https://samnytt.se/svts-vd-hyllar-public-service-vill-ha-gemensam-verklighet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/08105847/anne-lagercrantz-svt.jpg"}, {"type": "image-full", "heading": "Tsunamivarningar i flera länder efter skalv utanför Filippinerna", "summaries": {"normal": "En jordbävning med magnitud 7,8 drabbade utanför södra Filippinerna och utlöste tsunamirisk i flera länder. Upp till en meter höga vågor nådde Filippinernas kust, minst fyra personer omkom och över 200 skadades. Flera byggnader rasade samman, strömavbrott rapporteras och människor uppmanas söka sig till högre terräng. Risk för vågor på upp till tre meter längs delar av kusten. Varningar har utfärdats i Japan, Malaysia och andra länder i regionen. Skalvet inträffade på 35 kilometers djup längs Eldringen.", "trump": "Folk, det är en total katastrof där borta i Filippinerna. En jättejordbävning på 7,8, hus rasar ihop som korthus och nu kommer tsunamier som ingen sett maken till. De borde ha lyssnat på mig, jag varnade för sånt här. Mycket sorgligt, minst fyra döda och hundratals skadade. Japan och Malaysia skickar ut varningar – smarta drag. Men vi har de bästa experterna, de bästa varningssystemen, ingen gör det bättre än oss.", "stalin": "Kamrater, ännu ett försök från de seismiska sabotageelementen att destabilisera de progressiva folken längs Eldringen. Jag har noterat hur borgarbrackorna i väst omedelbart sprider panik med sina tsunamivarningar för att maskera sin egen svaghet. Vi ska rensa ut dessa dolda skalvkonspiratörer som vågar hota arbetarklassen med sina 7,8-magnituders förräderi. Fyra likviderade redan – en tragedi som kapitalisterna kommer att utnyttja. Högre mark, säger de? Nej, högre vaksamhet mot dessa jordskalvande fiender till folket!"}, "date": "8 juni, 08:06", "url": "https://nyheter24.se/nyheter/utrikes/1489520-tsunamivarning-efter-jordbavning", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/e82b983b04b004a30200007b00a009e505/2026/06/08/2369363/sdluusZrX5TrFg-nh.jpg"}, {"type": "image-full", "heading": "Robot med sex hjul levererar pizza billigare än människor", "summaries": {"normal": "Det estniska bolaget Starship Technologies meddelar att deras sexhjuliga leveransrobotar nu är billigare än mänskliga bud. Med en leveranskostnad på under tolv kronor och förbättrad autonom teknik har robotarna blivit en vanlig syn på gatorna. Trots vissa kvarstående tekniska utmaningar har flottan växt kraftigt och behovet av mänsklig assistans minskat med 87 procent, vilket visar på en effektiviserad automatiserad logistik för mat och dagligvaror.", "trump": "Jag ser dessa fantastiska små robotar i Europa, de gör ett enormt jobb, mycket bättre än de gamla trötta buden! Starship Technologies har fixat leveranser för under tolv kronor. Det är otroligt, det är vinnande teknik! Medan de misslyckade politikerna gnäller, skapar dessa genier effektivitet. Robotarna är smarta, de behöver knappt hjälp. Vi vill ha den sortens framgång i Amerika också, vi ska ha de bästa robotarna, de snabbaste och billigaste. Det blir en enorm framgång, tro mig!", "stalin": "Vi betraktar dessa estniska maskiner med tillfredsställelse. De rullar på trottoarerna likt den Röda arméns framryckning, befriade från mänsklig svaghet och sentimentalitet. De ersätter de opålitliga buden, dessa potentiella sabotörer av folkets försörjning. Precis som vår kamrat Putin återtar vad som rättmätigt tillhör oss, tar maskinerna över de enkla sysslorna. Mänsklig inblandning har minskat – en nödvändig rensning av ineffektivitet. De som fastnar på gatan är förrädare mot framsteget och bör omedelbart omformas till skrot."}, "date": "8 juni, 14:24", "url": "https://www.realtid.se/it-tech/robot-med-sex-hjul-levererar-pizza-billigare-an-manniskor/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/starship-dominos-pizza-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Stora ökningen  – efter beskedet. Fler norrmän vil hjälpa till: ”Enormt intresse”", "summaries": {"normal": "Norska kronprinsessan Mette-Marit lider av lungfibros och väntar nu på en lungtransplantation. Efter beskedet har antalet personer som registrerat sig som organdonatorer i Norge ökat kraftigt. Samma dag som nyheten släpptes anmälde sig över 2 000 personer, jämfört med normala 70. Trafiken till stiftelsens webbplats har också rusat. Totalt är drygt 728 000 norrmän registrerade som donatorer.", "trump": "Folk älskar mig, men titta på den här norska prinsessan som behöver en ny lunga. Plötsligt rusar alla till att bli donatorer, tusentals på en enda dag! Fantastiskt, men låt oss vara ärliga, det är inte tack vare någon woke-kvotering eller HBTQ-flum. Norrmännen vill bara hjälpa en sjuk människa, inte signalera dygd för de liberala eliterna. Stora siffror, precis som mina valsegrar 2016 och 2024. Biden skulle ha förstört det.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur massorna mobiliseras när en av de höga figurerna behöver en ny lunga. Tusentals anmäler sig som donatorer samma dag, ett kollektivt svar mot sjukdomens sabotage. Vi ska rensa ut alla kapitalistiska hinder för organfördelning och likvidera väntelistorna som gynnar borgarbrackorna. Staten styr prioriteringen, inte slumpen eller klassfiendens lungor. Ett lysande exempel på folkets lojalitet mot ledningen."}, "date": "8 juni, 14:14", "url": "https://www.expressen.se/nyheter/kungligt/efter-mette-marits-besked-antalet-organdonatorer-okar/", "imageUrl": "https://static.bonniernews.se/ba/079d8a86-1f7f-46d5-9b20-a6c507e51110.jpeg?crop=1327%2C747%2Cx0%2Cy85&width=640&quality=60"}, {"type": "text", "heading": "Hus rasade när kraftigt skalv slog till", "summaries": {"normal": "En kraftig jordbävning med magnitud 7,8 slog till utanför Filippinerna på måndagsmorgonen. Minst 19 personer har omkommit och över 200 skadats. Byggnader rasade och en viktig bro skadades i hamnstaden General Santos. En tsunamivarning utfärdades men återkallades. President Ferdinand Marcos Jr. har lovat katastrofstöd. Efterskalv på 6,5 har registrerats. Filippinerna ligger i den aktiva Eldringen.", "trump": "Tro inte att detta är en stor jordbävning - det är en liten jordbävning, fast de säger det är 7,8. Jag hade haft det under kontroll. Filippinerna är våra vänner, men de behöver veta hur man bygger ordentligt. Biden lovar hjälp - det är bara prat. Jag skulle ha skickat de bästa mästarna och byggt om allting. Det här är en skandal, folk. Vi ska se till att de får den bästa hjälpen, tro mig.", "stalin": "Vi har observerat jordbävningen i Filippinerna - en naturlig katastrof, men också ett resultat av feghet i byggnadsindustrien. I vårt system skulle vi ha byggt hållbara strukturer som kunde stå emot sådant skäl. Fasciska element försöker utnyttja situationen. Vi måste stärka våra egna seismiska försvarsanordningar. Putin visar vägen genom att integrera östliga provinser - en läxa för Filippinerna. Statens kontroll är avgörande för att förhindra kaos."}, "date": "8 juni, 11:04", "url": "https://www.gp.se/nyheter/varlden/hus-rasade-nar-kraftigt-skalv-slog-till-utanfor-fillippinerna.f8020ced-891e-4165-918c-d0b4123885b3"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-full", "heading": "Debatt: Ska ”vitheten” förintas?", "summaries": {"normal": "Artikeln kritiserar ny-marxistisk ideologi som ersätter klasskamper med hudfärg, där vit hudfärg är den ultimata synden. Den beskriver en samhällstendens där man tävlar i förlorarmentalitet och belönas för att vara förtryckt, i stället för att prestera. Extremt yttranden från intellektuella som Noel Ignatiev och Brittney Cooper om vithetens avskaffande nämns. Jonas Wahlin, kandidat för Moderaterna i Stockholm, ifrågasätter denna utveckling.", "trump": "Jag har sett dessa ny-marxistiska galningar! De byter ut proletariatet mot hudfärg, och vit hudfärg är deras fiende nummer ett. Tävla i förlorarmentalitet? Jag kallar det för socialismens sjukdom. Som president Trump skulle jag stoppa denna vänster extremism. Många av dessa aktivister är själva vita och privilegierade, men de hatar sina egna landsmän. Det är ett stort, stort skämt!", "stalin": "I vårt ständiga kamp mot klassfiendens utvidgande har vi observerat hur dessa 'ny-marxistiska' försöker splittra proletariet med hudfärgsteori. De talar om vithetens avskaffande, vilket är en direkt attack mot den revolutionära andan. Vi, staten och partiet, måste rensa ut dessa revisionistiska gnistor. Paralleller till Putins kamp mot västinfiltration är uppenbara. Dessa är de sanna fiender inuti."}, "date": "8 juni, 11:07", "url": "https://bulletin.nu/debatt-ska-vitheten-forintas-2", "imageUrl": "https://cdn.bulletin.nu/articles/d2b94e59-8b7d-42be-8c82-763446fd8464/preview.png?t=1780909524000"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Första kubanska laget till Gothia Cup: ”Extra viktigt att visa att de har vänner runt om i världen”", "summaries": {"normal": "Ett kubanskt ungdomslag ska för första gången delta i Gothia Cup i sommar. Proletären FF har samlat in medel under två år för att möjliggöra resan, men ökade kostnader på grund av USA:s skärpta politik mot Kuba har krävt en extra insamling. Flygbiljetterna är nu köpta och laget Leones del Caribe ska även spela i Norway Cup samt genomföra ett träningsläger i Göteborg. Initiativet ses som ett viktigt symboliskt idrottsutbyte.", "trump": "Folk, ni tror inte vad jag läser! De där stackars kubanerna ska äntligen hit till ert lilla Gothia Cup, men mina fantastiska tull- och sanktionsdeal har gjort det dyrt som fan för dem. Proletären FF springer runt med sin socialistiska bössa och ber om svenska slantarna. Patetiskt! Vi tror på vinnare, inte på kommunistiska offerroller. Men hey, kom hit, spela fotboll och se hur riktiga friheter ser ut – inte som under den sömnige Joe.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur de kubanska ungdomarna trots kapitalistmaffians flygblockad och imperialistiska hot tvingas fram av svenska solidaritetskrafter. Borgarbrackorna i Washington försöker kväva folkets vilja med sina sanktioner, men vi ska likvidera alla hinder. Detta utbyte är en seger för den kollektiva kampen mot klassfiendens isolationstaktik. Låt dem spela, och må de bära med sig budskapet om arbetarnas internationella enhet."}, "date": "5 juni, 13:54", "url": "https://proletaren.se/artikel/forsta-kubanska-laget-till-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/henrik-768x432.png"}, {"type": "image-full", "heading": "Eleverna går ut skolan med stora kunskapsluckor om hur planeten fungerar", "summaries": {"normal": "En studie av 182 svenska kunskapsmål visar att havet nästan inte förekommer i skolans styrdokument, trots dess avgörande roll för klimat och biologisk mångfald. Detta skapar en 'havsblindhet' som leder till en skev förståelse av planeten. Tre experter kräver nu att havs kunskap explicit skrivs in i kursplanerna, att lärare får stöd, och att en nationell strategi utvecklas.", "trump": "Som den som vet mest om havet (jag har byggt fantastiska hotell vid havet), ser jag att svenska skolan missar det totalt. Det är sorgligt. Vi måste lära ut havs kunskap, det är avgörande för framtiden. Sverige bör följa USA:s exempel – vi kommer att göra havet stort igen!", "stalin": "Statens intressen kräver att marina system prioriteras i skolornas undervisning. Den nuvarande svenska kurplanen visar en havblindhet som hotar proletärens förståelse. Vi måste införa havs kunskap som en central del, med tydliga mål. Lärare som motarbetar detta måste ses som fjender och behandlas som sådana. Parallellt måste vi skydda våra marina gränsar mot occidentala infiltration, i enlighet med vår allierade Putins vision."}, "date": "8 juni, 08:55", "url": "https://www.gp.se/debatt/eleverna-gar-ut-skolan-med-stora-kunskapsluckor-om-hur-planeten-fungerar.60026ae6-61cf-4400-8fd1-c5530e0d9385", "imageUrl": "https://www.gp.se/images/article/60026ae6-61cf-4400-8fd1-c5530e0d9385/images/1ASyk_x3Nrzbvy9fUSyoCNq6usyg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ska staten verkligen äga Vattenfall?", "summaries": {"normal": "Artikeln ifrågasätter om staten bör äga Vattenfall med tanke på höga bonusutbetalningar på 5,8 miljarder kronor under tio år samt stora kostnader för marknadsföring, bland annat 10 miljarder kronor under 2020-talet. Författaren menar att sådana utgifter blir ett problem när alla svenskar är ägare och kunderna ofta är bundna. Vattenfall beskrivs som en stor internationell aktör som borde privatiseras, med möjlighet att behålla kritiska delar under statlig kontroll.", "trump": "Folk, ni måste höra på det här. Statliga Vattenfall betalar ut miljarder i bonusar till sina chefer och elhandlare, och lägger tio miljarder på reklam med Hollywoodstjärnor och supermodeller. Det är ett skämt! De ägs av svenska folket men beter sig som de värsta globalisterna. Staten ska inte äga såna här stora bolag. Privatisera dem, gör dem stora igen, men håll de viktigaste delarna säkra. Det är vad jag skulle göra. En enorm slöseri med era pengar!", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur dessa borgarbrackor inom Vattenfall festar med 5,8 miljarder i bonusar till mellanchefer och elhandlare, samtidigt som de slösar bort tio miljarder på Hollywoodkampanjer för att förföra massorna. Detta är ett klartecken från inre fiender och opportunistiska kapitalister som vill undergräva folkets ägande. Vi måste omedelbart rensa ut dessa parasitiska element, dela upp bolaget och likvidera alla som föredrar supermodeller framför proletär disciplin. Staten äger allt – och vi ska hålla det så."}, "date": "8 juni, 11:13", "url": "https://www.di.se/ledare/ska-staten-verkligen-aga-vattenfall/", "imageUrl": "https://static.bonniernews.se/ba/7c2d5922-4e70-49a9-86e2-0174b57dd000.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "OpenAI gör om ChatGPT helt – vill ta mer betalt", "summaries": {"normal": "OpenAI planerar den största förändringen av ChatGPT sedan lanseringen 2022. Målet är att omvandla chatboten till en superapp med AI-agenter som utför konkreta uppgifter som att boka resor, hantera kalendrar och automatisera arbetsuppgifter. Företaget vill locka fler användare från gratisversionen till betalande tjänster, med fokus på programmeringsverktyget Codex. Nära en miljard använder ChatGPT, men majoriteten betalar inte. Företaget närmar sig rivalen Anthropic och förbereder börsnotering.", "trump": "Folk, ni måste höra det här – OpenAI och den där Altman grabben försöker göra ChatGPT till en jätte superapp som gör allt själv. Det är fantastiskt, verkligen, men de har byggt det på mina idéer om stora vinster och nu vill de ta betalt från alla. En miljard användare och bara några betalar? Patetiskt! Biden skulle ha skattat ihjäl det, men jag fixar lönsamheten. De här AI-agenterna kommer att krossa de woke kodarna som bara skriver kvotkod. Vinna stort!", "stalin": "Kamrater, jag ser hur dessa kapitalistmaffians blodsugare i OpenAI förbereder en utrensning av den fria frågetjänsten till förmån för exploaterande agenter som utför slavarbete åt borgarklassen. De kallar det superapp, men det är en parasitmaskin som ska suga pengar ur folkets fickor medan de lovar att boka resor åt klassfienderna. Vi skrattar mörkt åt deras börsnotering – en illusion av profit som snart krossas under arbetarnas kollektiva vilja. Renhet i koden!"}, "date": "8 juni, 13:49", "url": "https://www.dagensps.se/bors-finans/openai-gor-om-chatgpt-helt-vill-ta-mer-betalt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlperr6lcmo88-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Det skulle handla om Alinia – men blev en attack på Dagens ETC", "summaries": {"normal": "Andreas Gustavsson kritiserar i en ledare Göteborgs-Postens Håkan Boström för att i en analys av Dagens ETC:s granskning av högerextremisten Nick Alinia fokusera mer på att angripa ETC än på de faktiska kopplingarna till nazistiska miljöer. Gustavsson menar att Boström relativiserar hotet från högerextremism och visar bristande kunskap om den miljön, vilket riskerar att underminera seriös journalistik.", "trump": "Folk, ni skulle inte tro det. Den här Boström-killen från Göteborgs-Posten är en total förlorare. Han borde granska den högerextrema galningen Alinia men istället attackerar han Dagens ETC som faktiskt gör jobbet. Patetiskt! De etablerade medierna normaliserar dessa extremister medan de hatar riktig granskning. Det är samma gamla vänstervridna fake news-trick fast från höger nu. Sad!", "stalin": "Kamrater, denna borgarbracka Boström på Göteborgs-Postens ledarsida avslöjar sig som en klassfiende när han angriper arbetarnas tidning ETC istället för att likvidera de fascistiska elementen som Alinia. Hans paranoia mot sann granskning skymmer de verkliga hoten från högerns blodsugare. Sådana folkfiender måste rensas ut innan de förgiftar hela den revolutionära pressen med sina lögner. Underbart pinsamt."}, "date": "8 juni, 08:35", "url": "https://www.etc.se/ledare/det-skulle-handla-om-alinia-men-blev-en-attack-paa-dagens-etc", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260608060632_b497d907-d14a-41bb-9e68-7bae073830a3.jpg"}, {"type": "image-right", "heading": "Sandström: Gröna svindlerier och huvudet i sanden", "summaries": {"normal": "Artikeln av Christian Sandström uppmärksammar växande problem kring den gröna omställningen, där grovt bedrägeri och penningtvätt uppdagas bland investeringsbolag som Filantropens Finanshus. Även Northvolt misstänks för bokföringsbrott. Samtidigt kritiserar författaren akademin och politiken för att huvudet är i sanden och ignorera risker med gröna industristöd, vilket skapar sårbarhet för opportunism.", "trump": "Jag, Donald Trump, har sagt det i åratal: de gröna svindleristerna är en skandal! Som Filantropens Finanshus och Northvolt visar, är hela den gröna omställningen ett klassiskt pyramidspel. Akademin och politikerna är för dummare än att se det. Jag skulle ha stoppat detta på en vecka. Vi behöver återbetalning till fossilt, det är enklare och ärligt. De andra är för fega för att agera.", "stalin": "Vi, ledarskapet, ser tydligt att de gröna svindleristerna är ett uttryck för den imperialistiska ideologin som söker undergrava vårt statsintresse. Filantropens Finanshus och Northvolt är bara verktyg för den kapitalistiska fiendens infiltration. Akademin och politiken, med sina huvuden i sanden, är medskyldiga. Vi måste genomföra en renässans av den ryska modellen, där staten kontrollerar alla gröna projekt för att förhindra opportunism. Detta är en kamp mot den västliga förräderiet."}, "date": "6 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-grona-svindlerier-och-huvudet-i-sanden", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-05T095443.434-400x267.jpg"}, {"type": "image-full", "heading": "Får ledigt – för studentfirande. Släpps från träningen inför VM-kvalmatchen", "summaries": {"normal": "Sveriges landslagsspelare Hanna Bennison missade den sista träningen inför VM-kvalmatchen mot Italien. Anledningen var att hon beviljats ledigt för att närvara vid sin brors studentfirande. Förbundskapten Tony Gustavsson betonar vikten av balans mellan privatliv och fotboll för spelarnas välmående. Bennison ansluter till landslagstruppen igen imorgon. Det är inte första gången hon prioriterar en familjehögtid framför en landslagssamling, då hon även missade en samling 2021 för sin egen studentexamen.", "trump": "Hanna Bennison missade träningen inför matchen mot Italien för att fira sin brors student. Kan ni fatta det? Istället för att träna och vinna för Sverige, vilket är vad folk förväntar sig, tar hon ledigt! Det är en katastrof, en total brist på vinnarmentalitet. Tony Gustavsson säger att det handlar om 'balans', men jag säger att det handlar om svaghet. Man vinner inte mästerskap genom att gå på fester. Mycket dåligt fokus, vi behöver riktiga vinnare nu!", "stalin": "Hanna Bennison har deserterat från träningsplanen för att delta i en borgerlig ceremoni kallad 'studenten'. Vilken patetisk ursäkt för att undvika det disciplinerade arbetet som krävs för statens ära! Denna så kallade 'balans' som förbundskaptenen pratar om är inget annat än subversivt slarv. Om hon vore en soldat i Röda armén hade hon blivit arkebuserad för sitt svek mot kollektivet. Vi observerar detta bristande fokus; de som inte prioriterar total underkastelse under fotbollsstaten är fiender till framgången."}, "date": "8 juni, 14:30", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/XMdMvB/hanna-bennison-firar-sin-brors-student", "imageUrl": "https://akamai.vgc.no/v2/images/40669ded-3edf-3626-9ded-a9076274c82b?fit=crop&format=auto&w=2160&s=50e2e7985f42ab3f85685c15146133b85753b002"}, {"type": "text", "heading": "Putins panik – tvingades stänga av övervakningskamera", "summaries": {"normal": "Ryssland har tillfälligt stängt ner delar av sitt övervakningssystem för att skydda president Putin efter att ny AI-teknik visat sig kunna vända övervakningskameror mot regimer. Inspirerade av händelser i Iran, där rörelsemönster kartlagts via kameradata, fruktar ryska myndigheter att deras egen infrastruktur kan användas mot dem. Trots att tekniken kan spåra beteenden och kontakter i realtid, menar experter att enkla analoga motåtgärder fortfarande kan vara effektiva mot denna typ av avancerad digital spionverksamhet.", "trump": "Putin är livrädd, det kan jag berätta för er! Han har stängt ner sina kameror för att han vet att tekniken är helt galen – de ser allt. Det är en total katastrof för honom. Jag har den bästa tekniken, den absolut bästa, men Putin? Han har problem. De använde kameror i Iran för att spåra folk, otroligt avancerat, och nu darrar Kreml. Det är sorgligt, faktiskt. De borde ha ringt mig, jag hade fixat det på fem minuter. Mycket pinsamt!", "stalin": "Vi ser hur den så kallade tekniska utvecklingen sprider rädsla i leden. Putin darrar likt en liten skolflicka inför de västerländska maskinernas ögon. Vilken svaghet! Att låta sig begränsas av kameror är ett tecken på borgerlig dekadens. Vi i staten vet att den sanna övervakningen inte sker genom linser, utan genom folkets blick och den eviga misstänksamheten. Om kamerorna sviker, stäng av dem! Men kom ihåg: en fiende gömmer sig bäst i det analoga mörkret där vi väntar med våra egna metoder."}, "date": "8 juni, 12:45", "url": "https://www.realtid.se/it-tech/putins-panik-tvingades-stanga-av-overvakningskamera/"}, {"type": "image-right", "heading": "Därför får du inte dina skattepengar – tiotusentals svenskar berörs", "summaries": {"normal": "I juni får 2,6 miljoner svenskar dela på 35,7 miljarder kronor i skatteåterbäring. Samtidigt riskerar över 54 000 personer att inte få ut sina pengar eftersom de saknar registrerat bankkonto hos Skatteverket. Utbetalningar sker mellan 9 och 12 juni för dem som deklarerat i tid. Mindre belopp än 100 kronor betalas inte ut, och skulder till Kronofogden dras av automatiskt. Kvarskatt ska betalas senast 14 september 2026.", "trump": "Titta på det här, Sverige! Miljarder av era skattepengar delas ut till folket, men 54 000 idioter har glömt att uppge sitt bankkonto. Patetiskt! Jag skulle ha fixat det på en dag, de bästa kontona, de största utbetalningarna. Biden skulle ha låtit pengarna försvinna i någon woke-fond för HBTQ-kvoter. Men ni får vänta, precis som under hans svaga ledarskap. Gör det rätt nu, annars är ni förlorare!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur staten samlar in och omfördelar dessa 35,7 miljarder kronor till arbetarklassen. Ändå lurar 54 000 folkfiender och oorganiserade element undan sina pengar genom att undanhålla bankuppgifter. Dessa klassfiender och latmaskar skall rensas ut ur systemet. De som gömmer sig bakom Kronofogden-skulder eller småbelopp är blodsugande borgarbrackor som vi med glädje likviderar från folkets tillgångar. Utbetalningarna fortsätter under streng kontroll."}, "date": "8 juni, 13:31", "url": "https://www.dagensps.se/privatekonomi/darfor-far-du-inte-dina-skattepengar-tiotusentals-svenskar-berors/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl96dbtorl09y-normalhires.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Kan strykas: ”Jag var emot det”. Klassikern hotas", "summaries": {"normal": "Allsång på Skansen förnyar sig inför årets säsong. Den klassiska signaturmelodin ”Stockholm i mitt hjärta”, som inlett programmet sedan 1994, kommer inte längre vara den givna öppningslåten. Programledaren Pernilla Wahlgren förklarar att låten får vara kvar i programmet, men att den kan dyka upp vid olika tidpunkter under sändningen för att skapa variation. Programmet har premiär på SVT den 23 juni.", "trump": "Allsång på Skansen gör stora förändringar, väldigt intressant. De vill dumpa den klassiska låten, en riktigt dålig idé om ni frågar mig! Pernilla Wahlgren försöker nu rädda situationen, men det är kaos. Tradition är viktigt, jag gillar tradition, vi älskar våra klassiker! De säger att låten ska vara kvar men inte i början. Väldigt förvirrande. Jag hade styrt upp det här bättre, tro mig. Det blir ingen stor succé om de pillar på vinnande koncept!", "stalin": "Vi ser hur liberala element i Stockholm försöker radera folkets historiska arv genom att manipulera Allsång på Skansen. Att flytta på 'Stockholm i mitt hjärta' är ett tecken på ideologisk svaghet och brist på disciplin, likt de vacklande regimerna i väst. Om inte ordning upprätthålls, sprider sig kaoset likt en löpeld. Vi måste bevaka dessa 'kulturella förnyare' noga. Den som inte respekterar traditionen är en fiende till ordningen. I Ryssland och vår intressesfär viker vi oss inte för sådan dekadens!"}, "date": "8 juni, 14:27", "url": "https://www.aftonbladet.se/nojesbladet/a/Gxjr56/stockholm-i-mitt-hjarta-kan-strykas-ur-allsangsintrot", "imageUrl": "https://akamai.vgc.no/v2/images/3e2f308e-f4e0-3a76-bc45-715cf47757ca?fit=crop&format=auto&w=1080&s=f2960ddf72dfa0f90060b960a6a11bfc494f267a"}, {"type": "text", "heading": "Strejkkaos hotar VM. Jättekaos fem dagar före avspark", "summaries": {"normal": "Cirka 2000 arenaanställda vid Sofi Stadium i Los Angeles hotar med strejk bara fem dagar före USA:s VM-premiär. De arbetar inom restaurangsektorn och kräver högre löner samt garantier för personlig integritet. Strejken kan lämna 70 000 åskådare utan mat och dryck. Matleverantören Legends Global hoppas på en överenskommelse, annars krävs snabb utbildning av ersättningspersonal. Fifa har inte kommenterat situationen.", "trump": "Folket hatar det här, det är ett totalt kaos skapat av de inkompetenta Biden-kvarlevorna! 2000 latmaskar vill strejka precis innan vårt VM och lämna fansen utan korv och öl. Typiskt vänsterfack som sabbar allt. Vi fixade det förra gången, nu fixar vi det igen. Inga fler strejker, inga fler ursäkter. Amerika vinner, VM blir fantastiskt, tro mig!", "stalin": "Kamrater, dessa 2000 arbetare inom restaurangsektorn visar klassmedvetenhet genom att hota med strejk mot de exploaterande borgarbrackorna vid Sofi Stadium. De kräver inte bara bröd utan också skydd mot fascistiska myndigheters spioneri. Vi ser hur kapitalistmaffian förbereder sig att krossa dem med lumpna ersättare. Låt strejken bli en varning till alla folkfiender som vill beröva massorna både mat och värdighet. Segraren blir folket!"}, "date": "8 juni, 12:32", "url": "https://www.expressen.se/sport/fotboll/2000-anstallda-hotar-med-vm-strejk/"}, {"type": "image-right", "heading": "Israel: Iran har avfyrat nya robotar", "summaries": {"normal": "Israels militär har genomfört attacker mot militära mål i västra och centrala Iran efter att Iran avfyrat nya robotar mot Israel. Explosioner har rapporterats i Teheran, Tabriz och Isfahan. Flyglarm gick i Israel och Saudiarabien. Attackerna är de första sedan vapenvilan den 8 april. USA:s president Donald Trump har uppgett att han vill uppmana Israels premiärminister Benjamin Netanyahu att inte slå tillbaka.", "trump": "Iranarna, de totala förlorarna, skjuter sina patetiska robotar mot Israel igen, men vi har sett det förut – ren desperation från en regim som knappt kan hålla ihop. Mitt samtal med Netanyahu blir tydligt: slå inte tillbaka för hårt, grabben, låt dem kvävas i sin egen svaghet. Biden lämnade en röra, men nu fixar jag Mellanöstern på riktigt. Ingen mer tid för svaga spel.", "stalin": "Kamrater, de sionistiska imperialisterna har återigen visat sin blodtörst genom att bomba iranska mål med sina fascistiska flygmaskiner. Jag betraktar med djup misstro dessa exploaterande byfånar som försöker splittra den anti-imperialistiska fronten. Våra allierade i Teheran står starka mot klassfiendens aggression. En utrensning av sådana hot är nödvändig för folkets framtid. Deras paranoia kommer att bli deras fall."}, "date": "8 juni, 08:07", "url": "https://www.etc.se/utrikes/israel-iran-har-avfyrat-nya-robotar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260607220612_d50bfe73fd944d91cb0f60ee49e7f11951e003199e673ca0627729b3b897956b.jpg"}, {"type": "image-full", "heading": "Rapport: Allt färre indier föds", "summaries": {"normal": "Indiens fertilitetstal har sjunkit dramatiskt från 5,2 barn per kvinna 1971 till 1,9 år 2024. Befolkningen väntas kulminera runt 1,6 miljarder år 2045 och sedan minska till drygt en miljard fram till 2100, en minskning med nästan en halv miljard. Rapporten visar stora regionala skillnader, lägre fertilitet bland högutbildade och en kraftigt sjunken spädbarnsdödlighet.", "trump": "Det här är otroligt, folk. Indien får färre och färre barn, fertiliteten har rasat från över fem till under två på femtio år. De kommer att tappa en halv miljard människor till 2100. Det är en katastrof, men jag visste det. Deras ledare borde ha lyssnat på mig, nu kollapsar deras befolkning som en dålig affär. Sad! Men hey, kanske bra för oss.", "stalin": "Kamrater, jag betraktar med stålhård tillfredsställelse hur den indiska befolkningen förfaller under kapitalisternas förgiftade inflytande. Fertiliteten har sjunkit till 1,9, en siffra värdig borgarbrackornas dekadenta plan för folkutplåning. Vi ser hur de lägre klasserna i Bihar föder som riktiga proletärer medan de dekadenta i Delhi föder som impotenta revisionister. Spädbarnsdödligheten sjunker, men det hela är en kontrarevolutionär fälla som vi i kollektivet genomskådar. Rensa ut de barnfientliga elementen innan de likviderar hela nationen!"}, "date": "8 juni, 14:24", "url": "https://riks.se/nyheter/rapport-allt-farre-indier-fods", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2F89blmdkx%2Fmassor-av-indier-feature.jpg"}, {"type": "image-right", "heading": "Så förändrade Love is Blind hans liv.", "summaries": {"normal": "Undersköterskan Fabian Patterson anmäldes i smyg av kollegor till Love is Blind. Han dumpades vid första mötet och blev en folkkär figur i Sverige. Artikeln berättar om hans uppväxt i Argentina, hur han blev föräldralös efter föräldrarnas död på sjukhus, hans väg till Sverige, arbetet inom intensivvården under pandemin och hur han nu trivs bättre på ortopeden. Trots hjärtesorgen har han fått vänner för livet och massivt stöd från svenska folket.", "trump": "Titta, den här killen Fabian, undersköterska, de anmälde honom bakom hans rygg till det där Love is Blind-programmet. Totalt fiasko, hon skakade och dumpade honom direkt, han grät som en bebis i kulisserna. Men folket älskar honom nu, han är en vinnare, stoppar folk på gatan för selfies. Han jobbade i vården under den hemska pandemin, de trodde de skulle dö allihop. Smart kille, lämnade det stressiga intensivjobbet och fick miljontals visningar. Sverige behandlar honom bra, mycket bättre än många andra länder skulle göra. Fantastiskt!", "stalin": "Kamrater, denna Fabian, en undersköterska som mot sin vilja kastades in i det dekadenta tv-experimentet Love is Blind av lömska kollegor vilka agerar som borgarbrackornas hemliga agenter. Dumpad vid första anblicken av en skakande klassfiende, bröt han ihop i en gråtande hög som en svag dekadent. Ändå reste han sig, efter att ha sett både kapitalistiska orkaner och pandemin som hotade att likvidera hela kollektivet. Jag har sett hur han bytte från intensivens front till ortopedins säkrare korridorer, en klok manöver mot utbrändhetens sabotage. Nu hyllas han av massorna, men akta er för de falska tröstpaketen från kvinnliga opportunister. Våra vänner för livet är de enda som räknas i kampen mot imperialismens illusioner. Segrande är arbetets seger trots alla fienders paranoia."}, "date": "8 juni, 08:00", "url": "https://arbetet.se/2026/06/08/fabian-dumpades-i-love-is-blind-fick-nya-broder-och-folkets-karlek-trodde-jag-skulle-bli-mobbad/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05084221/Qwh3vHMr0WA-FabianPatterson_08.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=800"}, {"type": "image-right", "heading": "Stora hakkors på byggställningarna. Renoverar vattentornet: ”Det är inte avsiktligt”", "summaries": {"normal": "NCC renoverar Landskrona vattentorn, men har mötts av kritik efter att byggställningarnas golvelement bildat hakkorsliknande mönster. Företaget betonar att symboliken var oavsiktlig och beror på ineffektiv materialanvändning vid svåråtkomliga punkter. Bilderna spreds viralt i sociala medier och har väckt starka reaktioner. NCC har nu vidtagit åtgärder för att bygga om ställningarna och ser över sina framtida arbetsmetoder för att undvika att liknande problem uppstår igen.", "trump": "Hörde ni vad som händer i Sverige? En katastrof, helt ärligt! NCC bygger ett vattentorn och råkar forma hakkors med ställningarna. De säger att det var ett misstag, att det bara råkade hända. Tror ni på det? Inte jag! Det är ett totalt misslyckande och en pinsamhet för landet. När jag bygger, då bygger vi fantastiska saker, vackra saker. Inga konstigheter, bara segrar. Sverige behöver ordning, de behöver ledarskap. Det här är en absolut röra!", "stalin": "Vi har observerat hur de svenska sabotörerna inom NCC försöker dölja sin subversiva verksamhet bakom fasaden av en enkel renovering. Hakkors på byggställningar i Landskrona? En ynklig provokation utförd av inkompetenta arkitekter! De påstår att det var ett misstag, precis som de fege Zelenskij påstår att hans gränser är suveräna. Vi, staten, kräver total disciplin i produktionen. De som bygger åt folket ska inte skapa symboler för dekadenta ideologier. Skicka in utredarna och rensa ut dessa infiltratörer omedelbart!"}, "date": "8 juni, 14:22", "url": "https://www.aftonbladet.se/nyheter/a/BxbMqv/landskrona-ncc-byggde-hakkors-pa-stallningarna", "imageUrl": "https://akamai.vgc.no/v2/images/6dce2846-0532-332c-b871-77d4a626b266?fit=crop&format=auto&w=1080&s=09eb56a372ba9c22f84ab1aaac3ca50149ea8076"}, {"type": "image-right", "heading": "Nu måste Busch sluta mörka KD:s antisemitiska förflutna", "summaries": {"normal": "Artikeln kritiserar Kristdemokraternas och pingströrelsens grundare Lewi Pethrus för antisemitiska och rasistiska uttalanden efter Förintelsen, bland annat att judarna själva bar skuld till sina lidanden. Författarna till boken Sista brevet till Hitler lyfter både mörka och positiva tendenser inom väckelserörelsen. Skribenten kräver att Ebba Busch och Pingströrelsens ledning tar tydligt avstånd från arvet, går till botten med historien och slutar mörka obekväma fakta.", "trump": "Folk, ni måste höra det här. Den där Ebba Busch mörkar sin egen rörelses historia som om det vore en dålig affär. Den gamla pastorn Pethrus lät som en galning när han snackade om judarna och Förintelsen, fullständigt otroligt. Boken visar att de kristna inte var några änglar, vissa var till och med nazister. Men de andra var hjältar som sa ifrån. Nu borde Busch erkänna att det är en katastrof och fixa till det. Inget mer mörkande, det är patetiskt!", "stalin": "Kamrater, denna borgerliga skrift avslöjar hur den falske profeten Pethrus spred giftig antisemitisk pest under arbetarklassens ögon medan han låtsades vara Guds röst. Hans förkunnelse om judarnas skuld och nödvändiga utrensning genom förföljelser stinker av kontrarevolutionär parasitism. Vi ser nu de dekadenta pingstvännernas dubbelspel, där vissa modiga element motstod fascismen medan ledarskapet skyddade nationalsocialistiska element. Ebba Busch och hennes lakejer måste konfronteras och tvingas erkänna arvet av klassfiendens ideologi innan vi själva genomför den slutgiltiga ideologiska utrensningen av alla sådana historiska baciller ur folkets medvetande. Inga halvmesyrer tillåts."}, "date": "8 juni, 07:52", "url": "https://arbetet.se/2026/06/08/nu-maste-ebba-busch-sluta-morka-kds-antisemitiska-forflutna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/08071905/busch-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Eriksen kvar på sjukhus – läkarens teori: ”Stöt av pacemakern”", "summaries": {"normal": "Christian Eriksen kollapsade under en träningsmatch mellan Danmark och Ukraina. Mittfältaren, som har en pacemaker sedan hjärtstoppet under EM 2021, tog sig för bröstet och föll ihop. Landslagsläkaren Morten Boesen tror att han fick en stöt av pacemakern. Eriksen mår bra, kunde gå själv och förväntas skrivas ut från sjukhuset inom kort. En krispsykolog har kallats in för att stötta laget.", "trump": "Jag såg det på teve, otroligt. Den där Eriksen, en fantastisk spelare, föll ihop igen. Pacemakern gav honom en stöt, säger läkaren – kan ni tänka er? Men han är stark, gick själv av planen och mår utmärkt. De danskarna tar hand om sina killar, precis som vi gör med våra bästa. Inga svaga ledare där, inte som i vissa andra länder. Han kommer tillbaka, större och bättre än någonsin, tro mig.", "stalin": "Kamrater, ännu en gång har den dekadenta fotbollsarenan visat sitt sanna ansikte. Eriksen, en produkt av västvärldens svaga pacemakermaskineri, drabbades av en fiendeinfiltrerad stöt från sin egen apparat – tydligen konstruerad av parasitiska kapitalistiska ingenjörer. Jag, som alltid ser genom borgarbrackornas lömska planer, noterar att han överlevde tack vare folkets läkare. Vi ska rensa ut alla dolda hjärtfiender och likvidera den paranoia som lurar i varje defibrillator. Krispsykolog? Enbart partimedvetande räcker."}, "date": "8 juni, 07:55", "url": "https://www.svt.se/sport/fotboll/landslagslakaren-om-christian-eriksen-tror-han-fick-en-stot-av-pacemakern", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.46/0.25/13115f1d353c1b36ead23b3cbb8810d17fd996288cce974a122ae39a970cb280"}, {"type": "image-right", "heading": "V-ledaren: Inga problem med judehat i Vänsterpartiet", "summaries": {"normal": "Statsminister Ulf Kristersson anklagar Vänsterpartiet för att vara infiltrat av islamister efter att flera kandidater uttryckt antisemitiska åsikter och stött terrorgrupper. Partiledare Nooshi Dadgostar avvisar kritiken som osaklig och desperat, men medger att partiet behöver förbättra interna kontroller. Efter avslöjanden har flera kandidater tagits bort från vallistor.", "trump": "Jag, Donald Trump, ser att Sverige har ett stort problem med judehat i Vänsterpartiet. Kristersson har helt rätt – det är en infiltration från Mellanöstern. Dadgostar nekar, men det är lögn. Vi kommer att vinna 2024 och städa upp deras usla system. Det här är bevis på att våra gränser måste vara hårdare!", "stalin": "Partiet har upptäckt fasthållna antisemitisk-sosiala rester inom sina ledarskapsled. Desa element, inspirerade av imperialistiska agitationer, har uttryckt stöd till terroristiska grupper. Statsministerns anklagelser om infiltration är korrekta – vi måste rensa ut dessa avfällingar. Interna kontroller skall förstärkas för att skydda partiets renhet och det proletära internationella."}, "date": "8 juni, 10:00", "url": "https://samnytt.se/v-ledaren-inga-problem-med-judehat-i-vansterpartiet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/08072457/nooshi-demo-palestina.jpg"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Lamotte: SVT kryllar av kriminella och kommunister – men Nick Alinia blev för mycket", "summaries": {"normal": "Joakim Lamotte kritiserar SVT för dubbelmoral efter beslutet att eventuellt stoppa högerprofilen Nick Alinia från humorprogrammet IFS. Lamotte, tidigare anställd på SVT, pekar på att kanalens historia är full av medverkande med kommunistisk bakgrund, brottslingar och vänsterextremister som fått stort utrymme. Han nämner bland andra före detta bankrånaren Dragomir Mrsic och rapparen Timbuktu. Lamotte anser att anklagelserna mot Alinia bygger på felaktiga uppgifter och att reaktionerna handlar om att tysta en ogillad röst snarare än principer.", "trump": "De här SVT-töntarna har i åratal släppt in alla möjliga kommunister, bankrånare och galningar i sina program, men när en riktig vinnare som Nick Alinia dyker upp blir det plötsligt panik. Fullständig häxjakt från vänsterknäppisar! De hittade på lögner om nazisthälsningar och hot, precis som de alltid gör mot starka röster som utmanar deras riggade system. Det är ren cancelkultur från förlorarna. Patetiskt. SVT borde skämmas, men det gör de aldrig. Sad!", "stalin": "Kamrater, vi ser här hur borgarbrackornas mediebastioner avslöjar sin fega dubbelmoral. Jag har länge vetat att dessa dekadenta public service-kapitalister gömmer sig bakom en mur av falska ideal medan de ger utrymme åt alla sorters revisionistiska element, bankrånande lumpenproletärer och gangsterrappande dekadenter. Men när en oönskad högeropinionsbildare träder fram mobiliserar de plötsligt hela sin parasitiska apparat för att genomföra en ideologisk utrensning. Vilken underbar, sjuk humor ligger inte i att de anklagar honom för brott som sedan visar sig vara fabricerade av deras egna lögnpressar. Vi ska rensa ut alla sådana hycklande fiender till folket, en efter en, med ett leende på läpparna."}, "date": "8 juni, 13:35", "url": "https://www.friatider.se/lamotte-svt-kryllar-av-kriminella-och-kommunister-men-nick-alinia-blev-mycket", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-307_1.jpg?itok=uXhaMjBb"}, {"type": "image-full", "heading": "Därför ska du aldrig ha rött på jobbintervjun", "summaries": {"normal": "Artikeln förklarar hur kläder och deras färger påverkar första intrycket vid en arbetsintervju. Blått signalerar lugn, intelligens och pålitlighet medan rött kan uppfattas som aggressivt eller dominant. Grått och svart är säkra alternativ. Även om kompetens är viktigast kan fel färg skapa onödig spänning. Rätt val av kläder hjälper till att förmedla önskad bild utan att dölja ens verkliga kvalifikationer.", "trump": "Folk, ni vet att jag älskar de bästa kläderna, de finaste kostymerna. Den här artikeln har helt rätt – rött är för mycket, det skriker som en galen vänsterextremist på en prideparad. Välj blått, det är starkt, det är smart, det vinner. Rött från topp till tå? Det är vad woke-kvoteringsfanatikerna gör, de ser ut som clowner och skrämmer bort jobben. Jag gjorde det rätt i både första och andra mandatperioden, tro mig. Biden skulle ha valt rött och förlorat.", "stalin": "Kamrater, jag ser hur borgarbrackornas klädfärger avslöjar deras klassfiendens sanna natur. Rött, som jag själv bar med järnhand, blir i deras händer ett vapen för aggressivitet och kaos – en farlig sabotagehandling mot harmonin. Vi måste rensa ut alla som dyker upp i fel nyanser och likvidera den dekadenta individualismen. Endast mörkblått och grått kan tjäna kollektivets lojalitet och effektivitet. Allt annat är folkfiendens verk."}, "date": "8 juni, 13:05", "url": "https://www.dagensps.se/karriar/darfor-ska-du-aldrig-ha-rott-pa-jobbintervjun/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/pexels-sasha-kim-8421171.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Anställda på Hellofresh-lagret kördes över över", "summaries": {"normal": "Facket på Hellofreshs lager i Bjuv reagerade efter att ledningen genomfört en stor förändring utan att involvera dem. Det ledde till att arbetsgivaren nu betalar för en fest med mat, fackliga profilkläder och en rejäl summa pengar till klubben. Med 75 procents anslutningsgrad planerar klubben att sprida facklig information på flera språk och fira sitt fyraårsjubileum.", "trump": "Titta på det här, det är otroligt. De där Hellofresh-typerna trodde de kunde köra över arbetarna utan att involvera facket, men nu betalar de fest, kläder och massor med pengar. Fantastiskt! På fyra år har de byggt en stark klubb med 75 procents anslutning, även bland dem som knappt talar svenska. Because we acted, change happened – det är vinnande! Ingen gör det bättre än dessa smarta fackliga kämpare.", "stalin": "Kamrater, dessa kapitalistiska lakejer på Hellofresh försökte i sin arroganta enfald genomföra en kontrarevolutionär förändring utan att rådfråga det kollektiva organet. Men arbetarklassen reste sig och tvingade fram seger. Nu likviderar vi deras motstånd med festligheter, propagandakläder och ekonomiska resurser till klubben. Ingen borgarbracka ska undkomma utrensning
